<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ریست دسترسی | مستر پلنر</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(155deg, #06202b, #0c3846, #1e5a6e);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; margin: 0; direction: rtl;
  }
  .box {
    background: #fff; border-radius: 16px; padding: 40px 24px;
    max-width: 420px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .icon { font-size: 3rem; margin-bottom: 16px; }
  h1 { color: #0c3846; font-size: 1.3rem; margin: 0 0 12px; }
  p { color: #5a6c7d; font-size: 0.9rem; line-height: 1.9; margin: 0 0 20px; }
  .status {
    padding: 14px; border-radius: 10px; font-weight: 700;
    margin-bottom: 20px; font-size: 0.9rem;
  }
  .status.ok { background: #e8f5e9; color: #2e7d32; }
  .status.no { background: #ffebee; color: #c62828; }
  .links a {
    display: block; padding: 14px; margin: 8px 0;
    background: #0c3846; color: #fff; text-decoration: none;
    border-radius: 10px; font-weight: 700; font-size: 0.95rem;
  }
  .links a.secondary {
    background: #fff; color: #0c3846; border: 2px solid #0c3846;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🔓</div>
    <h1>ریست دسترسی</h1>
    <div id="status" class="status ok">✅ دسترسی این مرورگر پاک شد.</div>
    <p>حالا می‌توانی صفحه ورود را ببینی و رمز بزنی. اگر رمز نداری، از صفحه ورود با ادمین در ارتباط باش.</p>
    <div class="links">
      <a href="../atlas/atlas.html">رفتن به اطلس مشاغل</a>
      <a href="../mastery/mastery.html">رفتن به ابزار تمرین</a>
      <a href="../sales/sales.html" class="secondary">صفحه اشتراک</a>
      <a href="../" class="secondary">بازگشت به خانه</a>
    </div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('status');
      try {
        localStorage.removeItem('mp_access_v1');
        Object.keys(localStorage).forEach(function (k) {
          if (k.indexOf('mp_access') > -1) localStorage.removeItem(k);
        });
        el.className = 'status ok';
        el.textContent = '✅ دسترسی این مرورگر پاک شد.';
      } catch (e) {
        el.className = 'status no';
        el.textContent = '❌ خطا: ' + e.message;
      }
    })();
  </script>
</body>
</html>
