<style>
*{box-sizing:border-box;margin:0;padding:0}

<header><div class="w hd"><span class="brand">🧭 نقشهٔ یادگیری</span><select id="ss" aria-label="دانشآموز"></select><button class="btn sm" data-a="new">+ پرونده</button></div></header>

<script>
(()=>{
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:0}),dt=t=>new Date(t).toLocaleDateString('fa-IR');
const P={attention:['توجه','#ef4444','🎯'],executive:['کارکردهای اجرایی','#f59e0b','🧩'],memory:['حافظه و یادگیری','#10b981','🗄️'],speed:['سرعت پردازش','#3b82f6','⚡'],visual:['دیداری-فضایی','#8b5cf6','👁️'],auditory:['پردازش شنیداری','#06b6d4','👂'],language:['مهارتهای زبانی','#ec4899','💬'],motor:['حسی-حرکتی','#14b8a6','✋']};
const K=Object.keys(P);
const ITEMS=[['attention','با کوچکترین صدا یا حرکت اطراف حواسش پرت میشود.'],['attention','برای تمام کردن یک تکلیف، نیاز به یادآوری مکرر دارد.'],['attention','در خواندن یا نوشتن، جاهایی از متن را جا میاندازد.'],['attention','برای تمرکز روی یک کار، بیش از همسنهایش تلاش میکند.'],['attention','وقتی چند دستور پشتسرهم میگیرد، فقط بخشی را انجام میدهد.'],['executive','برای شروع تکالیف، نیاز به تشویق یا یادآوری بیرونی دارد.'],['executive','برنامهریزی یک کار چندمرحلهای برایش سخت است.'],['executive','وقتی از کاری خسته میشود، نمیتواند تا پایان تحمل کند.'],['executive','در حل مسئله، بدون فکر کردن به راهحل میپرد.'],['executive','تغییر از یک فعالیت به فعالیت دیگر برایش دشوار است.'],['memory','مطلبی که دیروز یاد گرفته، امروز فراموش کرده است.'],['memory','برای یادگیری، به تکرار بیشتر از همسنها نیاز دارد.'],['memory','در بهخاطر آوردن اسامی یا کلمات مشکل دارد.'],['memory','پس از چند روز، جزئیات مطلب را به یاد نمیآورد.'],['memory','برای ذخیرهٔ مطلب، به کمک بصری یا نوشتاری نیاز دارد.'],['speed','در تکالیف زماندار، خیلی کندتر از همسنها عمل میکند.'],['speed','پاسخ دادن به سؤالهای کلاس برایش وقتگیر است.'],['speed','تکلیف را درست میفهمد اما خیلی دیر تحویل میدهد.'],['speed','در آزمونهای زماندار، بخشی از سؤالها را ناتمام میگذارد.'],['visual','در کپی کردن از تخته یا کتاب، خطاهای زیاد دارد.'],['visual','جهتها (چپ/راست، بالا/پایین) را اشتباه میگیرد.'],['visual','در مرتب کردن یا پیدا کردن وسایل، مشکل دارد.'],['visual','حروف یا اعداد را مشابه میبیند و اشتباه میخواند.'],['visual','نقشه یا نمودار را سخت میفهمد.'],['auditory','در محیط شلوغ، حرفهای معلم را نمیفهمد.'],['auditory','وقتی کسی بلند صحبت میکند، بهتر یاد میگیرد.'],['auditory','صدای پسزمینه (پنکه، ترافیک) تمرکزش را به هم میزند.'],['auditory','دستور شفاهی را اشتباه میشنود یا کامل نمیفهمد.'],['auditory','برای درک مطلب، باید متن را با صدای بلند بخواند.'],['language','کلمهای که میخواهد بگوید را پیدا نمیکند.'],['language','جملههایش کوتاه یا ناقصاند.'],['language','در بیان داستان یا توضیح، ترتیب منطقی را گم میکند.'],['language','در خواندن، روانی کم است و مکث زیاد دارد.'],['language','در نوشتن، ساختار جملهاش اشتباه است.'],['motor','دستخطش ناخواناست یا خیلی کج است.'],['motor','در گرفتن مداد یا قیچی، مهارت کمی دارد.'],['motor','در بازیهای حرکتی (توپ، طناب) مشکل دارد.'],['motor','از فعالیتهای حرکتی اجتناب میکند.'],['motor','هنگام نوشتن، خیلی زود خسته میشود.']];
const G={attention:[['زمان کار را به بلوکهای ۱۰ تا ۱۵ دقیقهای بشکنید.','محیط مطالعه را از صدا و حرکت اضافی خالی کنید.','قبل از شروع، هدف را شفاهی بگویید: «الان فقط این ۵ سؤال».'],'اگر بعد از ۴ هفته تغییر معناداری دیده نشد، با مشاور مدرسه گفتوگو کنید.'],
executive:[['تکالیف را به قدمهای کوچک بشکنید و هر قدم را جدا بنویسید.','برای شروع، زمانبند ۵ دقیقهای بگذارید: «فقط ۵ دقیقه».','چکلیست بصری روی میز بگذارید.'],'اگر بعد از ۴ هفته تغییر معناداری دیده نشد، ارزیابی تخصصی توصیه میشود.'],
memory:[['از مرور فاصلهدار استفاده کنید (امروز، ۳ روز بعد، ۷ روز بعد).','مطلب را با تصویر و نقشهٔ ذهنی همراه کنید.','پایان هر جلسه، با کتاب بسته خلاصه بگوید.'],'اگر فراموشی شدید و مداوم است (نه فقط درسی)، با متخصص گفتوگو کنید.'],
speed:[['زمان تکالیف را بر اساس توان او تنظیم کنید، نه میانگین کلاس.','در آزمونها زمان اضافه بدهید، نه سؤال کمتر.','کیفیت را بر سرعت ترجیح دهید.'],'اگر افت تحصیلی چشمگیر است، ارزیابی تخصصی توصیه میشود.'],
visual:[['متن را با فونت درشت و فاصلهٔ خط بیشتر ارائه دهید.','از رنگ، نمودار و نقشه برای آموزش استفاده کنید.','در کپی از تخته، وقت اضافه یا برگهٔ کمکی بدهید.'],'اگر مشکل پایدار است، بیناییسنجی و ارزیابی روانشناختی توصیه میشود.'],
auditory:[['او را در ردیف جلو و دور از پنجره بنشانید.','دستورها را کوتاه بدهید و بخواهید تکرار کند.','از متن نوشتاری و ویدیوی زیرنویسدار کمک بگیرید.'],'اگر به مشکل شنوایی شک دارید، ابتدا شنواییسنجی انجام دهید.'],
language:[['از متنهای کوتاه و تصویردار شروع کنید.','قبل از نوشتن، ایدهها را شفاهی مرور کنید.','از کتاب صوتی یا متن همراه با صدا استفاده کنید.'],'اگر مشکل خواندن یا نوشتن پایدار است، ارزیابی گفتاردرمانی یا روانشناختی توصیه میشود.'],
motor:[['برای نوشتن از مداد ضخیمتر یا گیرهٔ مداد استفاده کنید.','مدت نوشتن را کوتاه و بین بخشها استراحت بگذارید.','بازیهای حرکتی روزانه (توپ، طناب) را تشویق کنید.'],'اگر مشکل حرکتی مانع پیشرفت تحصیلی است، ارزیابی کاردرمانی توصیه میشود.']};
const LK=['نمیدانم','هرگز','کم','گاهی','زیاد','همیشه'],WHO=['والدین','معلم','مشاور','خود دانشآموز'],CTX=['خانه','کلاس','هر دو'];
const uid=()=>Math.random().toString(36).slice(2,9);
const mk=(n,a)=>({id:uid(),name:n,age:a||'',as:[],logs:[],plan:null});
function load(){try{const d=JSON.parse(localStorage.getItem('mp_lm3'));if(d&&d.students)return d}catch(e){}
const d={cur:null,students:[],q:null};try{const o=JSON.parse(localStorage.getItem('mp_learning_map_v2')||'null');if(o&&o.answers){const s=mk('دانشآموز من');s.as.push({id:uid(),t:o.date,who:'والدین',ans:o.answers});d.students.push(s);d.cur=s.id}}catch(e){}return d}
let db=load(),ui={tab:'home',tp:null};
const save=()=>{try{localStorage.setItem('mp_lm3',JSON.stringify(db))}catch(e){}};
const S=()=>db.students.find(s=>s.id===db.cur);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2400)}
function sc(ans){const o={};K.forEach(k=>{const a=ITEMS.map((x,i)=>x[0]===k&&ans[i]>0?ans[i]:0).filter(Boolean);o[k]=a.length<3?null:Math.round((a.reduce((x,y)=>x+y,0)/a.length-1)*25)});o.cov=Math.round(ans.filter(v=>v>0).length/ITEMS.length*100);return o}
const top=r=>K.filter(k=>r[k]!=null).sort((a,b)=>r[b]-r[a]).slice(0,3),pc=v=>v==null?'—':fa(v)+'٪';
const flat=a=>{const v=a.ans.filter(x=>x>0);return v.length>10&&v.every(x=>x===v[0])};
function radar(r,p){const C=150,R=105,an=i=>Math.PI*2*i/8-Math.PI/2,pt=(i,f)=>`${C+R*f*Math.cos(an(i))},${C+R*f*Math.sin(an(i))}`;
const rg=[.25,.5,.75,1].map(f=>`<polygon points="${K.map((_,i)=>pt(i,f)).join(' ')}" fill="none" stroke="var(--ln)"/>`).join('');
const ax=K.map((_,i)=>`<line x1="${C}" y1="${C}" x2="${pt(i,1).split(',')[0]}" y2="${pt(i,1).split(',')[1]}" stroke="var(--ln)"/>`).join('');
const poly=(x,st)=>`<polygon points="${K.map((k,i)=>pt(i,(x[k]||0)/100)).join(' ')}" ${st}/>`;
const lb=K.map((k,i)=>`<text x="${C+(R+24)*Math.cos(an(i))}" y="${C+(R+24)*Math.sin(an(i))+5}" text-anchor="middle" font-size="15">${P[k][2]}</text>`).join('');
return `<svg viewBox="0 0 300 300" style="width:100%;max-width:340px;margin:auto;display:block" role="img" aria-label="رادار هشت فرایند: ${K.map(k=>P[k][0]+' '+pc(r[k])).join('، ')}">${rg}${ax}${p?poly(p,'fill="none" stroke="var(--mu)" stroke-dasharray="4 3"'):''}${poly(r,'fill="rgba(212,175,55,.22)" stroke="var(--g)" stroke-width="2"')}${lb}</svg>`}
function ins(r){const o=[],h=k=>(r[k]||0)>=60;
if(h('attention')&&h('executive'))o.push('توجه و کارکرد اجرایی هر دو بالا هستند: پیش از تکلیف بیشتر، ساختار محیط و چکلیست را اصلاح کنید.');
if(h('auditory')&&h('attention'))o.push('نشانههای شنیداری و توجه با هم دیده میشوند: پیش از نتیجهگیری دربارهٔ تمرکز، شنواییسنجی را در نظر بگیرید.');

if(h('language')&&h('memory'))o.push('زبان و حافظه با هم بالا هستند: مرور فاصلهدار با تصویر و بیان شفاهی مفیدتر است.');
return o}
function vNew(){return `<h1>پروندهٔ تازه</h1><div class="card"><label for="nn">نام یا کد (برای حفظ حریم، نام مستعار هم کافی است)</label><input id="nn" maxlength="40"><label for="na">سن یا پایه (اختیاری)</label><input id="na" maxlength="20"><div class="row"><button class="btn p" data-a="add">ساخت پرونده</button>${db.students.length?'<button class="btn" data-a="go" data-t="home">انصراف</button>':''}</div></div>
<div class="card"><h2>این میز کار چه میکند؟</h2><p>نشانهها را در چند نوبت و از چند نگاه (والدین، معلم) ثبت میکند، روند را نشان میدهد، برنامهٔ ۴ هفتهای میسازد و گزارش قابلچاپ برای مشاور تولید میکند. ابزار آگاهی است، نه تشخیص.</p><div class="row np"><button class="btn sm" data-a="imp">بازیابی از فایل پشتیبان</button></div></div>`}
function vHome(s){const a=s.as;if(!a.length)return `<h1>${esc(s.name)}</h1><div class="card"><h2>هنوز ارزیابیای ثبت نشده</h2><p>اولین ارزیابی حدود ۶ دقیقه طول میکشد و پایهٔ همهٔ مقایسههای بعدی است.</p><div class="row"><button class="btn p" data-a="go" data-t="test">شروع اولین ارزیابی</button></div></div>`;
const L=a[a.length-1],r=sc(L.ans),pv=a.length>1?sc(a[a.length-2].ans):null,T=top(r);
const flags=pv?K.filter(k=>r[k]>=70&&pv[k]>=70):[];
return `<h1>${esc(s.name)}</h1><p class="mu">${fa(a.length)} ارزیابی · آخرین: ${dt(L.t)} · ناظر: ${esc(L.who)} · پوشش پاسخ: ${fa(r.cov)}٪</p>
<div class="card"><div class="grid">${radar(r,pv)}<div>${K.map(k=>{const df=pv&&r[k]!=null&&pv[k]!=null?r[k]-pv[k]:null;return `<div class="pr"><i style="background:${P[k][1]}"></i><span class="n">${P[k][2]} ${P[k][0]}<div class="bar"><u style="width:${r[k]||0}%;background:${P[k][1]}"></u></div></span><span class="d" style="color:${df>0?'var(--dg)':df<0?'var(--ok)':'var(--mu)'}">${df==null?'':(df>0?'↑':df<0?'↓':'=')+fa(Math.abs(df))}</span><em>${pc(r[k])}</em></div>`}).join('')}</div></div>
<p class="mu">خطچین = ارزیابی قبلی. فلش سبز یعنی کاهش نشانهها.</p></div>
${flat(L)?'<div class="note dg">همهٔ پاسخها یکسان بود؛ اعتبار این نمایه کم است. برای پاسخدهی دقیقتر، ارزیابی را دوباره انجام دهید.</div>':''}${r.cov<70?'<div class="note">بیش از ۳۰٪ پاسخها «نمیدانم» بود. ناظر دیگری هم ارزیابی کند تا تصویر کاملتر شود.</div>':''}
${flags.map(k=>`<div class="note dg"><b>${P[k][0]}</b> در دو ارزیابی پیاپی بالای ۷۰٪ بوده است. ${G[k][1]}</div>`).join('')}
<div class="card"><h2>الگوهای ترکیبی</h2>${ins(r).map(x=>`<div class="note ok">${x}</div>`).join('')||'<p>الگوی ترکیبی برجستهای دیده نمیشود.</p>'}<p class="mu">اینها فرضیهٔ کاری برای گفتوگو هستند، نه تشخیص.</p></div>
<div class="card"><h2>سه حوزهٔ اولویت</h2>${T.map(k=>`<div class="lg" style="--c:${P[k][1]}"><b>${P[k][2]} ${P[k][0]} — ${pc(r[k])}</b><p>${G[k][0][0]}</p></div>`).join('')}<div class="row"><button class="btn p" data-a="go" data-t="plan">ساخت برنامهٔ ۴ هفتهای</button><button class="btn" data-a="go" data-t="test">ارزیابی تازه</button></div></div>`}
function vTest(s){const q=db.q&&db.q.sid===s.id?db.q:null;
if(!q)return `<h1>ارزیابی تازه</h1><div class="card"><p>هر جمله را بر اساس آنچه واقعاً مشاهده کردهاید پاسخ دهید. اگر چیزی را ندیدهاید، «نمیدانم» را بزنید تا نمایه گمراه نشود.</p><label for="who">ناظر</label><select id="who">${WHO.map(w=>`<option>${w}</option>`).join('')}</select><div class="row"><button class="btn p" data-a="start">شروع (۳۹ جمله)</button></div></div>${s.as.length?`<div class="card"><h2>سابقه</h2>${s.as.slice().reverse().map(x=>`<div class="pr"><span class="n">${dt(x.t)} — ${esc(x.who)}</span><button class="btn sm" data-a="delas" data-id="${x.id}">حذف</button></div>`).join('')}</div>`:''}`;
const i=q.i,idx=q.order[i],cur=q.ans[idx];
return `<div class="card"><div class="pr"><span class="n">سؤال ${fa(i+1)} از ${fa(ITEMS.length)} · ناظر: ${esc(q.who)}</span></div><div class="pg" role="progressbar" aria-valuemin="0" aria-valuemax="39" aria-valuenow="${i}"><u style="width:${i/39*100}%"></u></div><p style="font-size:1.1rem;font-weight:600;color:var(--tx);margin-bottom:1rem">${esc(ITEMS[idx][1])}</p><div class="lk">${[1,2,3,4,5,0].map(v=>`<button class="${cur===v?'on':''}" data-v="${v}">${LK[v]}<small>${fa(v)}</small></button>`).join('')}</div><div class="row"><button class="btn sm" data-a="back">${i?'قبلی':'خروج'}</button><span class="mu">کلیدهای ۰ تا ۵ فعالاند</span></div></div>`}
function trendSvg(s,k){const a=s.as.map(x=>sc(x.ans)[k]),n=a.length,W=320,H=150,x=i=>20+i*(W-40)/Math.max(n-1,1),y=v=>H-15-v*(H-30)/100;
const pts=a.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="روند ${P[k][0]}">${[0,50,100].map(v=>`<line x1="20" x2="${W-20}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="2" y="${y(v)+4}" font-size="9" fill="var(--mu)">${fa(v)}</text>`).join('')}<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${P[k][1]}" stroke-width="2.5"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${P[k][1]}"/>`).join('')}</svg>`}
function vTrend(s){if(s.as.length<1)return `<h1>روند</h1><div class="card"><p>پس از اولین ارزیابی، روند اینجا نشان داده میشود.</p></div>`;
const tp=ui.tp||top(sc(s.as[s.as.length-1].ans))[0]||K[0],by={};s.as.forEach(x=>by[x.who]=x);const ws=Object.keys(by);
return `<h1>روند و همسویی ناظرها</h1><div class="card"><h2>تغییر در زمان</h2><div class="chips">${K.map(k=>`<button class="chip ${k===tp?'on':''}" style="--c:${P[k][1]}" data-a="tp" data-k="${k}">${P[k][2]} ${P[k][0]}</button>`).join('')}</div>${s.as.length>1?trendSvg(s,tp):'<p>برای دیدن روند حداقل دو ارزیابی لازم است. پیشنهاد: ۴ هفته پس از اجرای برنامه.</p>'}</div>
<div class="card"><h2>مقایسهٔ ناظرها (آخرین ارزیابی هر ناظر)</h2>${ws.length<2?'<p>اگر والد و معلم هر دو ارزیابی کنند، تفاوت رفتار در خانه و کلاس مشخص میشود؛ این تفاوت برای مشاور اطلاعات ارزشمندی است.</p>':`<div class="tw"><table class="pl"><tr><th>حوزه</th>${ws.map(w=>`<th>${esc(w)}</th>`).join('')}<th></th></tr>${K.map(k=>{const v=ws.map(w=>sc(by[w].ans)[k]),f=v.filter(x=>x!=null),g=f.length>1&&Math.max(...f)-Math.min(...f)>=25;return `<tr><td>${P[k][2]} ${P[k][0]}</td>${v.map(x=>`<td>${pc(x)}</td>`).join('')}<td>${g?'⚠ تفاوت':''}</td></tr>`}).join('')}</table></div><p class="mu">⚠ یعنی اختلاف ۲۵ واحد یا بیشتر؛ ممکن است نشانهها وابسته به محیط باشند.</p>`}</div>`}
function vPlan(s){if(!s.as.length)return `<h1>برنامهٔ ۴ هفتهای</h1><div class="card"><p>ابتدا یک ارزیابی ثبت کنید.</p></div>`;
const p=s.plan;if(!p)return `<h1>برنامهٔ ۴ هفتهای</h1><div class="card"><p>برنامه از سه حوزهٔ اولویت آخرین ارزیابی ساخته میشود: هر حوزه ۳ راهکار، و تیک هفتگی برای پیگیری.</p><div class="row"><button class="btn p" data-a="mkplan">ساخت برنامه</button></div></div>`;
const wk=Math.min(4,Math.floor((Date.now()-new Date(p.start))/6048e5)+1),tot=p.focus.length*12,dn=Object.keys(p.d).length;
return `<h1>برنامهٔ ۴ هفتهای</h1><p class="mu">شروع: ${dt(p.start)} · هفتهٔ ${fa(wk)}</p><div class="card"><div class="pr"><span class="n">پایبندی</span><em>${pc(Math.round(dn/tot*100))}</em></div><div class="pg"><u style="width:${dn/tot*100}%"></u></div>${Date.now()-new Date(p.start)>=24192e5?'<div class="note ok">چهار هفته گذشت. حالا ارزیابی تازه بگیرید تا اثر برنامه روی نمودار روند دیده شود.</div><div class="row"><button class="btn p" data-a="go" data-t="test">ارزیابی مجدد</button></div>':''}</div>
${p.focus.map(k=>`<div class="card" style="border-inline-start:4px solid ${P[k][1]}"><h2>${P[k][2]} ${P[k][0]}</h2><div class="tw"><table class="pl"><tr><th>راهکار</th>${[1,2,3,4].map(w=>`<th class="c">هفتهٔ ${fa(w)}</th>`).join('')}</tr>${G[k][0].map((t,i)=>`<tr><td>${t}</td>${[1,2,3,4].map(w=>`<td class="c"><input type="checkbox" aria-label="${esc(t)} هفتهٔ ${w}" data-a="ck" data-key="${k}${i}w${w}" ${p.d[k+i+'w'+w]?'checked':''}></td>`).join('')}</tr>`).join('')}</table></div><div class="note">${G[k][1]}</div></div>`).join('')}
<div class="row np"><button class="btn sm" data-a="delplan">حذف برنامه</button></div>`}
function vLog(s){const f=ui.lf||'';return `<h1>دفترچهٔ مشاهده</h1><div class="card"><label for="lp">حوزه</label><select id="lp">${K.map(k=>`<option value="${k}">${P[k][0]}</option>`).join('')}</select><label for="lc">محیط</label><select id="lc">${CTX.map(c=>`<option>${c}</option>`).join('')}</select><label for="lt">چه دیدید؟ (واقعیت، نه برداشت)</label><textarea id="lt" maxlength="500" placeholder="مثال: امروز با زمانبند ۵ دقیقهای، تکلیف ریاضی را بدون یادآوری شروع کرد."></textarea><div class="row"><button class="btn p" data-a="addlog">ثبت</button></div></div>
<div class="chips"><button class="chip ${f?'':'on'}" style="--c:var(--g)" data-a="lf" data-k="">همه</button>${K.map(k=>`<button class="chip ${f===k?'on':''}" style="--c:${P[k][1]}" data-a="lf" data-k="${k}">${P[k][2]}</button>`).join('')}</div>
${s.logs.filter(l=>!f||l.p===f).slice().reverse().map(l=>`<div class="lg" style="--c:${P[l.p][1]}"><div class="mu">${P[l.p][2]} ${P[l.p][0]} · ${esc(l.c)} · ${dt(l.t)} <button class="btn sm np" data-a="dellog" data-id="${l.id}">حذف</button></div><p>${esc(l.x)}</p></div>`).join('')||'<p class="mu">یادداشتی نیست.</p>'}`}
function vRep(s){if(!s.as.length)return `<h1>گزارش</h1><div class="card"><p>پس از اولین ارزیابی، گزارش ساخته میشود.</p></div>`;
const L=s.as[s.as.length-1],r=sc(L.ans),pv=s.as.length>1?sc(s.as[s.as.length-2].ans):null,T=top(r),fl=pv?K.filter(k=>r[k]>=70&&pv[k]>=70):[];
return `<h1>گزارش مشاهدهای</h1><div class="card"><h2>${esc(s.name)} ${s.age?'· '+esc(s.age):''}</h2><p class="mu">تاریخ گزارش: ${dt(Date.now())} · ${fa(s.as.length)} ارزیابی · آخرین ناظر: ${esc(L.who)}</p>${radar(r,pv)}
<table class="pl">${K.map(k=>`<tr><td>${P[k][2]} ${P[k][0]}</td><td>${pc(r[k])}</td><td>${pv?pc(pv[k]):''}</td></tr>`).join('')}</table></div>
<div class="card"><h2>یافتهها برای مشاور</h2><p>حوزههای اولویت: ${T.map(k=>P[k][0]).join('، ')}.</p>${fl.length?`<p><b>تداوم نشانهها (≥۷۰٪ در دو ارزیابی):</b> ${fl.map(k=>P[k][0]).join('، ')}</p>`:''}${ins(r).map(x=>`<p>• ${x}</p>`).join('')}${s.plan?`<p>برنامه از ${dt(s.plan.start)}: پایبندی ${pc(Math.round(Object.keys(s.plan.d).length/(s.plan.focus.length*12)*100))}.</p>`:''}</div>
${s.logs.length?`<div class="card"><h2>مشاهدات ثبتشده</h2>${s.logs.slice(-8).map(l=>`<p>• ${dt(l.t)} (${P[l.p][0]}، ${esc(l.c)}): ${esc(l.x)}</p>`).join('')}</div>`:''}
<div class="note">این گزارش بر مشاهدهٔ غیرتخصصی استوار است و تشخیص نیست. تصمیم دربارهٔ ارزیابی تخصصی با مشاور یا متخصص است.</div>
<div class="row np"><button class="btn p" onclick="print()">چاپ / ذخیره PDF</button><button class="btn" data-a="copy">کپی خلاصه</button><button class="btn" data-a="exp">پشتیبان JSON</button><button class="btn" data-a="imp">بازیابی</button><button class="btn" data-a="delst">حذف پرونده</button></div>`}
const TABS=[['home','نمای کلی','◉'],['test','ارزیابی','✎'],['trend','روند','📈'],['plan','برنامه','✓'],['log','دفترچه','📓'],['rep','گزارش','🗎']];
function render(){const s=S(),t=!s?'new':ui.tab;$('#ss').innerHTML=db.students.map(x=>`<option value="${x.id}" ${x.id===db.cur?'selected':''}>${esc(x.name)}</option>`).join('');
$('#nav').innerHTML=TABS.map(([k,n,i])=>`<button data-a="go" data-t="${k}" class="${k===t?'on':''}" ${k===t?'aria-current="page"':''}><b>${i}</b>${n}</button>`).join('');
$('#app').innerHTML=!s||t==='new'?vNew():({home:vHome,test:vTest,trend:vTrend,plan:vPlan,log:vLog,rep:vRep})[t](s)}
const go=t=>{ui.tab=t;render();scrollTo(0,0)};
function ans(v){const q=db.q,idx=q.order[q.i];q.ans[idx]=v;if(q.i+1>=ITEMS.length){const s=S();s.as.push({id:uid(),t:new Date().toISOString(),who:q.who,ans:ITEMS.map((_,i)=>q.ans[i]??0)});db.q=null;save();toast('ارزیابی ذخیره شد');go('home');return}q.i++;save();render();scrollTo(0,0)}
function summary(s){const r=sc(s.as[s.as.length-1].ans);return `نقشهٔ شناختی یادگیری — ${s.name}\n`+K.map(k=>`${P[k][0]}: ${pc(r[k])}`).join('\n')+'\n(ابزار آگاهی؛ نه تشخیص)'}
$('#ss').onchange=e=>{db.cur=e.target.value;save();render()};
$('#app').addEventListener('change',e=>{const t=e.target;if(t.dataset.a==='ck'){const p=S().plan;t.checked?p.d[t.dataset.key]=1:delete p.d[t.dataset.key];save();render()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-v]');if(!t)return;const s=S(),D=t.dataset;
if(D.v!==undefined){ans(+D.v);return}
switch(D.a){case'go':go(D.t);break;case'new':ui.tab='new';render();break;
case'add':{const n=$('#nn').value.trim();if(!n){toast('نام را وارد کنید');return}const x=mk(n,$('#na').value.trim());db.students.push(x);db.cur=x.id;save();go('home');break}
case'start':db.q={sid:s.id,who:$('#who').value,order:ITEMS.map((_,i)=>i).sort(()=>Math.random()-.5),i:0,ans:{}};save();render();break;
case'back':if(db.q.i>0)db.q.i--;else db.q=null;save();render();break;
case'delas':if(confirm('این ارزیابی حذف شود؟')){s.as=s.as.filter(x=>x.id!==D.id);save();render()}break;
case'tp':ui.tp=D.k;render();break;case'lf':ui.lf=D.k;render();break;
case'mkplan':s.plan={start:new Date().toISOString(),focus:top(sc(s.as[s.as.length-1].ans)),d:{}};save();render();break;
case'delplan':if(confirm('برنامه حذف شود؟')){s.plan=null;save();render()}break;
case'addlog':{const x=$('#lt').value.trim();if(!x){toast('متن مشاهده را بنویسید');return}s.logs.push({id:uid(),t:new Date().toISOString(),p:$('#lp').value,c:$('#lc').value,x});save();render();toast('ثبت شد');break}
case'dellog':s.logs=s.logs.filter(l=>l.id!==D.id);save();render();break;
case'copy':navigator.clipboard?.writeText(summary(s)).then(()=>toast('کپی شد'),()=>toast('کپی نشد'));break;
case'exp':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='learning-map-backup.json';a.click();break}
case'imp':{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.students))throw 0;d.students.forEach(x=>{if(!db.students.some(y=>y.id===x.id))db.students.push(x)});db.cur=db.cur||d.students[0]?.id;save();go('home');toast('بازیابی شد')}catch(x){toast('فایل معتبر نیست')}};r.readAsText(f)};i.click();break}
case'delst':if(confirm('کل پروندهٔ '+s.name+' برای همیشه حذف شود؟')){db.students=db.students.filter(x=>x.id!==s.id);db.cur=db.students[0]?.id||null;save();ui.tab='home';render()}break}});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||!db.q||ui.tab!=='test')return;const k='۰۱۲۳۴۵'.indexOf(e.key),v=k>=0?k:/^[0-5]$/.test(e.key)?+e.key:-1;if(v>=0){ans(v);e.preventDefault()}});
if(!db.cur&&db.students[0])db.cur=db.students[0].id;
render();
})();
</script></body></html>
