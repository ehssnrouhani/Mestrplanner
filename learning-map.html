<style>

<header><div class="w hd"><span class="brand">🧭 نقشهٔ یادگیری</span><select id="ss" aria-label="دانشآموز"></select><button class="btn sm" data-a="new">+ پرونده</button></div></header>

<script>
(()=>{
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:0}),dt=t=>new Date(t).toLocaleDateString('fa-IR');
const P={attention:['توجه','#ef4444','🎯'],executive:['کارکردهای اجرایی','#f59e0b','🧩'],memory:['حافظه و یادگیری','#10b981','🗄️'],speed:['سرعت پردازش','#3b82f6','⚡'],visual:['دیداری-فضایی','#8b5cf6','👁️'],auditory:['پردازش شنیداری','#06b6d4','👂'],language:['مهارتهای زبانی','#ec4899','💬'],motor:['حسی-حرکتی','#14b8a6','✋']};
const K=Object.keys(P);
const ITEMS=[['attention','با کوچکترین صدا یا حرکت اطراف حواسش پرت میشود.'],['attention','برای تمام کردن یک تکلیف، نیاز به یادآوری مکرر دارد.'],['attention','در خواندن یا نوشتن، جاهایی از متن را جا میاندازد.'],['attention','برای تمرکز روی یک کار، بیش از همسنهایش تلاش میکند.'],['attention','وقتی چند دستور پشتسرهم میگیرد، فقط بخشی را انجام میدهد.'],['executive','برای شروع تکالیف، نیاز به تشویق یا یادآوری بیرونی دارد.'],['executive','برنامهریزی یک کار چندمرحلهای برایش سخت است.'],['executive','وقتی از کاری خسته میشود، نمیتواند تا پایان تحمل کند.'],['executive','در حل مسئله، بدون فکر کردن به راهحل میپرد.'],['executive','تغییر از یک فعالیت به فعالیت دیگر برایش دشوار است.'],['memory','مطلبی که دیروز یاد گرفته، امروز فراموش کرده است.'],['memory','برای یادگیری، به تکرار بیشتر از همسنها نیاز دارد.'],['memory','در بهخاطر آوردن اسامی یا کلمات مشکل دارد.'],['memory','پس از چند روز، جزئیات مطلب را به یاد نمیآورد.'],['memory','برای ذخیرهٔ مطلب، به کمک بصری یا نوشتاری نیاز دارد.'],['speed','در تکالیف زماندار، خیلی کندتر از همسنها عمل میکند.'],['speed','پاسخ دادن به سؤالهای کلاس برایش وقتگیر است.'],['speed','تکلیف را درست میفهمد اما خیلی دیر تحویل میدهد.'],['speed','در آزمونهای زماندار، بخشی از سؤالها را ناتمام میگذارد.'],['visual','در کپی کردن از تخته یا کتاب، خطاهای زیاد دارد.'],['visual','جهتها (چپ/راست، بالا/پایین) را اشتباه میگیرد.'],['visual','در مرتب کردن یا پیدا کردن وسایل، مشکل دارد.'],['visual','حروف یا اعداد را مشابه میبیند و اشتباه میخواند.'],['visual','نقشه یا نمودار را سخت میفهمد.'],['auditory','در محیط شلوغ، حرفهای معلم را نمیفهمد.'],['auditory','وقتی کسی بلند صحبت میکند، بهتر یاد میگیرد.'],['auditory','صدای پسزمینه (پنکه، ترافیک) تمرکزش را به هم میزند.'],['auditory','دستور شفاهی را اشتباه میشنود یا کامل نمیفهمد.'],['auditory','برای درک مطلب، باید متن را با صدای بلند بخواند.'],['language','کلمهای که میخواهد بگوید را پیدا نمیکند.'],['language','جملههایش کوتاه یا ناقصاند.'],['language','در بیان داستان یا توضیح، ترتیب منطقی را گم میکند.'],['language','در خواندن، روانی کم است و مکث زیاد دارد.'],['language','در نوشتن، ساختار جملهاش اشتباه است.'],['motor','دستخطش ناخواناست یا خیلی کج است.'],['motor','در گرفتن مداد یا قیچی، مهارت کمی دارد.'],['motor','در بازیهای حرکتی (توپ، طناب) مشکل دارد.'],['motor','از فعالیتهای حرکتی اجتناب میکند.'],['motor','هنگام نوشتن، خیلی زود خسته میشود.']];
const G={attention:[['زمان کار را به بلوکهای ۱۰ تا ۱۵ دقیقهای بشکنید.','محیط مطالعه را از صدا و حرکت اضافی خالی کنید.','قبل از شروع، هدف را شفاهی بگویید: «الان فقط این ۵ سؤال».'],'اگر بعد از ۴ هفته تغییر معناداری دیده نشد، با مشاور مدرسه گفتوگو کنید.'],
executive:[['تکالیف را به قدمهای کوچک بشکنید و هر قدم را جدا بنویسید.','برای شروع، زمانبند ۵ دقیقهای بگذارید: «فقط ۵ دقیقه».','چکلیست بصری روی میز بگذارید.'],'اگر بعد از ۴ هفته تغییر معناداری دیده نشد، ارزیابی تخصصی توصیه میشود.'],
memory:[['از مرور فاصلهدار استفاده کنید (امروز، ۳ روز بعد، ۷ روز بعد).','مطلب را با تصویر و نقشهٔ ذهنی همراه کنید.','پایان هر جلسه، با کتاب بسته خلاصه بگوید.'],'اگر فراموشی شدید و مداوم است (نه فقط درسی)، با متخصص گفتوگو کنید.'],
speed:[['زمان تکالیف را بر اساس توان او تنظیم کنید، نه میانگین کلاس.','در آزمونها زمان اضافه بدهید، نه سؤال کمتر.','کیفیت را بر سرعت ترجیح دهید.'],'اگر افت تحصیلی چشمگیر است، ارزیابی تخصصی توصیه میشود.'],
visual:[['متن را با فونت درشت و فاصلهٔ خط بیشتر ارائه دهید.','از رنگ، نمودار و نقشه برای آموزش استفاده کنید.','در کپی از تخته، وقت اضافه یا برگهٔ کمکی بدهید.'],'اگر مشکل پایدار است، بیناییسنجی و ارزیابی روانشناختی توصیه میشود.'],
auditory:[['او را در ردیف جلو و دور از پنجره بنشانید.','دستورها را کوتاه بدهید و بخواهید تکرار کند.','از متن نوشتاری و ویدیوی زیرنویسدار کمک بگیرید.'],'اگر به مشکل شنوایی شک دارید، ابتدا شنواییسنجی انجام دهید.'],
language:[['از متنهای کوتاه و تصویردار شروع کنید.','قبل از نوشتن، ایدهها را شفاهی مرور کنید.','از کتاب صوتی یا متن همراه با صدا استفاده کنید.'],'اگر مشکل خواندن یا نوشتن پایدار است، ارزیابی گفتاردرمانی یا روانشناختی توصیه میشود.'],
motor:[['برای نوشتن از مداد ضخیمتر یا گیرهٔ مداد استفاده کنید.','مدت نوشتن را کوتاه و بین بخشها استراحت بگذارید.','بازیهای حرکتی روزانه (توپ، طناب) را تشویق کنید.'],'اگر مشکل حرکتی مانع پیشرفت تحصیلی است، ارزیابی کاردرمانی توصیه میشود.']};
const LK=['نمیدانم','هرگز','کم','گاهی','زیاد','همیشه'],WHO=['والدین','معلم','مشاور','خود دانشآموز'],CTX=['خانه','کلاس','هر دو'];
const uid=()=>Math.random().toString(36).slice(2,9);
const mk=(n,a)=>({id:uid(),name:n,age:a||'',as:[],logs:[],plan:null});
function load(){try{const d=JSON.parse(localStorage.getItem('mp_lm3'));if(d&&d.students)return d}catch(e){}
const d={cur:null,students:[],q:null};try{const o=JSON.parse(localStorage.getItem('mp_learning_map_v2')||'null');if(o&&o.answers){const s=mk('دانشآموز من');s.as.push({id:uid(),t:o.date,who:'والدین',ans:o.answers});d.students.push(s);d.cur=s.id}}catch(e){}return d}
let db=load(),ui={tab:'home',tp:null};
const save=()=>{try{localStorage.setItem('mp_lm3',JSON.stringify(db))}catch(e){}};
const S=()=>db.students.find(s=>s.id===db.cur);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2400)}
function sc(ans){const o={};K.forEach(k=>{const a=ITEMS.map((x,i)=>x[0]===k&&ans[i]>0?ans[i]:0).filter(Boolean);o[k]=a.length<3?null:Math.round((a.reduce((x,y)=>x+y,0)/a.length-1)*25)});o.cov=Math.round(ans.filter(v=>v>0).length/ITEMS.length*100);return o}
const top=r=>K.filter(k=>r[k]!=null).sort((a,b)=>r[b]-r[a]).slice(0,3),pc=v=>v==null?'—':fa(v)+'٪';
const flat=a=>{const v=a.ans.filter(x=>x>0);return v.length>10&&v.every(x=>x===v[0])};
function radar(r,p){const C=150,R=105,an=i=>Math.PI*2*i/8-Math.PI/2,pt=(i,f)=>`${C+R*f*Math.cos(an(i))},${C+R*f*Math.sin(an(i))}`;
const rg=[.25,.5,.75,1].map(f=>`<polygon points="${K.map((_,i)=>pt(i,f)).join(' ')}" fill="none" stroke="var(--ln)"/>`).join('');
const ax=K.map((_,i)=>`<line x1="${C}" y1="${C}" x2="${pt(i,1).split(',')[0]}" y2="${pt(i,1).split(',')[1]}" stroke="var(--ln)"/>`).join('');
const poly=(x,st)=>`<polygon points="${K.map((k,i)=>pt(i,(x[k]||0)/100)).join(' ')}" ${st}/>`;
const lb=K.map((k,i)=>`<text x="${C+(R+24)*Math.cos(an(i))}" y="${C+(R+24)*Math.sin(an(i))+5}" text-anchor="middle" font-size="15">${P[k][2]}</text>`).join('');
return `<svg viewBox="0 0 300 300" style="width:100%;max-width:340px;margin:auto;display:block" role="img" aria-label="رادار هشت فرایند: ${K.map(k=>P[k][0]+' '+pc(r[k])).join('، ')}">${rg}${ax}${p?poly(p,'fill="none" stroke="var(--mu)" stroke-dasharray="4 3"'):''}${poly(r,'fill="rgba(212,175,55,.22)" stroke="var(--g)" stroke-width="2"')}${lb}</svg>`}
function ins(r){const o=[],h=k=>(r[k]||0)>=60;
if(h('attention')&&h('executive'))o.push('توجه و کارکرد اجرایی هر دو بالا هستند: پیش از تکلیف بیشتر، ساختار محیط و چکلیست را اصلاح کنید.');
if(h('auditory')&&h('attention'))o.push('نشانههای شنیداری و توجه با هم دیده میشوند: پیش از نتیجهگیری دربارهٔ تمرکز، شنواییسنجی را در نظر بگیرید.');

if(h('language')&&h('memory'))o.push('زبان و حافظه با هم بالا هستند: مرور فاصلهدار با تصویر و بیان شفاهی مفیدتر است.');
return o}
function vNew(){return `<h1>پروندهٔ تازه</h1><div class="card"><label for="nn">نام یا کد (برای حفظ حریم، نام مستعار هم کافی است)</label><input id="nn" maxlength="40"><label for="na">سن یا پایه (اختیاری)</label><input id="na" maxlength="20"><div class="row"><button class="btn p" data-a="add">ساخت پرونده</button>${db.students.length?'<button class="btn" data-a="go" data-t="home">انصراف</button>':''}</div></div>
<div class="card"><h2>این میز کار چه میکند؟</h2><p>نشانهها را در چند نوبت و از چند نگاه (والدین، معلم) ثبت میکند، روند را نشان میدهد، برنامهٔ ۴ هفتهای میسازد و گزارش قابلچاپ برای مشاور تولید میکند. ابزار آگاهی است، نه تشخیص.</p><div class="row np"><button class="btn sm" data-a="imp">بازیابی از فایل پشتیبان</button></div></div>`}
function vHome(s){const a=s.as;if(!a.length)return `<h1>${esc(s.name)}</h1><div class="card"><h2>هنوز ارزیابیای ثبت نشده</h2><p>اولین ارزیابی حدود ۶ دقیقه طول میکشد و پایهٔ همهٔ مقایسههای بعدی است.</p><div class="row"><button class="btn p" data-a="go" data-t="test">شروع اولین ارزیابی</button></div></div>`;
const L=a[a.length-1],r=sc(L.ans),pv=a.length>1?sc(a[a.length-2].ans):null,T=top(r);
