<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاسبه‌گر تخصصی فیزیک و شیمی | مستر پلنر</title>

<style>
main{max-width:1000px}
.tabs{max-width:1000px}
.th{max-width:1000px}
.cat-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cat-bar button{background:var(--p);border:1.5px solid var(--bd);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--mu);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.cat-bar button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:18px}
.fcard{background:var(--p);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
.fcard:hover{border-color:var(--ac);transform:translateY(-1px)}
.fcard.on{border-color:var(--ac);background:rgba(232,151,31,.08)}
.fcard b{display:block;font-size:13.5px;color:#f8fafc;margin-bottom:6px}
.fcard small{font-size:11.5px;color:var(--mu)}
.fcard .tex-mini{font-size:13px;color:#fbbf24;margin-top:6px;direction:ltr;text-align:left}
.var-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.vfield label{display:block;font-size:12px;color:#fbbf24;margin-bottom:4px;font-weight:700}
.vfield input{width:100%;background:#0f172a;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;font-size:14px;color:var(--tx);font-family:inherit}
.vfield input:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
.vfield small{display:block;font-size:10.5px;color:var(--mu);margin-top:3px;direction:ltr;text-align:left}
.target-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.target-row select{flex:1;min-width:200px;background:#0f172a;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-family:inherit;color:var(--tx);font-size:14px;font-weight:700}
.result-box{background:linear-gradient(135deg,#0b1120,#1e293b);border:2px solid var(--ac);border-radius:16px;padding:20px;margin-top:14px;text-align:center}
.result-box .lbl{font-size:13px;color:#fbbf24;font-weight:700;margin-bottom:6px}
.result-box .val{font-size:30px;font-weight:800;color:#fff;direction:ltr;font-variant-numeric:tabular-nums}
.result-box .unit{font-size:15px;color:var(--mu);margin-right:8px}
.result-box .expr{font-size:12px;color:var(--mu);margin-top:8px;direction:ltr}
.result-box.err{border-color:#ef4444;background:rgba(239,68,68,.08)}
.result-box.err .val{font-size:15px;color:#f87171}
.steps{background:#0b1120;border:1px dashed var(--bd);border-radius:14px;padding:14px;margin-top:14px}
.steps h4{margin:0 0 10px;color:#fbbf24;font-size:13.5px}
.step-item{background:var(--p);border-radius:10px;padding:12px 14px;margin-bottom:8px;border-right:3px solid var(--ac)}
.step-item:last-child{margin-bottom:0}
.step-item .st-h{font-size:12.5px;color:#fbbf24;font-weight:700;margin-bottom:6px}
.step-item .st-b{font-size:14px;color:#e2e8f0;direction:ltr;text-align:left;font-family:'Courier New',monospace;line-height:1.8}
.step-item .st-b b{color:#6ee7b7;font-weight:800}
.qinput{width:100%;background:#0f172a;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-family:'Courier New',monospace;font-size:14px;color:var(--tx);direction:ltr;text-align:left}
.qinput::placeholder{color:#64748b;direction:rtl;text-align:right;font-family:'Vazirmatn',Tahoma,sans-serif}
.parsed{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.parsed span{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid #10b981;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;direction:ltr}
.parsed span.bad{background:rgba(239,68,68,.15);color:#f87171;border-color:#ef4444}
.hint{font-size:12.5px;color:var(--mu);margin:8px 0;line-height:1.8}
.hint code{background:#0b1120;padding:1px 6px;border-radius:4px;color:#fbbf24;font-family:'Courier New',monospace;direction:ltr;display:inline-block}
.var-explorer{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:16px;max-height:220px;overflow-y:auto;padding:8px;background:#0b1120;border-radius:12px;border:1px solid var(--bd)}
.var-explorer button{background:var(--p);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer;color:#cbd5e1;font-size:12.5px;font-weight:700;direction:ltr;text-align:center}
.var-explorer button:hover{border-color:var(--ac)}
.var-explorer button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.rel-item{background:var(--p);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.rel-item b{display:block;font-size:13px;color:#f8fafc;margin-bottom:4px}
.rel-item .rel-tex{font-size:12.5px;color:#fbbf24;direction:ltr;text-align:left;margin:4px 0}
.rel-item .rel-formula{font-size:12px;color:var(--mu);direction:ltr;text-align:left;background:#0b1120;padding:6px 10px;border-radius:6px;font-family:'Courier New',monospace;margin-top:4px}
.mini-btn{background:#0f172a;border:1px solid var(--bd);border-radius:8px;padding:5px 12px;cursor:pointer;color:#cbd5e1;font-size:12px;font-weight:700;font-family:inherit}
.mini-btn:hover{border-color:var(--ac);color:#fbbf24}
.mini-btn.pr{background:var(--ac);border-color:var(--ac);color:#fff}
.help-section{background:var(--p);border-radius:14px;padding:18px;margin-bottom:14px;border-right:4px solid var(--ac)}
.help-section h3{font-size:15px;color:#fbbf24;margin:0 0 8px}
.help-section p,.help-section li{font-size:13.5px;color:#cbd5e1;line-height:1.9}
.help-section code{background:#0b1120;padding:2px 8px;border-radius:5px;color:#6ee7b7;font-family:'Courier New',monospace;direction:ltr;display:inline-block}
/* ── Shared banner ── */
.share-banner{background:linear-gradient(135deg,rgba(6,182,212,.15),rgba(6,182,212,.05));border:2px solid #06b6d4;border-radius:14px;padding:16px 20px;margin-bottom:14px;color:#cbd5e1;font-size:13.5px;line-height:1.85}
.share-banner b{color:#06b6d4}
.share-banner .row{margin-top:10px}
/* ── Saved list ── */
.saved-section{margin-top:20px;background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:14px 18px}
.saved-section h3{font-size:14px;color:#fbbf24;margin:0 0 10px}
.saved-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:#0f172a;margin-bottom:6px;font-size:12.5px;color:#cbd5e1}
.saved-item b{flex:1;font-weight:700;color:#f8fafc}
.saved-item .meta{font-size:11px;color:var(--mu)}
/* ── Quiz ── */
.quiz-opt-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.quiz-opt{background:#0f172a;border:1.5px solid var(--bd);border-radius:10px;padding:9px 16px;cursor:pointer;color:var(--tx);font-weight:700;font-size:13px;font-family:inherit}
.quiz-opt.on{background:var(--ac);border-color:var(--ac);color:#fff}
.quiz-input{width:100%;background:#0f172a;border:2px solid var(--bd);border-radius:10px;padding:14px 16px;font-family:'Courier New',monospace;font-size:20px;color:#fff;direction:ltr;text-align:center;font-weight:800;margin:12px 0}
.quiz-input:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.quiz-score{display:flex;justify-content:space-between;align-items:center;background:#0b1120;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.quiz-score b{color:#fbbf24;font-size:16px}
.quiz-progress{height:6px;background:#0f172a;border-radius:3px;overflow:hidden;margin-bottom:14px}
.quiz-progress i{display:block;height:100%;background:var(--ac);transition:width .3s}
.quiz-q{background:#0b1120;border-radius:12px;padding:16px;margin-bottom:14px}
.quiz-q h3{font-size:15px;color:#fbbf24;margin:0 0 10px}
.quiz-q .given{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.quiz-q .given span{background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid #10b981;border-radius:8px;padding:5px 12px;font-size:13px;font-family:'Courier New',monospace;direction:ltr}
.quiz-feedback{border-radius:14px;padding:18px;margin-bottom:14px;text-align:center}
.quiz-feedback.ok{background:rgba(16,185,129,.12);border:2px solid #10b981}
.quiz-feedback.bad{background:rgba(239,68,68,.12);border:2px solid #ef4444}
.quiz-feedback .big{font-size:26px;margin-bottom:6px}
.quiz-feedback .txt{font-size:16px;font-weight:800;color:#fff}
.quiz-feedback .sub{font-size:13px;color:#cbd5e1;margin-top:8px}
.quiz-final{text-align:center;padding:30px 20px;background:linear-gradient(135deg,#0b1120,#1e293b);border:2px solid var(--ac);border-radius:16px}
.quiz-final .big{font-size:56px;font-weight:800;color:#fbbf24;direction:ltr;font-variant-numeric:tabular-nums}
.quiz-final .lbl{font-size:15px;color:#cbd5e1;margin:8px 0}
@media print{.top,.tabs,.noprint{display:none!important}main{padding:0;max-width:100%}}
</style>
</head>

<script>
/* ═══════════════ پایگاه دانش ═══════════════ */
const KB = {
  cats:[
    {id:'mechanics',label:'مکانیک',icon:'fa-person-running'},
    {id:'electricity',label:'الکتریسیته',icon:'fa-bolt'},
    {id:'magnetism',label:'مغناطیس',icon:'fa-magnet'},
    {id:'waves',label:'موج و نوسان',icon:'fa-wave-square'},
    {id:'thermo',label:'گرما و شاره',icon:'fa-temperature-half'},
    {id:'atomic',label:'فیزیک جدید',icon:'fa-atom'},
    {id:'chemistry',label:'شیمی',icon:'fa-flask'}
  ],
  formulas:[
    {id:'v_kin',cat:'mechanics',l:'سرعت نهایی (شتاب ثابت)',tex:'v = v_0 + at',vars:{v:'m/s',v0:'m/s',a:'m/s²',t:'s'},solve:{v:'v0+a*t',v0:'v-a*t',a:'(v-v0)/t',t:'(v-v0)/a'}},
    {id:'x_kin',cat:'mechanics',l:'جابجایی (شتاب ثابت)',tex:'x = v_0 t + \\tfrac{1}{2}at^2',vars:{x:'m',v0:'m/s',a:'m/s²',t:'s'},solve:{x:'v0*t+0.5*a*t*t',v0:'(x-0.5*a*t*t)/t',a:'2*(x-v0*t)/(t*t)'}},
    {id:'v2_kin',cat:'mechanics',l:'رابطهٔ سرعت و جابجایی',tex:'v^2 = v_0^2 + 2a\\Delta x',vars:{v:'m/s',v0:'m/s',a:'m/s²',dx:'m'},solve:{v:'Math.sqrt(Math.max(0,v0*v0+2*a*dx))',v0:'Math.sqrt(Math.max(0,v*v-2*a*dx))',a:'(v*v-v0*v0)/(2*dx)',dx:'(v*v-v0*v0)/(2*a)'}},
    {id:'newton2',cat:'mechanics',l:'قانون دوم نیوتن',tex:'F = ma',vars:{F:'N',m:'kg',a:'m/s²'},solve:{F:'m*a',m:'F/a',a:'F/m'}},
    {id:'weight',cat:'mechanics',l:'وزن',tex:'W = mg',vars:{W:'N',m:'kg',g:'m/s²'},defaults:{g:10},solve:{W:'m*g',m:'W/g',g:'W/m'}},
    {id:'friction',cat:'mechanics',l:'اصطکاک جنبشی',tex:'f_k = \\mu N',vars:{fk:'N',mu:'-',N:'N'},ranges:{mu:[0.1,0.8]},solve:{fk:'mu*N',mu:'fk/N',N:'fk/mu'}},
    {id:'circ_ac',cat:'mechanics',l:'شتاب مرکزگرا',tex:'a_c = \\frac{v^2}{r}',vars:{ac:'m/s²',v:'m/s',r:'m'},solve:{ac:'v*v/r',v:'Math.sqrt(ac*r)',r:'v*v/ac'}},
    {id:'work',cat:'mechanics',l:'کار نیرو',tex:'W = Fd\\cos\\theta',vars:{W:'J',F:'N',d:'m',cos:'-'},defaults:{cos:1},ranges:{cos:[0.5,1]},solve:{W:'F*d*cos',F:'W/(d*cos)',d:'W/(F*cos)',cos:'W/(F*d)'}},
    {id:'kinetic',cat:'mechanics',l:'انرژی جنبشی',tex:'K = \\tfrac{1}{2}mv^2',vars:{K:'J',m:'kg',v:'m/s'},solve:{K:'0.5*m*v*v',m:'2*K/(v*v)',v:'Math.sqrt(2*K/m)'}},
    {id:'potential',cat:'mechanics',l:'انرژی پتانسیل گرانشی',tex:'U = mgh',vars:{U:'J',m:'kg',g:'m/s²',h:'m'},defaults:{g:10},solve:{U:'m*g*h',m:'U/(g*h)',g:'U/(m*h)',h:'U/(m*g)'}},
    {id:'power',cat:'mechanics',l:'توان مکانیکی',tex:'P_w = \\frac{W}{t}',vars:{Pw:'W',W:'J',t:'s'},solve:{Pw:'W/t',W:'Pw*t',t:'W/Pw'}},
    {id:'work_energy',cat:'mechanics',l:'قضیهٔ کار-انرژی',tex:'W_{net} = \\Delta K',vars:{Wnet:'J',dK:'J'},solve:{Wnet:'dK',dK:'Wnet'}},
    {id:'coulomb',cat:'electricity',l:'قانون کولن',tex:'F = k\\frac{|q_1 q_2|}{r^2}',vars:{F:'N',k:'N·m²/C²',q1:'C',q2:'C',r:'m'},defaults:{k:9e9},ranges:{q1:[1e-6,1e-3],q2:[1e-6,1e-3],r:[0.1,1]},solve:{F:'k*q1*q2/(r*r)',k:'F*r*r/(q1*q2)',q1:'F*r*r/(k*q2)',q2:'F*r*r/(k*q1)',r:'Math.sqrt(Math.abs(k*q1*q2/F))'}},
    {id:'efield',cat:'electricity',l:'میدان ذرهٔ باردار',tex:'E = k\\frac{Q}{r^2}',vars:{E:'N/C',k:'N·m²/C²',Q:'C',r:'m'},defaults:{k:9e9},ranges:{Q:[1e-9,1e-6],r:[0.1,1]},solve:{E:'k*Q/(r*r)',k:'E*r*r/Q',Q:'E*r*r/k',r:'Math.sqrt(Math.abs(k*Q/E))'}},
    {id:'vpoint',cat:'electricity',l:'پتانسیل ذرهٔ باردار',tex:'V_p = k\\frac{Q}{r}',vars:{Vp:'V',k:'N·m²/C²',Q:'C',r:'m'},defaults:{k:9e9},ranges:{Q:[1e-9,1e-6],r:[0.1,1]},solve:{Vp:'k*Q/r',k:'Vp*r/Q',Q:'Vp*r/k',r:'k*Q/Vp'}},
    {id:'unifield',cat:'electricity',l:'میدان یکنواخت',tex:'V_p = Ed',vars:{Vp:'V',E:'V/m',d:'m'},ranges:{E:[1,500],d:[0.1,2]},solve:{Vp:'E*d',E:'Vp/d',d:'Vp/E'}},
    {id:'capacitor',cat:'electricity',l:'ظرفیت خازن',tex:'C = \\frac{Q}{V_p}',vars:{C:'F',Q:'C',Vp:'V'},ranges:{C:[1e-9,1e-6],Q:[1e-9,1e-6],Vp:[1,100]},solve:{C:'Q/Vp',Q:'C*Vp',Vp:'Q/C'}},
    {id:'cap_energy',cat:'electricity',l:'انرژی خازن',tex:'U_c = \\tfrac{1}{2}QV_p',vars:{Uc:'J',Q:'C',Vp:'V'},ranges:{Q:[1e-6,1e-3],Vp:[1,100]},solve:{Uc:'0.5*Q*Vp',Q:'2*Uc/Vp',Vp:'2*Uc/Q'}},
    {id:'current_def',cat:'electricity',l:'تعریف جریان',tex:'I = \\frac{Q}{t}',vars:{I:'A',Q:'C',t:'s'},solve:{I:'Q/t',Q:'I*t',t:'Q/I'}},
    {id:'ohm',cat:'electricity',l:'قانون اهم',tex:'V_p = IR',vars:{Vp:'V',I:'A',R:'Ω'},solve:{Vp:'I*R',I:'Vp/R',R:'Vp/I'}},
    {id:'elec_power',cat:'electricity',l:'توان الکتریکی',tex:'P_e = V_p I',vars:{Pe:'W',Vp:'V',I:'A'},solve:{Pe:'Vp*I',Vp:'Pe/I',I:'Pe/Vp'}},
    {id:'r_wire',cat:'electricity',l:'مقاومت سیم',tex:'R = \\rho\\frac{L}{A}',vars:{R:'Ω',rho:'Ω·m',L:'m',A:'m²'},ranges:{rho:[1e-8,1e-6],L:[0.5,5],A:[1e-6,1e-3]},solve:{R:'rho*L/A',rho:'R*A/L',L:'R*A/rho',A:'rho*L/R'}},
    {id:'r_series',cat:'electricity',l:'مقاومت سری',tex:'R_s = R_1 + R_2',vars:{Rs:'Ω',R1:'Ω',R2:'Ω'},solve:{Rs:'R1+R2',R1:'Rs-R2',R2:'Rs-R1'}},
    {id:'mag_charge',cat:'magnetism',l:'نیروی مغناطیسی بر بار',tex:'F = qvB\\sin\\theta',vars:{F:'N',q:'C',v:'m/s',B:'T',sin:'-'},defaults:{sin:1},ranges:{q:[1e-6,1e-3],v:[1,10],B:[0.1,2]},solve:{F:'q*v*B*sin',q:'F/(v*B*sin)',v:'F/(q*B*sin)',B:'F/(q*v*sin)',sin:'F/(q*v*B)'}},
    {id:'mag_wire',cat:'magnetism',l:'نیروی مغناطیسی بر سیم',tex:'F = ILB\\sin\\theta',vars:{F:'N',I:'A',L:'m',B:'T',sin:'-'},defaults:{sin:1},ranges:{I:[0.5,10],L:[0.1,2],B:[0.1,2]},solve:{F:'I*L*B*sin',I:'F/(L*B*sin)',L:'F/(I*B*sin)',B:'F/(I*L*sin)',sin:'F/(I*L*B)'}},
    {id:'mag_radius',cat:'magnetism',l:'شعاع مسیر دایره‌ای',tex:'r = \\frac{mv}{qB}',vars:{r:'m',m:'kg',v:'m/s',q:'C',B:'T'},ranges:{m:[1e-27,1e-25],v:[1e5,1e7],q:[1e-19,1e-18],B:[0.1,2]},solve:{r:'m*v/(q*B)',m:'r*q*B/v',v:'r*q*B/m',q:'m*v/(r*B)',B:'m*v/(r*q)'}},
    {id:'wave_speed',cat:'waves',l:'سرعت موج',tex:'v = f\\lambda',vars:{v:'m/s',f:'Hz',lam:'m'},ranges:{f:[10,1000],lam:[0.1,10]},solve:{v:'f*lam',f:'v/lam',lam:'v/f'}},
    {id:'sound_int',cat:'waves',l:'شدت صوت',tex:'I = \\frac{P_s}{4\\pi r^2}',vars:{I:'W/m²',Ps:'W',r:'m'},solve:{I:'Ps/(4*Math.PI*r*r)',Ps:'I*4*Math.PI*r*r',r:'Math.sqrt(Ps/(4*Math.PI*I))'}},
    {id:'sound_level',cat:'waves',l:'تراز صوت',tex:'\\beta = 10\\log\\frac{I}{I_0}',vars:{beta:'dB',I:'W/m²',I0:'W/m²'},defaults:{I0:1e-12},ranges:{I:[1e-10,1e-3]},solve:{beta:'10*Math.log10(I/I0)',I:'I0*Math.pow(10,beta/10)',I0:'I/Math.pow(10,beta/10)'}},
    {id:'spring_T',cat:'waves',l:'دورهٔ فنر',tex:'T_p = 2\\pi\\sqrt{m/k_s}',vars:{Tp:'s',m:'kg',ks:'N/m'},solve:{Tp:'2*Math.PI*Math.sqrt(m/ks)',m:'ks*Math.pow(Tp/(2*Math.PI),2)',ks:'m*Math.pow(2*Math.PI/Tp,2)'}},

};

function evalExpr(expr, knowns){
  const keys = Object.keys(knowns).filter(k=>/^[A-Za-z_][A-Za-z0-9_]*$/.test(k));
  const vals = keys.map(k=>knowns[k]);
  try{
    const fn = new Function(...keys, `"use strict"; return (${expr});`);
    const r = fn(...vals);
    return Number.isFinite(r)?r:null;
  }catch(e){return null}
}

/* ═══════════════ حل ═══════════════ */
function solveOne(fid, target, userKnowns){
  const f = findF(fid); if(!f) return {err:'فرمول پیدا نشد'};
  if (!f.solve[target]) return {err:'این فرمول برای این متغیر حل نشده'};
  const K = Object.assign({}, f.defaults||{}, userKnowns);
  for (const v of Object.keys(f.vars)){
    if (v===target) continue;
    if (K[v]===undefined || K[v]===null || K[v]==='' || !Number.isFinite(+K[v])){
      return {err:`مقدار «${v}» را وارد کن`};
    }
    K[v] = +K[v];
  }
  const val = evalExpr(f.solve[target], K);
  if (val===null) return {err:'محاسبه ناموفق'};
  return {ok:true, val, unit:f.vars[target], expr:f.solve[target]};
}

function chainSolve(userKnowns, target, maxIter=30){
  let K={};
  for (const k in userKnowns){ if (Number.isFinite(+userKnowns[k])) K[k]=+userKnowns[k]; }
  const steps=[]; const used=new Set();
  for (let it=0; it<maxIter; it++){
    if (K[target]!==undefined) break;
    let progress=false;
    for (const f of KB.formulas){
      const unknown = Object.keys(f.vars).filter(v=>K[v]===undefined);
      if (unknown.length!==1) continue;
      const t = unknown[0];
      if (!f.solve[t]) continue;
      const sig = f.id+':'+t;
      if (used.has(sig)) continue;
      const localK = Object.assign({}, f.defaults||{}, K);
      const val = evalExpr(f.solve[t], localK);
      if (val===null) continue;
      K[t]=val; used.add(sig);
      steps.push({formula:f, target:t, val, unit:f.vars[t]});
      progress=true;
      if (t===target) return {ok:true, val, steps, knowns:K};
    }
    if (!progress) break;
  }
  return {ok:false, error:K[target]!==undefined?'':'به هدف نرسیدیم — داده‌های بیشتری لازم است', steps, knowns:K};
}

/* ═══════════════ پارس ═══════════════ */
function parseKnowns(text){
  const knowns={}, bad=[];
  const re=/([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(-?\d*\.?\d+(?:[eE][-+]?\d+)?)/g;
  let m;
  while((m=re.exec(text))!==null){ knowns[m[1]]=parseFloat(m[2]); }
  const cleaned = text.replace(re,'').replace(/[\s,;→\-]/g,'');
  if (cleaned) bad.push(cleaned);
  return {knowns, bad};
}

/* ═══════════════ تولید سؤال (آزمون) ═══════════════ */
function getRange(f, v){
  if (f.ranges && f.ranges[v]) return f.ranges[v];
  const u = f.vars[v];
  if (u==='s') return [1,15];
  if (u==='m/s'||u==='m/s²') return [1,20];
  if (u==='kg') return [0.5,20];
  if (u==='N') return [1,200];
  if (u==='J') return [1,500];
  if (u==='W') return [10,1000];
  if (u==='V') return [1,200];
  if (u==='A') return [0.5,10];
  if (u==='Ω') return [1,100];
  if (u==='mol') return [0.5,5];
  if (u==='g/mol') return [10,200];
  if (u==='mol/L') return [0.1,5];
  if (u==='m') return [0.5,10];
  return [1,10];
}
function pickVal(range){
  const [lo,hi]=range;
  if (lo>0 && hi/lo>1000){
    const lMin=Math.log10(lo), lMax=Math.log10(hi);
    const v = Math.pow(10, lMin+Math.random()*(lMax-lMin));
    return Number(v.toPrecision(2));
  }
  if (hi-lo>100) return Math.round(lo+Math.random()*(hi-lo));
  if (hi-lo>10) return Math.round((lo+Math.random()*(hi-lo))*10)/10;
  return Math.round((lo+Math.random()*(hi-lo))*100)/100;
}
function generateQuestion(catId, difficulty){
  const pool = catId==='all' ? KB.formulas : KB.formulas.filter(f=>f.cat===catId);
  if (difficulty==='easy'){
    const filtered = pool.filter(f=>Object.keys(f.vars).length<=4);
    if (filtered.length>0) return _genFromPool(filtered);
  }
  return _genFromPool(pool);
}
function _genFromPool(pool){
  for (let attempt=0; attempt<40; attempt++){
    const f = pool[Math.floor(Math.random()*pool.length)];
    const vars = Object.keys(f.vars);
    if (vars.length<2) continue;
    const target = vars[Math.floor(Math.random()*vars.length)];
    if (!f.solve[target]) continue;
    const knowns = {};
    let ok = true;
    for (const v of vars){
      if (v===target) continue;
      if (f.defaults && f.defaults[v]!==undefined){ knowns[v]=f.defaults[v]; continue; }
      const range = getRange(f,v);
      const val = pickVal(range);
      if (val===0){ok=false;break;}
      knowns[v]=val;
    }
    if (!ok) continue;
    const res = solveOne(f.id, target, knowns);
    if (!res.ok) continue;
    if (!Number.isFinite(res.val) || Math.abs(res.val)<1e-9 || Math.abs(res.val)>1e9) continue;
    return {formula:f, target, knowns, answer:res.val, unit:res.unit};
  }
  return null;
}
function checkAnswer(user, correct){
  if (correct===0) return Math.abs(user)<0.01;
  return Math.abs((user-correct)/correct)<0.02;
}

function buildShareStr(fid, target, knowns, answer){
  const p = new URLSearchParams();
  p.set('f', fid); p.set('t', target);
  if (answer!==undefined && answer!==null){ p.set('mode','solution'); p.set('_ans',String(answer)); }
  else p.set('mode','problem');
  Object.entries(knowns).forEach(([k,v])=>{ if(Number.isFinite(v)) p.set(k,String(v)); });
  return p.toString();
}
function buildShareURL(fid, target, knowns, answer){
  return location.origin + location.pathname + '#' + buildShareStr(fid,target,knowns,answer);
}
function checkShared(){
  if (!location.hash) return;
  try{
    const p = new URLSearchParams(location.hash.slice(1));
    const fid = p.get('f');
    if (!fid || !findF(fid)) return;
    const f = findF(fid);
    const target = p.get('t');
    if (!target || !f.vars[target]) return;
    const mode = p.get('mode')||'problem';
    const knowns = {};
    Object.keys(f.vars).forEach(v=>{ const val=p.get(v); if(val!==null && !isNaN(+val)) knowns[v]=+val; });
    const ans = p.get('_ans');
    S.formulaId=fid; S.catId=f.cat; S.target=target;
    S.knowns[fid]=knowns; S.tab='calc';
    S.shared={ mode, fid, target, knowns, answer: ans!==null?+ans:null };
    history.replaceState(null,'',location.pathname);
  }catch(e){console.warn(e)}
}

function renderChainResult(){
  const target = S.chainTarget;
  if (!target) return '';
  const parsed = parseKnowns(S.qText||'');
  if (parsed.knowns[target]!==undefined)
    return `<div class="result-box"><div class="lbl">${target} از قبل معلوم</div><div class="val">${fmt(parsed.knowns[target])}</div></div>`;
  const res = chainSolve(parsed.knowns, target);
  if (res.ok){
    const steps = res.steps.map((st,i)=>`<div class="step-item">
      <div class="st-h">گام ${i+1}: ${esc(st.formula.l)}</div>
      <div class="st-b">${esc(st.target)} = <b>${fmt(st.val)}</b> ${st.unit?`<span style="color:#94a3b8">${st.unit}</span>`:''}</div>
    </div>`).join('');
    return `<div class="result-box"><div class="lbl">نتیجه</div><div class="val">${target} = ${fmt(res.val)}</div></div>
      <div class="steps"><h4>مسیر حل (${res.steps.length} گام)</h4>${steps}</div>`;
  }
  const reachable = Object.keys(res.knowns).filter(k=>!parsed.knowns[k]);
  return `<div class="result-box err"><div class="lbl">نرسیدیم</div><div class="val">${esc(res.error)}</div></div>
    ${reachable.length?`<p class="hint">قابل محاسبه با این داده‌ها: ${reachable.map(v=>`<code>${v}</code>`).join(' ')}</p>`:''}`;
}

function renderVars(){
  const varMap={};
  KB.formulas.forEach(f=>Object.keys(f.vars).forEach(v=>{ (varMap[v]=varMap[v]||[]).push(f); }));
  const vars = Object.keys(varMap).sort();
  const sel = S.varSel;
  let detail='';
  if (sel && varMap[sel]){
    detail = `<h2 style="margin-top:18px">فرمول‌هایی که «${esc(sel)}» دارند</h2>
      ${varMap[sel].map(f=>`<div class="rel-item">
        <b>${esc(f.l)}</b>
        <div class="rel-tex">\\(${f.tex}\\)</div>
        <div class="rel-formula">${esc(f.solve[sel]||'—')}</div>
        <button class="mini-btn" data-jump="${f.id}">باز کردن در محاسبه‌گر</button>
      </div>`).join('')}`;
  }
  return `<div class="cd">
    <h2>کاوشگر متغیر</h2>
    <p class="hn">یک متغیر را انتخاب کن تا ببینی در کدام فرمول‌ها استفاده می‌شود.</p>
    <div class="var-explorer">${vars.map(v=>`<button class="${sel===v?'on':''}" data-vsel="${v}">${esc(v)}</button>`).join('')}</div>
    ${detail}
  </div>`;
}

/* ── آزمون ── */
function renderQuiz(){
  const q = S.quiz;
  if (q.phase==='idle'){
    const cats=[{id:'all',label:'همه'},...KB.cats];
    return `<div class="cd">
      <h2>آزمون سریع</h2>
      <p class="hn">سؤال‌ها از پایگاه دانش فرمول‌ها تصادفی تولید می‌شوند. پاسخ با خطای ۲٪ پذیرفته می‌شود.</p>
      <h4>دسته</h4>
      <div class="quiz-opt-row">${cats.map(c=>`<button class="quiz-opt ${q.category===c.id?'on':''}" data-qcat="${c.id}">${c.label}</button>`).join('')}</div>
      <h4>دشواری</h4>
      <div class="quiz-opt-row">
        <button class="quiz-opt ${q.difficulty==='easy'?'on':''}" data-qdiff="easy">آسان (فرمول ساده)</button>
        <button class="quiz-opt ${q.difficulty==='medium'?'on':''}" data-qdiff="medium">متوسط (همهٔ فرمول‌ها)</button>
      </div>
      <h4>تعداد سؤال</h4>
      <div class="quiz-opt-row">
        ${[5,10,15,20].map(n=>`<button class="quiz-opt ${q.total===n?'on':''}" data-qtotal="${n}">${n}</button>`).join('')}
      </div>
      <button class="b pr w" data-a="startQuiz" style="margin-top:14px"><i class="fa-solid fa-play"></i> شروع آزمون</button>
    </div>`;
  }
  if (q.phase==='asking'){
    const qq = q.questions[q.current];
    if (!qq) return '<div class="cd"><p>سؤالی موجود نیست.</p></div>';
    const f = qq.formula;
    const given = Object.entries(qq.knowns).map(([k,v])=>`<span>${esc(k)} = ${fmt(v)} ${f.vars[k]||''}</span>`).join('');
    const pct = ((q.current)/q.questions.length)*100;
    return `<div class="cd">
      <div class="quiz-score"><span>سؤال ${q.current+1} از ${q.questions.length}</span><span>نمره: <b>${q.score}</b></span></div>
      <div class="quiz-progress"><i style="width:${pct}%"></i></div>
      <div class="quiz-q">
        <h3>${esc(f.l)}</h3>
        <div style="direction:ltr;text-align:center;color:#fbbf24;font-size:16px;margin:8px 0">\\[${f.tex}\\]</div>
        <div class="given">${given}</div>
      </div>
      <h4>مقدار <b style="color:#fbbf24">${qq.target}</b> را محاسبه کن:</h4>
      <input class="quiz-input" type="number" step="any" id="quizInput" placeholder="پاسخ عددی" value="${esc(q.userAnswer)}" autofocus>
      <div class="row" style="gap:8px"><button class="b pr w" data-a="checkQuiz"><i class="fa-solid fa-check"></i> بررسی پاسخ</button></div>
    </div>`;
  }
  if (q.phase==='feedback'){
    const qq = q.questions[q.current];
    const next = q.current+1 < q.questions.length;
    return `<div class="cd">
      <div class="quiz-score"><span>سؤال ${q.current+1} از ${q.questions.length}</span><span>نمره: <b>${q.score}</b></span></div>
      <div class="quiz-feedback ${q.correct?'ok':'bad'}">
        <div class="big">${q.correct?'✅':'❌'}</div>
        <div class="txt">${q.correct?'پاسخ صحیح':'پاسخ درست نیست'}</div>
        <div class="sub">پاسخ تو: ${esc(q.userAnswer)}${qq.unit?' '+qq.unit:''}${!q.correct?` — پاسخ صحیح: ${fmt(qq.answer)} ${qq.unit||''}`:''}</div>
      </div>
      <div class="steps">
        <h4>مسیر حل</h4>
        <div class="step-item">
          <div class="st-h">${esc(qq.formula.l)}</div>
          <div class="st-b">${esc(qq.target)} = <b>${fmt(qq.answer)}</b> ${qq.unit?`<span style="color:#94a3b8">${qq.unit}</span>`:''}</div>
        </div>
        <p class="hint" style="direction:ltr;text-align:left">${esc(qq.formula.solve[qq.target])}</p>
      </div>
      <button class="b pr w" data-a="nextQuiz" style="margin-top:14px">
        ${next?'سؤال بعدی →':'پایان آزمون'}
      </button>
    </div>`;
  }
  if (q.phase==='done'){
    const pct = Math.round((q.score/q.questions.length)*100);
    return `<div class="quiz-final">
      <div style="font-size:14px;color:#cbd5e1">نتیجهٔ آزمون</div>
      <div class="big">${q.score}/${q.questions.length}</div>
      <div class="lbl">${pct}٪ درست</div>
      <p style="color:#cbd5e1;font-size:13.5px;margin:12px 0">${pct>=80?'🌟 عالی!':pct>=50?'👍 خوب بود.':'💪 نیاز به تمرین بیشتر داری.'}</p>
      <div class="row" style="justify-content:center;gap:8px">
        <button class="b pr" data-a="restartQuiz">آزمون جدید</button>
        <button class="b" data-a="exitQuiz">بازگشت به تنظیمات</button>
      </div>
    </div>`;
  }
  return '';
}

/* ═══════════════ چرخهٔ رندر ═══════════════ */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===S.tab));
  const app = $('#app');
  if (S.tab==='calc') app.innerHTML = renderCalc();
  else if (S.tab==='chain') app.innerHTML = renderChain();
  else if (S.tab==='quiz') app.innerHTML = renderQuiz();
  else if (S.tab==='vars') app.innerHTML = renderVars();
  else app.innerHTML = renderHelp();
  typeset();
}

/* ═══════════════ ذخیره‌سازی ═══════════════ */
function saveCurrentCalc(fid, target){
  const knowns = {};
  document.querySelectorAll('#app [data-var]').forEach(inp=>{
    if (inp.value.trim()!=='') knowns[inp.dataset.var]=+inp.value;
  });
  const res = solveOne(fid, target, knowns);
  if (!res.ok){ toast('محاسبه معتبر نیست'); return; }
  const f = findF(fid);
  S.saved.unshift({
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    fid, target, knowns, answer:res.val, unit:res.unit,
    label:f.l, savedAt:new Date().toISOString()
  });
  if (S.saved.length>50) S.saved.length=50;
  setSaved(S.saved);
  toast('ذخیره شد');
  render();
}
function getCurrentKnowns(){
  const knowns = {};
  document.querySelectorAll('#app [data-var]').forEach(inp=>{
    if (inp.value.trim()!=='') knowns[inp.dataset.var]=+inp.value;
  });
  return knowns;
}

/* ═══════════════ آزمون: شروع/بررسی ═══════════════ */
function startQuiz(){
  const q = S.quiz;
  const arr = [];
  for (let i=0; i<q.total; i++){
    const qq = generateQuestion(q.category, q.difficulty);
    if (qq) arr.push(qq);
  }
  if (!arr.length){ toast('تولید سؤال ناموفق'); return; }
  q.questions=arr; q.current=0; q.score=0; q.userAnswer=''; q.correct=null; q.phase='asking';
  render();
}
function checkQuizAnswer(){
  const q = S.quiz;
  const inp = document.getElementById('quizInput');
  if (inp) q.userAnswer = inp.value;
  const user = +q.userAnswer;
  if (!Number.isFinite(user)){ toast('یک عدد وارد کن'); return; }
  const qq = q.questions[q.current];
  q.correct = checkAnswer(user, qq.answer);
  if (q.correct) q.score++;
  q.phase='feedback';
  render();
}
function nextQuiz(){
  const q = S.quiz;
  if (q.current+1>=q.questions.length) q.phase='done';
  else { q.current++; q.userAnswer=''; q.correct=null; q.phase='asking'; }
  render();
}

/* ═══════════════ رویدادها ═══════════════ */
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('[data-t]');
  if (b){ S.tab=b.dataset.t; render(); window.scrollTo(0,0); }
});

$('#app').addEventListener('click', async e=>{
  const g = s => e.target.closest(s);

  if (g('[data-dismiss-share]')){ S.shared=null; render(); return; }

  if (g('[data-cat]')){
    S.catId = g('[data-cat]').dataset.cat;
    const first = KB.formulas.find(f=>f.cat===S.catId);
    if (first) S.formulaId=first.id;
    S.target=null; render(); return;
  }
  if (g('[data-f]')){ S.formulaId=g('[data-f]').dataset.f; S.target=null; render(); return; }

  if (g('[data-a="calc"]')){
    const f = findF(S.formulaId);
    const sel = document.getElementById('targetSel');
    const target = sel ? sel.value : null;
    if (!target){ toast('متغیر هدف را انتخاب کن'); return; }
    const vals = getCurrentKnowns();
    if (!S.knowns[f.id]) S.knowns[f.id]={};
    Object.assign(S.knowns[f.id], vals);
    const res = solveOne(f.id, target, vals);
    const ra = document.getElementById('resultArea');
    if (ra) ra.innerHTML = renderResult(res, target, f.id);
    if (res.ok) S.target = target;
    typeset(); return;
  }

  // ذخیره
  if (g('[data-save]')){
    const target = S.target;
    if (!target){ toast('ابتدا محاسبه کن'); return; }
    saveCurrentCalc(S.formulaId, target); return;
  }
  // اشتراک مسئله
  if (g('[data-share-problem]')){
    const target = S.target;
    if (!target){ toast('ابتدا محاسبه کن'); return; }
    const knowns = getCurrentKnowns();
    const url = buildShareURL(S.formulaId, target, knowns, null);
    const ok = await copyText(url);
    toast(ok?'لینک مسئله کپی شد':'کپی نشد، دستی کپی کن');
    return;
  }
  // اشتراک حل
  if (g('[data-share-solution]')){
    const target = S.target;
    if (!target){ toast('ابتدا محاسبه کن'); return; }
    const knowns = getCurrentKnowns();
    const res = solveOne(S.formulaId, target, knowns);
    if (!res.ok){ toast('محاسبه معتبر نیست'); return; }
    const url = buildShareURL(S.formulaId, target, knowns, res.val);
    const ok = await copyText(url);
    toast(ok?'لینک حل کپی شد':'کپی نشد');
    return;
  }

  // بارگذاری ذخیره
  if (g('[data-load-saved]')){
    const item = S.saved.find(x=>x.id===g('[data-load-saved]').dataset.loadSaved);
    if (!item) return;
    S.formulaId=item.fid; S.catId=findF(item.fid).cat;
    S.target=item.target; S.knowns[item.fid]={...item.knowns};
    render(); return;
  }
  if (g('[data-share-saved]')){
    const item = S.saved.find(x=>x.id===g('[data-share-saved]').dataset.shareSaved);
    if (!item) return;
    const url = buildShareURL(item.fid, item.target, item.knowns, null);
    const ok = await copyText(url);
    toast(ok?'لینک مسئله کپی شد':'کپی نشد'); return;
  }
  if (g('[data-del-saved]')){
    S.saved = S.saved.filter(x=>x.id!==g('[data-del-saved]').dataset.delSaved);
    setSaved(S.saved); render(); return;
  }
  if (g('[data-clear-saved]')){
    if (!confirm('همهٔ ذخیره‌ها پاک شوند؟')) return;
    S.saved=[]; setSaved(S.saved); render(); return;
  }

  // زنجیره
  if (g('[data-a="chain"]')){
    const qt = document.getElementById('qin');
    if (qt) S.qText = qt.value;
    const sel = document.getElementById('chainTarget');
    if (sel) S.chainTarget = sel.value;
    render(); return;
  }

  // کاوشگر
  if (g('[data-vsel]')){ S.varSel = g('[data-vsel]').dataset.vsel; render(); return; }
  if (g('[data-jump]')){
    const f = findF(g('[data-jump]').dataset.jump);
    if (f){ S.catId=f.cat; S.formulaId=f.id; S.target=null; S.tab='calc'; render(); window.scrollTo(0,0); }
    return;
  }

  // آزمون
  if (g('[data-qcat]')){ S.quiz.category = g('[data-qcat]').dataset.qcat; render(); return; }
  if (g('[data-qdiff]')){ S.quiz.difficulty = g('[data-qdiff]').dataset.qdiff; render(); return; }
  if (g('[data-qtotal]')){ S.quiz.total = +g('[data-qtotal]').dataset.qtotal; render(); return; }
  if (g('[data-a="startQuiz"]')){ startQuiz(); return; }
  if (g('[data-a="checkQuiz"]')){ checkQuizAnswer(); return; }
  if (g('[data-a="nextQuiz"]')){ nextQuiz(); return; }
  if (g('[data-a="restartQuiz"]')){ startQuiz(); return; }
  if (g('[data-a="exitQuiz"]')){ S.quiz.phase='idle'; render(); return; }
});

$('#app').addEventListener('input', e=>{
  if (e.target.id==='qin') S.qText = e.target.value;
  if (e.target.id==='quizInput') S.quiz.userAnswer = e.target.value;
});
$('#app').addEventListener('change', e=>{
  if (e.target.id==='targetSel'){ S.target = e.target.value; render(); }
  if (e.target.id==='chainTarget') S.chainTarget = e.target.value;
});
$('#app').addEventListener('keydown', e=>{
  if (e.key==='Enter' && e.target.id==='quizInput'){ e.preventDefault(); checkQuizAnswer(); }
});

/* ═══════════════ شروع ═══════════════ */
checkShared();
render();
</script>
