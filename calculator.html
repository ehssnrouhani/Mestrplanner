<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاسبه‌گر تخصصی فیزیک و شیمی | مستر پلنر</title>
<meta name="description" content="محاسبه‌گر و تمرین‌کنندهٔ فیزیک و شیمی: حل هر فرمول، حل زنجیره‌ای، تمرین بی‌پایان با پاسخ صحیح، رسم نمودار و اشتراک مسئله.">
<link rel="icon" type="image/jpeg" href="assets/logo/logo.jpg">
<link rel="canonical" href="https://ehssnrouhani.github.io/Mestrplanner/calculator.html">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
main{max-width:1000px;margin:0 auto;padding:0 20px 60px}
.tabs{max-width:1000px;margin:0 auto}
.cat-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cat-bar button{background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;font-family:inherit}
.cat-bar button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:18px}
.fcard{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
.fcard:hover{border-color:var(--gold);transform:translateY(-1px)}
.fcard.on{border-color:var(--gold);background:var(--gold-soft)}
.fcard b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:6px}
.fcard small{font-size:11.5px;color:var(--muted)}
.fcard .tex-mini{font-size:13px;color:var(--gold);margin-top:6px;direction:ltr;text-align:left}
.var-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.vfield label{display:block;font-size:12px;color:var(--gold);margin-bottom:4px;font-weight:700}
.vfield input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;color:var(--ink);font-family:inherit}
.vfield input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.vfield small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;direction:ltr;text-align:left}
.target-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.target-row select{flex:1;min-width:200px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;color:var(--ink);font-size:14px;font-weight:700}
.result-box{background:linear-gradient(135deg,var(--bg2),var(--panel));border:2px solid var(--gold);border-radius:16px;padding:20px;margin-top:14px;text-align:center}
.result-box .lbl{font-size:13px;color:var(--gold);font-weight:700;margin-bottom:6px}
.result-box .val{font-size:30px;font-weight:800;color:var(--ink);direction:ltr;font-variant-numeric:tabular-nums}
.result-box .unit{font-size:15px;color:var(--muted);margin-right:8px}
.result-box .expr{font-size:12px;color:var(--muted);margin-top:8px;direction:ltr}
.result-box.err{border-color:var(--bad);background:var(--bad-soft)}
.result-box.err .val{font-size:15px;color:var(--bad)}
.steps{background:var(--bg2);border:1px dashed var(--line);border-radius:14px;padding:14px;margin-top:14px}
.steps h4{margin:0 0 10px;color:var(--gold);font-size:13.5px}
.step-item{background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:8px;border-right:3px solid var(--gold)}
.step-item:last-child{margin-bottom:0}
.step-item .st-h{font-size:12.5px;color:var(--gold);font-weight:700;margin-bottom:6px}
.step-item .st-b{font-size:14px;color:var(--ink2);direction:ltr;text-align:left;font-family:'Courier New',monospace;line-height:1.8}
.step-item .st-b b{color:var(--ok);font-weight:800}
.qinput{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:'Courier New',monospace;font-size:14px;color:var(--ink);direction:ltr;text-align:left}
.qinput::placeholder{color:var(--muted);direction:rtl;text-align:right;font-family:'Vazirmatn',Tahoma,sans-serif}
.parsed{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.parsed span{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;direction:ltr}
.parsed span.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0;line-height:1.8}
.hint code{background:var(--bg2);padding:1px 6px;border-radius:4px;color:var(--gold);font-family:'Courier New',monospace;direction:ltr;display:inline-block}
.var-explorer{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:16px;max-height:220px;overflow-y:auto;padding:8px;background:var(--bg2);border-radius:12px;border:1px solid var(--line)}
.var-explorer button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink2);font-size:12.5px;font-weight:700;direction:ltr;text-align:center;font-family:inherit}
.var-explorer button:hover{border-color:var(--gold)}
.var-explorer button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.rel-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.rel-item b{display:block;font-size:13px;color:var(--ink);margin-bottom:4px}
.rel-item .rel-tex{font-size:12.5px;color:var(--gold);direction:ltr;text-align:left;margin:4px 0}
.rel-item .rel-formula{font-size:12px;color:var(--muted);direction:ltr;text-align:left;background:var(--bg2);padding:6px 10px;border-radius:6px;font-family:'Courier New',monospace;margin-top:4px}
.mini-btn{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;color:var(--ink2);font-size:12px;font-weight:700;font-family:inherit}
.mini-btn:hover{border-color:var(--gold);color:var(--gold)}
.mini-btn.pr{background:var(--gold);border-color:var(--gold);color:#fff}
.help-section{background:var(--panel);border-radius:14px;padding:18px;margin-bottom:14px;border-right:4px solid var(--gold)}
.help-section h3{font-size:15px;color:var(--gold);margin:0 0 8px}
.help-section p,.help-section li{font-size:13.5px;color:var(--ink2);line-height:1.9}
.help-section code{background:var(--bg2);padding:2px 8px;border-radius:5px;color:var(--ok);font-family:'Courier New',monospace;direction:ltr;display:inline-block}
.tabs{overflow-x:auto}.tabs button{white-space:nowrap;padding:11px 12px;flex:1 0 auto}
.gwrap svg{width:100%;height:auto;background:var(--bg2);border-radius:12px;display:block}
.quiz-q .given{margin-top:10px}
.share-banner{background:var(--gold-soft);border:2px solid var(--gold);border-radius:14px;padding:16px 20px;margin-bottom:14px;color:var(--ink2);font-size:13.5px;line-height:1.85}
.share-banner b{color:var(--gold)}
.share-banner .row{margin-top:10px}
.saved-section{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.saved-section h3{font-size:14px;color:var(--gold);margin:0 0 10px}
.saved-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--bg2);margin-bottom:6px;font-size:12.5px;color:var(--ink2)}
.saved-item b{flex:1;font-weight:700;color:var(--ink)}
.saved-item .meta{font-size:11px;color:var(--muted)}
.quiz-opt-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.quiz-opt{background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;color:var(--ink);font-weight:700;font-size:13px;font-family:inherit}
.quiz-opt.on{background:var(--gold);border-color:var(--gold);color:#fff}
.quiz-input{width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:14px 16px;font-family:'Courier New',monospace;font-size:20px;color:var(--ink);direction:ltr;text-align:center;font-weight:800;margin:12px 0}
.quiz-input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.quiz-score{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--ink2)}
.quiz-score b{color:var(--gold);font-size:16px}
.quiz-progress{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.quiz-progress i{display:block;height:100%;background:var(--gold);transition:width .3s}
.quiz-q{background:var(--bg2);border-radius:12px;padding:16px;margin-bottom:14px}
.quiz-q h3{font-size:15px;color:var(--gold);margin:0 0 10px}
.quiz-q .given{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.quiz-q .given span{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);border-radius:8px;padding:5px 12px;font-size:13px;font-family:'Courier New',monospace;direction:ltr}
.quiz-feedback{border-radius:14px;padding:18px;margin-bottom:14px;text-align:center}
.quiz-feedback.ok{background:var(--ok-soft);border:2px solid var(--ok)}
.quiz-feedback.bad{background:var(--bad-soft);border:2px solid var(--bad)}
.quiz-feedback .big{font-size:26px;margin-bottom:6px}
.quiz-feedback .txt{font-size:16px;font-weight:800;color:var(--ink)}
.quiz-feedback .sub{font-size:13px;color:var(--ink2);margin-top:8px}
.quiz-final{text-align:center;padding:30px 20px;background:linear-gradient(135deg,var(--bg2),var(--panel));border:2px solid var(--gold);border-radius:16px}
.quiz-final .big{font-size:56px;font-weight:800;color:var(--gold);direction:ltr;font-variant-numeric:tabular-nums}
.quiz-final .lbl{font-size:15px;color:var(--ink2);margin:8px 0}
@media print{.top,.tabs,.noprint{display:none!important}main{padding:0;max-width:100%}}
</style>
</head>
<body>
<div id="kit-header"></div>
<div class="wrap" style="max-width:1000px;margin:0 auto;padding:0 20px 60px">
  <div class="tabs" id="tabs">
    <button data-t="calc" class="on">محاسبه</button>
    <button data-t="chain">زنجیره</button>
    <button data-t="quiz">تمرین</button>
    <button data-t="graph">نمودار</button>
    <button data-t="vars">شبکهٔ متغیر</button>
    <button data-t="help">راهنما</button>
  </div>
  <div id="app" style="margin-top:16px"></div>
</div>
<div id="toast"></div>
<script src="tool-kit.js"></script>
<script>
/* ═══════════════ پایگاه دانش ═══════════════ */
const KB = {
  cats:[
    {id:'mechanics',label:'مکانیک',icon:'fa-person-running'},
    {id:'electricity',label:'الکتریسیته',icon:'fa-bolt'},
    {id:'magnetism',label:'مغناطیس',icon:'fa-magnet'},
    {id:'waves',label:'موج و نوسان',icon:'fa-wave-square'},
    {id:'thermo',label:'گرما و شاره',icon:'fa-temperature-half'},
    {id:'atomic',label:'فیزیک جدید',icon:'fa-atom'},
    {id:'chemistry',label:'شیمی',icon:'fa-flask'}
  ],
  formulas:[
    {id:'v_kin',cat:'mechanics',l:'سرعت نهایی (شتاب ثابت)',tex:'v = v_0 + at',vars:{v:'m/s',v0:'m/s',a:'m/s²',t:'s'},solve:{v:'v0+a*t',v0:'v-a*t',a:'(v-v0)/t',t:'(v-v0)/a'}},
    {id:'x_kin',cat:'mechanics',l:'جابجایی (شتاب ثابت)',tex:'x = v_0 t + \\tfrac{1}{2}at^2',vars:{x:'m',v0:'m/s',a:'m/s²',t:'s'},solve:{x:'v0*t+0.5*a*t*t',v0:'(x-0.5*a*t*t)/t',a:'2*(x-v0*t)/(t*t)',t:'(-v0+Math.sqrt(v0*v0+2*a*x))/a'}},
    {id:'v2_kin',cat:'mechanics',l:'رابطهٔ سرعت و جابجایی',tex:'v^2 = v_0^2 + 2a\\Delta x',vars:{v:'m/s',v0:'m/s',a:'m/s²',dx:'m'},solve:{v:'Math.sqrt(v0*v0+2*a*dx)',v0:'Math.sqrt(v*v-2*a*dx)',a:'(v*v-v0*v0)/(2*dx)',dx:'(v*v-v0*v0)/(2*a)'}},
    {id:'newton2',cat:'mechanics',l:'قانون دوم نیوتن',tex:'F = ma',vars:{F:'N',m:'kg',a:'m/s²'},solve:{F:'m*a',m:'F/a',a:'F/m'}},
    {id:'weight',cat:'mechanics',l:'وزن',tex:'W = mg',vars:{W:'N',m:'kg',g:'m/s²'},defaults:{g:10},solve:{W:'m*g',m:'W/g',g:'W/m'}},
    {id:'friction',cat:'mechanics',l:'اصطکاک جنبشی',tex:'f_k = \\mu N',vars:{fk:'N',mu:'-',N:'N'},ranges:{mu:[0.1,0.8]},solve:{fk:'mu*N',mu:'fk/N',N:'fk/mu'}},
    {id:'circ_ac',cat:'mechanics',l:'شتاب مرکزگرا',tex:'a_c = \\frac{v^2}{r}',vars:{ac:'m/s²',v:'m/s',r:'m'},solve:{ac:'v*v/r',v:'Math.sqrt(ac*r)',r:'v*v/ac'}},
    {id:'work',cat:'mechanics',l:'کار نیرو',tex:'W = Fd\\cos\\theta',vars:{W:'J',F:'N',d:'m',cos:'-'},defaults:{cos:1},ranges:{cos:[0.5,1]},solve:{W:'F*d*cos',F:'W/(d*cos)',d:'W/(F*cos)',cos:'W/(F*d)'}},
    {id:'kinetic',cat:'mechanics',l:'انرژی جنبشی',tex:'K = \\tfrac{1}{2}mv^2',vars:{K:'J',m:'kg',v:'m/s'},solve:{K:'0.5*m*v*v',m:'2*K/(v*v)',v:'Math.sqrt(2*K/m)'}},
    {id:'potential',cat:'mechanics',l:'انرژی پتانسیل گرانشی',tex:'U = mgh',vars:{U:'J',m:'kg',g:'m/s²',h:'m'},defaults:{g:10},solve:{U:'m*g*h',m:'U/(g*h)',g:'U/(m*h)',h:'U/(m*g)'}},
    {id:'power',cat:'mechanics',l:'توان مکانیکی',tex:'P_w = \\frac{W}{t}',vars:{Pw:'W',W:'J',t:'s'},solve:{Pw:'W/t',W:'Pw*t',t:'W/Pw'}},
    {id:'work_energy',cat:'mechanics',l:'قضیهٔ کار-انرژی',tex:'W_{net} = \\Delta K',vars:{Wnet:'J',dK:'J'},solve:{Wnet:'dK',dK:'Wnet'}},
    {id:'coulomb',cat:'electricity',l:'قانون کولن',tex:'F = k\\frac{|q_1 q_2|}{r^2}',vars:{F:'N',k:'N·m²/C²',q1:'C',q2:'C',r:'m'},defaults:{k:9e9},ranges:{q1:[1e-6,1e-3],q2:[1e-6,1e-3],r:[0.1,1]},solve:{F:'k*q1*q2/(r*r)',k:'F*r*r/(q1*q2)',q1:'F*r*r/(k*q2)',q2:'F*r*r/(k*q1)',r:'Math.sqrt(Math.abs(k*q1*q2/F))'}},
    {id:'efield',cat:'electricity',l:'میدان ذرهٔ باردار',tex:'E = k\\frac{Q}{r^2}',vars:{E:'N/C',k:'N·m²/C²',Q:'C',r:'m'},defaults:{k:9e9},ranges:{Q:[1e-9,1e-6],r:[0.1,1]},solve:{E:'k*Q/(r*r)',k:'E*r*r/Q',Q:'E*r*r/k',r:'Math.sqrt(Math.abs(k*Q/E))'}},
    {id:'vpoint',cat:'electricity',l:'پتانسیل ذرهٔ باردار',tex:'V_p = k\\frac{Q}{r}',vars:{Vp:'V',k:'N·m²/C²',Q:'C',r:'m'},defaults:{k:9e9},ranges:{Q:[1e-9,1e-6],r:[0.1,1]},solve:{Vp:'k*Q/r',k:'Vp*r/Q',Q:'Vp*r/k',r:'k*Q/Vp'}},
    {id:'unifield',cat:'electricity',l:'میدان یکنواخت',tex:'V_p = Ed',vars:{Vp:'V',E:'V/m',d:'m'},ranges:{E:[1,500],d:[0.1,2]},solve:{Vp:'E*d',E:'Vp/d',d:'Vp/E'}},
    {id:'capacitor',cat:'electricity',l:'ظرفیت خازن',tex:'C = \\frac{Q}{V_p}',vars:{C:'F',Q:'C',Vp:'V'},ranges:{C:[1e-9,1e-6],Q:[1e-9,1e-6],Vp:[1,100]},solve:{C:'Q/Vp',Q:'C*Vp',Vp:'Q/C'}},
    {id:'cap_energy',cat:'electricity',l:'انرژی خازن',tex:'U_c = \\tfrac{1}{2}QV_p',vars:{Uc:'J',Q:'C',Vp:'V'},ranges:{Q:[1e-6,1e-3],Vp:[1,100]},solve:{Uc:'0.5*Q*Vp',Q:'2*Uc/Vp',Vp:'2*Uc/Q'}},
    {id:'current_def',cat:'electricity',l:'تعریف جریان',tex:'I = \\frac{Q}{t}',vars:{I:'A',Q:'C',t:'s'},solve:{I:'Q/t',Q:'I*t',t:'Q/I'}},
    {id:'ohm',cat:'electricity',l:'قانون اهم',tex:'V_p = IR',vars:{Vp:'V',I:'A',R:'Ω'},solve:{Vp:'I*R',I:'Vp/R',R:'Vp/I'}},
    {id:'elec_power',cat:'electricity',l:'توان الکتریکی',tex:'P_e = V_p I',vars:{Pe:'W',Vp:'V',I:'A'},solve:{Pe:'Vp*I',Vp:'Pe/I',I:'Pe/Vp'}},
    {id:'r_wire',cat:'electricity',l:'مقاومت سیم',tex:'R = \\rho\\frac{L}{A}',vars:{R:'Ω',rho:'Ω·m',L:'m',A:'m²'},ranges:{rho:[1e-8,1e-6],L:[0.5,5],A:[1e-6,1e-3]},solve:{R:'rho*L/A',rho:'R*A/L',L:'R*A/rho',A:'rho*L/R'}},
    {id:'r_series',cat:'electricity',l:'مقاومت سری',tex:'R_s = R_1 + R_2',vars:{Rs:'Ω',R1:'Ω',R2:'Ω'},solve:{Rs:'R1+R2',R1:'Rs-R2',R2:'Rs-R1'}},
    {id:'mag_charge',cat:'magnetism',l:'نیروی مغناطیسی بر بار',tex:'F = qvB\\sin\\theta',vars:{F:'N',q:'C',v:'m/s',B:'T',sin:'-'},defaults:{sin:1},ranges:{q:[1e-6,1e-3],v:[1,10],B:[0.1,2]},solve:{F:'q*v*B*sin',q:'F/(v*B*sin)',v:'F/(q*B*sin)',B:'F/(q*v*sin)',sin:'F/(q*v*B)'}},
    {id:'mag_wire',cat:'magnetism',l:'نیروی مغناطیسی بر سیم',tex:'F = ILB\\sin\\theta',vars:{F:'N',I:'A',L:'m',B:'T',sin:'-'},defaults:{sin:1},ranges:{I:[0.5,10],L:[0.1,2],B:[0.1,2]},solve:{F:'I*L*B*sin',I:'F/(L*B*sin)',L:'F/(I*B*sin)',B:'F/(I*L*sin)',sin:'F/(I*L*B)'}},
    {id:'mag_radius',cat:'magnetism',l:'شعاع مسیر دایره‌ای',tex:'r = \\frac{mv}{qB}',vars:{r:'m',m:'kg',v:'m/s',q:'C',B:'T'},ranges:{m:[1e-27,1e-25],v:[1e5,1e7],q:[1e-19,1e-18],B:[0.1,2]},solve:{r:'m*v/(q*B)',m:'r*q*B/v',v:'r*q*B/m',q:'m*v/(r*B)',B:'m*v/(r*q)'}},
    {id:'wave_speed',cat:'waves',l:'سرعت موج',tex:'v = f\\lambda',vars:{v:'m/s',f:'Hz',lam:'m'},ranges:{f:[10,1000],lam:[0.1,10]},solve:{v:'f*lam',f:'v/lam',lam:'v/f'}},
    {id:'sound_int',cat:'waves',l:'شدت صوت',tex:'I = \\frac{P_s}{4\\pi r^2}',vars:{I:'W/m²',Ps:'W',r:'m'},solve:{I:'Ps/(4*Math.PI*r*r)',Ps:'I*4*Math.PI*r*r',r:'Math.sqrt(Ps/(4*Math.PI*I))'}},
    {id:'sound_level',cat:'waves',l:'تراز صوت',tex:'\\beta = 10\\log\\frac{I}{I_0}',vars:{beta:'dB',I:'W/m²',I0:'W/m²'},defaults:{I0:1e-12},ranges:{I:[1e-10,1e-3]},solve:{beta:'10*Math.log10(I/I0)',I:'I0*Math.pow(10,beta/10)',I0:'I/Math.pow(10,beta/10)'}},

function solveOne(fid, target, userKnowns){
  const f = findF(fid); if(!f) return {err:'فرمول پیدا نشد'};
  if (!f.solve[target]) return {err:'این فرمول برای این متغیر حل نشده'};
  const K = Object.assign({}, f.defaults||{}, userKnowns);
  for (const v of Object.keys(f.vars)){
    if (v===target) continue;
    if (K[v]===undefined || K[v]===null || K[v]==='' || !Number.isFinite(+K[v])){
      return {err:`مقدار «${v}» را وارد کن`};
    }
    K[v] = +K[v];
  }
  const val = evalExpr(f.solve[target], K);
  if (val===null) return {err:'محاسبه ناموفق'};
  return {ok:true, val, unit:f.vars[target], expr:f.solve[target]};
}

function chainSolve(userKnowns,target,maxIter=40){
  const K={};
  for(const k in userKnowns){if(Number.isFinite(+userKnowns[k]))K[k]=+userKnowns[k]}
  const steps=[],used=new Set();
  for(let it=0;it<maxIter&&K[target]===undefined;it++){
    let prog=false;
    for(const f of KB.formulas){
      const unk=Object.keys(f.vars).filter(v=>K[v]===undefined&&(!(f.defaults&&f.defaults[v]!==undefined)||v===target));
      if(unk.length!==1)continue;
      const t=unk[0];if(!f.solve[t])continue;
      const sg=f.id+':'+t;if(used.has(sg))continue;
      const vals=Object.assign({},f.defaults||{},K);
      const val=evalExpr(f.solve[t],vals);
      if(val===null)continue;
      K[t]=val;used.add(sg);
      steps.push({formula:f,target:t,val,unit:f.vars[t],expr:f.solve[t],vals,inputs:Object.keys(f.vars).filter(v=>v!==t)});
      prog=true;if(t===target)break;
    }
    if(!prog)break;
  }
  if(K[target]===undefined)return{ok:false,error:'به هدف نرسیدیم — داده‌های بیشتری لازم است',steps,knowns:K};
  const need=new Set([target]),keep=[];
  for(let i=steps.length-1;i>=0;i--){const s=steps[i];if(need.has(s.target)){keep.unshift(s);s.inputs.forEach(v=>need.add(v))}}
  return{ok:true,val:K[target],steps:keep,knowns:K};
}

function parseKnowns(text){
  text=String(text||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫]/g,'.');
  let target=null;
  const am=text.match(/(?:→|->|=>|⟶)\s*([A-Za-z_]\w*)/);
  if(am){target=am[1];text=text.replace(am[0],'')}
  const knowns={},bad=[];
  const re=/([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(-?\d*\.?\d+(?:[eE][-+]?\d+)?)/g;
  let m;
  while((m=re.exec(text))!==null){knowns[m[1]]=parseFloat(m[2])}
  const cleaned=text.replace(re,'').replace(/[\s,;→\-]/g,'');
  if(cleaned)bad.push(cleaned);
  return{knowns,bad,target};
}

function getRange(f, v){
  if (f.ranges && f.ranges[v]) return f.ranges[v];

  if (u==='s') return [1,15];
  if (u==='m/s'||u==='m/s²') return [1,20];
  if (u==='kg') return [0.5,20];
  if (u==='N') return [1,200];
  if (u==='J') return [1,500];
  if (u==='W') return [10,1000];
  if (u==='V') return [1,200];
  if (u==='A') return [0.5,10];
  if (u==='Ω') return [1,100];
  if (u==='mol') return [0.5,5];
  if (u==='g/mol') return [10,200];
  if (u==='mol/L') return [0.1,5];
  if (u==='m') return [0.5,10];
  return [1,10];
}
function pickVal(range){
  const [lo,hi]=range;let v;
  if(lo>0&&hi/lo>100)v=Math.pow(10,Math.log10(lo)+Math.random()*(Math.log10(hi)-Math.log10(lo)));
  else v=lo+Math.random()*(hi-lo);
  const a=Math.abs(v),r=a>=100?Number(v.toFixed(0)):a>=10?Number(v.toFixed(1)):a>=1?Number(v.toFixed(2)):Number(v.toPrecision(2));
  return r||Number(v.toPrecision(2));
}

function genCalc(pool){

    const f=pick(pool),vars=Object.keys(f.vars);if(vars.length<2)continue;
    const free=vars.filter(v=>!isC(f,v)&&f.solve[v]);if(free.length<2)continue;
    const T={};vars.forEach(v=>T[v]=isC(f,v)?f.defaults[v]:pickVal(getRange(f,v)));
    if(vars.some(v=>T[v]===0))continue;
    const dep=pick(free),dv=evalExpr(f.solve[dep],T);if(dv===null||dv===0)continue;T[dep]=dv;
    const kn={};vars.forEach(v=>kn[v]=isC(f,v)?T[v]:sig(T[v]));
    const target=pick(free);delete kn[target];
    const ans=evalExpr(f.solve[target],kn);
    if(ans===null||Math.abs(ans)<1e-12||Math.abs(ans)>1e12)continue;
    if(Math.abs(ans-T[target])>0.02*Math.abs(T[target]))continue;
    const u=f.vars[target];
    return{type:'calc',formula:f,target,knowns:kn,answer:ans,unit:u,steps:[{formula:f,target,expr:f.solve[target],vals:kn,val:ans,unit:u}]};
  }return null;
}
function genChain(pool){
  for(let at=0;at<250;at++){
    const f2=pick(pool),f1=pick(KB.formulas);if(f1===f2)continue;
    const sh=Object.keys(f1.vars).filter(v=>f2.vars[v]&&f1.vars[v]===f2.vars[v]&&!isC(f1,v)&&!isC(f2,v)&&f1.solve[v]);
    if(!sh.length)continue;const x=pick(sh),V={};
    Object.keys(f1.vars).forEach(v=>{if(v!==x)V[v]=isC(f1,v)?f1.defaults[v]:pickVal(getRange(f1,v))});
    const xv=evalExpr(f1.solve[x],V);if(xv===null||xv<=0)continue;V[x]=xv;
    const t2=Object.keys(f2.vars).filter(v=>!f1.vars[v]&&!isC(f2,v)&&f2.solve[v]);if(!t2.length)continue;
    Object.keys(f2.vars).forEach(v=>{if(!(v in V)&&!t2.includes(v))V[v]=isC(f2,v)?f2.defaults[v]:pickVal(getRange(f2,v))});
    const target=pick(t2),tv=evalExpr(f2.solve[target],V);if(tv===null||tv===0)continue;
    const giv={};Object.keys(V).forEach(v=>{if(v===x||isC(f1,v)||isC(f2,v))return;giv[v]=sig(V[v])});
    const r=chainSolve(giv,target);
    if(!r.ok||r.steps.length<2||r.steps.length>3)continue;
    if(Math.abs(r.val)<1e-12||Math.abs(r.val)>1e12||Math.abs(r.val-tv)>0.03*Math.abs(tv))continue;
    return{type:'chain',target,knowns:giv,answer:r.val,unit:f2.vars[target],steps:r.steps};
  }return null;
}
function genRatio(pool){
  for(let at=0;at<200;at++){
    const f=pick(pool),vars=Object.keys(f.vars),free=vars.filter(v=>!isC(f,v));if(free.length<2)continue;
    const ys=free.filter(v=>f.solve[v]);if(!ys.length)continue;
    const y=pick(ys),x=pick(free.filter(v=>v!==y));
    const mkK=()=>{const K={};vars.forEach(v=>K[v]=isC(f,v)?f.defaults[v]:sig(pickVal(getRange(f,v))));return K};
    const expo=K=>{
      const ev=m=>evalExpr(f.solve[y],{...K,[x]:K[x]*m});
      const a=ev(1),b=ev(2),c=ev(3),d=ev(.5);
      if([a,b,c,d].some(t=>t===null||t===0)||[b,c,d].some(t=>Math.sign(t)!==Math.sign(a)))return null;
      const p=Math.log(b/a)/Math.LN2;
      return Math.abs(p-Math.log(c/a)/Math.log(3))<1e-6&&Math.abs(p-Math.log(a/d)/Math.LN2)<1e-6?p:null;
    };
    const K=mkK(),K2=mkK();
    if(vars.some(v=>!K[v]||!K2[v]))continue;
    const p=expo(K),p2=expo(K2);
    if(p===null||p2===null||Math.abs(p-p2)>1e-6)continue;
    if(Math.abs(p*2-Math.round(p*2))>1e-6||Math.abs(p)<0.4||Math.abs(p)>3.1)continue;
    const k=Math.abs(p%1)>0.1?pick([4,9,16,0.25]):pick([2,3,4,5,0.5]);
    const ans=evalExpr(f.solve[y],{...K,[x]:K[x]*k})/evalExpr(f.solve[y],K);
    return{type:'ratio',formula:f,x,y,k,p,answer:ans,unit:'برابر'};
  }return null;
}
function genQuestion(){
  const q=S.quiz;let pool=q.category==='all'?KB.formulas:KB.formulas.filter(f=>f.cat===q.category);
  if(q.difficulty==='easy'){const e=pool.filter(f=>Object.keys(f.vars).length<=4);if(e.length)pool=e}
  let t=q.type==='mix'?pick(['calc','calc','ratio']):q.type;
  if(t==='calc'&&q.difficulty==='hard')t='chain';
  const order={calc:[genCalc],ratio:[genRatio,genCalc],chain:[genChain,genCalc]}[t];
  for(const g of order){const r=g(pool);if(r)return r}
  return null;
}
function checkAnswer(user, correct){
  if (correct===0) return Math.abs(user)<0.01;
  return Math.abs((user-correct)/correct)<0.02;
}

/* ═══════════════ اشتراک ═══════════════ */
function buildShareStr(fid,target,knowns,answer){
  const p=new URLSearchParams();p.set('f',fid);p.set('t',target);
  if(answer!==undefined&&answer!==null){p.set('mode','solution');p.set('ans',String(answer))}else p.set('mode','problem');
  Object.entries(knowns).forEach(([k,v])=>{if(Number.isFinite(v))p.set('v_'+k,String(v))});
  return p.toString();
}
function buildShareURL(fid,target,knowns,answer){return location.origin+location.pathname+'#'+buildShareStr(fid,target,knowns,answer)}
function checkShared(){
  if(!location.hash)return;
  try{
    const p=new URLSearchParams(location.hash.slice(1)),fid=p.get('f');
    if(!fid||!findF(fid))return;
    const f=findF(fid),target=p.get('t');
    if(!target||f.vars[target]===undefined)return;
    const knowns={};
    Object.keys(f.vars).forEach(v=>{const val=p.get('v_'+v);if(val!==null&&val!==''&&Number.isFinite(+val))knowns[v]=+val});
    const ans=p.get('ans');
    S.formulaId=fid;S.catId=f.cat;S.target=target;S.knowns[fid]=knowns;S.tab='calc';
    S.shared={mode:p.get('mode')||'problem',fid,target,knowns,answer:ans!==null&&Number.isFinite(+ans)?+ans:null};
    history.replaceState(null,'',location.pathname);
  }catch(e){console.warn(e)}
}

      const p=qq.p;
      sol=`<div class="step-item"><div class="st-h">${esc(qq.formula.l)}</div><div class="st-b">${esc(qq.y)} ∝ ${esc(qq.x)}<sup>${fmt(p)}</sup><br>ضریب = ${fmt(qq.k)}<sup>${fmt(p)}</sup> = <b>${fmt(qq.answer)}</b></div></div><p class="hint">توان ${fmt(p)} از ساختار خود فرمول می‌آید: ${p>0?'رابطه مستقیم است':'رابطه وارون است'}${Math.abs(p)===2||Math.abs(p)===0.5?' و '+(Math.abs(p)===2?'با مجذور':'با ریشهٔ دوم')+' کمیت متناسب است':''}.</p>`;
    }else sol=qq.steps.map((s,i)=>`<div class="step-item"><div class="st-h">${qq.steps.length>1?'گام '+(i+1)+': ':''}${esc(s.formula.l)} <span style="direction:ltr;display:inline-block">\\(${s.formula.tex}\\)</span></div>${work(s)}</div>`).join('');
    const next=!q.total||q.current+1<q.total;
    return`<div class="cd">${qHead(q)}
      <div class="quiz-feedback ${q.correct?'ok':'bad'}"><div class="big">${q.correct?'✅':'❌'}</div><div class="txt">${q.correct?'پاسخ صحیح':'پاسخ درست نیست'}</div>
      <div class="sub">پاسخ تو: ${esc(q.userAnswer)}${!q.correct?` — پاسخ صحیح: <b>${fmt(qq.answer)} ${qq.unit&&qq.unit!=='-'?esc(qq.unit):''}</b>`:''}</div></div>
      <div class="steps"><h4>مسیر حل</h4>${sol}</div>
      <button class="b pr w" data-a="nextQuiz" style="margin-top:14px">${next?'سؤال بعدی →':'پایان'}</button></div>`;
  }
  if(q.phase==='done'){
    const n=q.attempts,pct=n?Math.round(q.score/n*100):0;
    const cnt={};q.wrong.forEach(w=>cnt[w]=(cnt[w]||0)+1);
    const weak=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3);
    return`<div class="quiz-final"><div style="font-size:14px;color:var(--ink2)">نتیجهٔ تمرین</div><div class="big">${q.score}/${n}</div>
      <div class="lbl">${pct}٪ درست · بهترین پیاپی: ${q.best}</div>
      ${weak.length?`<p style="color:var(--ink2);font-size:13.5px">برای مرور بیشتر: ${weak.map(w=>esc(w[0])).join('، ')}</p>`:''}
      <div class="row" style="justify-content:center"><button class="b pr" data-a="startQuiz">تمرین تازه</button><button class="b" data-a="exitQuiz">تنظیمات</button></div></div>`;
  }
  return'';
}

/* ── نمودار ── */
function defVal(f,v){if(isC(f,v))return f.defaults[v];const[lo,hi]=getRange(f,v);return sig(lo>0&&hi/lo>100?Math.sqrt(lo*hi):(lo+hi)/2)}
function initGX(){
  const G=S.g,f=findF(G.fid),vars=Object.keys(f.vars);
  if(!G.y||!f.solve[G.y])G.y=vars.find(v=>f.solve[v]);
  if(!G.x||G.x===G.y||f.vars[G.x]===undefined)G.x=vars.find(v=>v!==G.y&&!isC(f,v))||vars.find(v=>v!==G.y);
  const[lo,hi]=getRange(f,G.x);G.xmin=String(lo);G.xmax=String(hi);G.lx=lo>0&&hi/lo>1000;G.ly=false;
}
function resetG(fid){S.g={fid,y:null,x:null,vals:{},xmin:'',xmax:'',lx:false,ly:false};initGX()}
function niceTicks(a,b){
  const span=b-a,raw=span/5,mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const st=[1,2,5,10].map(m=>m*mag).find(s=>span/s<=6)||raw,r=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)r.push(+v.toPrecision(12));
  return r;
}
function relText(f,y,v,K){
  const ev=m=>evalExpr(f.solve[y],{...K,[v]:K[v]*m});
  const a=ev(1),b=ev(2),c=ev(3),d=ev(.5);
  if([a,b,c,d].some(t=>t===null))return'نامشخص';
  if([a,b,c,d].every(t=>t!==0&&Math.sign(t)===Math.sign(a))){
    const p=Math.log(b/a)/Math.LN2;
    if(Math.abs(p-Math.log(c/a)/Math.log(3))<1e-6&&Math.abs(p-Math.log(a/d)/Math.LN2)<1e-6){
      const P=+p.toFixed(3),k=fmt(Math.pow(2,p));
      const nm=P===1?'مستقیم':P===-1?'وارون':P===2?'متناسب با مجذور':P===-2?'وارونِ مجذور':P===0.5?'متناسب با ریشهٔ دوم':`توانی (توان ${P})`;
      return`${nm} — اگر ${v} دو برابر شود، ${y} ×${k}`;
    }
  }
  if(Math.abs((b-a)-(c-b))<1e-9*Math.max(1,Math.abs(a)))return b>a?'خطی صعودی (با جمله‌ٔ ثابت) — ولی مستقیم نیست':'خطی نزولی (با جمله‌ٔ ثابت)';
  return'غیرخطی (ترکیبی)';
}
function graphSVG(f,G,K0,xmin,xmax){
  const W=640,H=380,L=66,R=16,T=16,B=50,N=160,pts=[];
  for(let i=0;i<=N;i++){
    const x=G.lx?xmin*Math.pow(xmax/xmin,i/N):xmin+(xmax-xmin)*i/N;
    const y=evalExpr(f.solve[G.y],{...K0,[G.x]:x});
    pts.push([x,y!==null&&(!G.ly||y>0)?y:null]);
  }
  const ok=pts.filter(p=>p[1]!==null);
  if(ok.length<2)return'<p class="hint">برای این مقادیر نمودار معتبری ساخته نشد. بازهٔ x یا مقدار کمیت‌های دیگر را تغییر بده.</p>';
  const tx=v=>G.lx?Math.log10(v):v,ty=v=>G.ly?Math.log10(v):v;
  const x0=tx(xmin),x1=tx(xmax);let y0=Math.min(...ok.map(p=>ty(p[1]))),y1=Math.max(...ok.map(p=>ty(p[1])));
  if(y0===y1){y0-=1;y1+=1}const pd=(y1-y0)*.06;y0-=pd;y1+=pd;
  const sx=v=>L+(tx(v)-x0)/(x1-x0)*(W-L-R),sy=v=>T+(1-(ty(v)-y0)/(y1-y0))*(H-T-B);
  const tk=(a,b,lg)=>{if(lg){const r=[];for(let e=Math.ceil(a);e<=Math.floor(b);e++)r.push(e);if(r.length>=2)return r.map(e=>[e,Math.pow(10,e)]);}return niceTicks(a,b).map(v=>[v,lg?Math.pow(10,v):v])};
  const xt=tk(x0,x1,G.lx),yt=tk(y0,y1,G.ly);
  let g='';
  xt.forEach(([p,v])=>{const X=L+(p-x0)/(x1-x0)*(W-L-R);g+=`<line x1="${X}" y1="${T}" x2="${X}" y2="${H-B}" stroke="var(--line)" stroke-width=".7"/><text x="${X}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmt(v)}</text>`});
  yt.forEach(([p,v])=>{const Y=T+(1-(p-y0)/(y1-y0))*(H-T-B);g+=`<line x1="${L}" y1="${Y}" x2="${W-R}" y2="${Y}" stroke="var(--line)" stroke-width=".7"/><text x="${L-6}" y="${Y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`});
  let d='',pen=false;pts.forEach(p=>{if(p[1]===null){pen=false;return}d+=(pen?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1);pen=true});
  G.draw={W,pts:ok,sx,sy};
  const ux=f.vars[G.x]!=='-'?` (${f.vars[G.x]})`:'',uy=f.vars[G.y]!=='-'?` (${f.vars[G.y]})`:'';
  return`<svg id="gsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="نمودار ${esc(G.y)} بر حسب ${esc(G.x)}" style="direction:ltr;touch-action:pan-y">
    ${g}<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="var(--line-strong)"/><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="var(--line-strong)"/>
    <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2.6" stroke-linejoin="round"/>
    <circle id="gdot" r="5" fill="var(--bg)" stroke="var(--gold)" stroke-width="2" style="display:none"/>
    <text x="${(L+W-R)/2}" y="${H-8}" text-anchor="middle" font-size="12.5" fill="var(--gold)" font-weight="700">${esc(G.x+ux)}${G.lx?' · لگاریتمی':''}</text>
    <text transform="rotate(-90 15 ${(T+H-B)/2})" x="15" y="${(T+H-B)/2}" text-anchor="middle" font-size="12.5" fill="var(--gold)" font-weight="700">${esc(G.y+uy)}${G.ly?' · لگاریتمی':''}</text></svg>
    <div id="gro" class="hint" style="direction:ltr;text-align:center;min-height:22px">برای دیدن مقدار دقیق، روی نمودار حرکت کن یا لمس کن.</div>`;
}
const fmtIn=n=>Number.isFinite(n)?String(+n.toPrecision(6)):'';
function renderGraph(){
  if(!S.g)resetG('newton2');
  const G=S.g,f=findF(G.fid),vars=Object.keys(f.vars);
  const K0=Object.assign({},f.defaults||{});
  vars.forEach(v=>{if(v===G.y||v===G.x)return;const u=num(G.vals[v]);K0[v]=Number.isFinite(u)?u:defVal(f,v)});
  const xmin=num(G.xmin),xmax=num(G.xmax);
  const xv=Number.isFinite(xmin)&&Number.isFinite(xmax)&&xmax>xmin?(G.lx&&xmin>0?Math.sqrt(xmin*xmax):(xmin+xmax)/2):defVal(f,G.x);
  const bad=!(xmax>xmin)||(G.lx&&!(xmin>0));
  const svg=bad?'<p class="hint">بازهٔ x معتبر نیست: حداکثر باید بزرگ‌تر از حداقل باشد (در مقیاس لگاریتمی، حداقل مثبت باشد).</p>':graphSVG(f,G,K0,xmin,xmax);
  const base={...K0,[G.x]:xv};
  const rels=vars.filter(v=>v!==G.y&&!isC(f,v)).map(v=>`<div class="rel-item"><b>${esc(vl(v))} ← ${esc(vl(G.y))}</b><div class="hint" style="margin:0">${esc(relText(f,G.y,v,{...base,[v]:v===G.x?xv:K0[v]}))}</div></div>`).join('');
  return`<div class="cd"><h2>نمودار رابطهٔ متغیرها</h2>
    <p class="hn">فرمول را انتخاب کن، دو متغیر را روی محورها بگذار؛ بقیه ثابت می‌مانند.</p>
    <div class="target-row"><select id="gf" style="flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-family:inherit;font-size:14px;font-weight:700">${KB.cats.map(c=>`<optgroup label="${c.label}">${KB.formulas.filter(x=>x.cat===c.id).map(x=>`<option value="${x.id}" ${x.id===G.fid?'selected':''}>${esc(x.l)}</option>`).join('')}</optgroup>`).join('')}</select></div>
    <div style="direction:ltr;text-align:center;color:var(--gold);font-size:17px">\\[${f.tex}\\]</div>
    <div class="target-row"><label style="font-size:13px;color:var(--gold);font-weight:700">محور y:</label><select id="gy" style="min-width:120px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-family:inherit;font-size:14px;font-weight:700">${vars.filter(v=>f.solve[v]).map(v=>`<option value="${v}" ${v===G.y?'selected':''}>${esc(vl(v))}</option>`).join('')}</select>
      <label style="font-size:13px;color:var(--gold);font-weight:700">محور x:</label><select id="gx" style="min-width:120px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-family:inherit;font-size:14px;font-weight:700">${vars.filter(v=>v!==G.y).map(v=>`<option value="${v}" ${v===G.x?'selected':''}>${esc(vl(v))}</option>`).join('')}</select></div>
    <div class="var-grid">
      <div class="vfield"><label>حداقل ${esc(G.x)}</label><input id="gmin" inputmode="decimal" value="${esc(G.xmin)}"></div>
      <div class="vfield"><label>حداکثر ${esc(G.x)}</label><input id="gmax" inputmode="decimal" value="${esc(G.xmax)}"></div>
      ${vars.filter(v=>v!==G.y&&v!==G.x).map(v=>`<div class="vfield"><label>${esc(vl(v))}${isC(f,v)?' (ثابت)':''}</label><input data-gv="${v}" inputmode="decimal" value="${esc(G.vals[v]!==undefined?G.vals[v]:fmtIn(K0[v]))}"><small>${f.vars[v]}</small></div>`).join('')}
    </div>
    <div class="row" style="margin-bottom:10px"><button class="mini-btn ${G.lx?'pr':''}" data-a="glx">مقیاس لگاریتمی x</button><button class="mini-btn ${G.ly?'pr':''}" data-a="gly">مقیاس لگاریتمی y</button></div>
    <div class="gwrap">${svg}</div></div>
    <div class="cd"><h2>ارتباط ${esc(G.y)} با هر کمیت</h2><p class="hn">بر پایهٔ همین مقادیر و به‌صورت عددی از خود فرمول به‌دست آمده است.</p>${rels||'<p class="hint">کمیت متغیر دیگری نیست.</p>'}</div>`;
}

/* ═══════════════ چرخهٔ رندر ═══════════════ */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===S.tab));
  const app = $('#app');
  if (S.tab==='calc') app.innerHTML = renderCalc();
  else if (S.tab==='chain') app.innerHTML = renderChain();
  else if (S.tab==='quiz') app.innerHTML = renderQuiz();
  else if (S.tab==='graph') app.innerHTML = renderGraph();
  else if (S.tab==='vars') app.innerHTML = renderVars();
  else app.innerHTML = renderHelp();
  typeset();
}

/* ═══════════════ ذخیره‌سازی ═══════════════ */
function getCurrentKnowns(){
  const knowns={};
  document.querySelectorAll('#app [data-var]').forEach(inp=>{const v=num(inp.value);if(Number.isFinite(v))knowns[inp.dataset.var]=v});
  return knowns;
}
function saveCurrentCalc(fid,target){
  const knowns=getCurrentKnowns(),res=solveOne(fid,target,knowns);
  if(!res.ok){toast('محاسبه معتبر نیست');return}
  const f=findF(fid);
  S.saved.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),fid,target,knowns,answer:res.val,unit:res.unit,label:f.l,savedAt:new Date().toISOString()});
  if(S.saved.length>50)S.saved.length=50;
  setSaved(S.saved);toast('ذخیره شد');render();
}

/* ═══════════════ تمرین: شروع/بررسی ═══════════════ */
function startQuiz(){
  const q=S.quiz;
  Object.assign(q,{questions:[],current:0,score:0,attempts:0,streak:0,best:0,wrong:[],userAnswer:'',correct:null,hint:false});
  const first=genQuestion();
  if(!first){toast('برای این ترکیب سؤالی ساخته نشد؛ دسته یا نوع دیگری را امتحان کن');return}
  q.questions.push(first);q.phase='asking';render();
}
function checkQuizAnswer(){
  const q=S.quiz,inp=document.getElementById('quizInput');
  if(inp)q.userAnswer=inp.value;
  const user=num(q.userAnswer);
  if(!Number.isFinite(user)){toast('یک عدد وارد کن');return}
  const qq=q.questions[q.current];
  q.correct=checkAnswer(user,qq.answer);q.attempts++;
  if(q.correct){q.score++;q.streak++;q.best=Math.max(q.best,q.streak)}
  else{q.streak=0;q.wrong.push(qq.type==='chain'?qq.steps.map(s=>s.formula.l).join(' + '):qq.formula.l)}
  q.phase='feedback';render();
}
function nextQuiz(){
  const q=S.quiz;
  if(q.total&&q.current+1>=q.total){q.phase='done';render();return}
  const nq=genQuestion();
  if(!nq){q.phase='done';toast('سؤال بیشتری ساخته نشد');render();return}
  q.questions.push(nq);q.current++;q.userAnswer='';q.correct=null;q.hint=false;q.phase='asking';render();
}

/* ═══════════════ رویدادها ═══════════════ */
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('[data-t]');
  if (b){ S.tab=b.dataset.t; render(); window.scrollTo(0,0); }
});

$('#app').addEventListener('click', async e=>{
  const g = s => e.target.closest(s);

  if (g('[data-dismiss-share]')){ S.shared=null; render(); return; }

  if (g('[data-cat]')){
    S.catId = g('[data-cat]').dataset.cat;
    const first = KB.formulas.find(f=>f.cat===S.catId);
    if (first) S.formulaId=first.id;
    S.target=null; render(); return;
  }
  if (g('[data-f]')){ S.formulaId=g('[data-f]').dataset.f; S.target=null; render(); return; }

  if (g('[data-a="calc"]')){
    const f = findF(S.formulaId);
    const sel = document.getElementById('targetSel');
    const target = sel ? sel.value : null;
    if (!target){ toast('متغیر هدف را انتخاب کن'); return; }
    const vals = getCurrentKnowns();
    if (!S.knowns[f.id]) S.knowns[f.id]={};
    Object.assign(S.knowns[f.id], vals);
    const res = solveOne(f.id, target, vals);
    const ra = document.getElementById('resultArea');
    if (ra) ra.innerHTML = renderResult(res, target, f.id);
    if (res.ok) S.target = target;
    typeset(); return;
  }

  if (g('[data-save]')){
    const target = S.target;
    if (!target){ toast('ابتدا محاسبه کن'); return; }
    saveCurrentCalc(S.formulaId, target); return;
  }
  if (g('[data-share-problem]')){
    const target = S.target;
    if (!target){ toast('ابتدا محاسبه کن'); return; }
    const knowns = getCurrentKnowns();
    const url = buildShareURL(S.formulaId, target, knowns, null);
    const ok = await copyText(url);
    toast(ok?'لینک مسئله کپی شد':'کپی نشد');
    return;
  }
  if (g('[data-share-solution]')){
    const target = S.target;
    if (!target){ toast('ابتدا محاسبه کن'); return; }
    const knowns = getCurrentKnowns();
    const res = solveOne(S.formulaId, target, knowns);
    if (!res.ok){ toast('محاسبه معتبر نیست'); return; }
    const url = buildShareURL(S.formulaId, target, knowns, res.val);
    const ok = await copyText(url);
    toast(ok?'لینک حل کپی شد':'کپی نشد');
    return;
  }

  if (g('[data-load-saved]')){
    const item = S.saved.find(x=>x.id===g('[data-load-saved]').dataset.loadSaved);
    if (!item) return;
    S.formulaId=item.fid; S.catId=findF(item.fid).cat;
    S.target=item.target; S.knowns[item.fid]={...item.knowns};
    render(); return;
  }
  if (g('[data-share-saved]')){
    const item = S.saved.find(x=>x.id===g('[data-share-saved]').dataset.shareSaved);
    if (!item) return;
    const url = buildShareURL(item.fid, item.target, item.knowns, null);
    const ok = await copyText(url);
    toast(ok?'لینک مسئله کپی شد':'کپی نشد'); return;
  }
  if (g('[data-del-saved]')){
    S.saved = S.saved.filter(x=>x.id!==g('[data-del-saved]').dataset.delSaved);
    setSaved(S.saved); render(); return;
  }
  if (g('[data-clear-saved]')){
    if (!confirm('همهٔ ذخیره‌ها پاک شوند؟')) return;
    S.saved=[]; setSaved(S.saved); render(); return;
  }

  if(g('[data-a="chain"]')){
    const qt=document.getElementById('qin');if(qt)S.qText=qt.value;
    const sel=document.getElementById('chainTarget');if(sel)S.chainTarget=sel.value;
    const p=parseKnowns(S.qText);if(p.target)S.chainTarget=p.target;
    render();return;
  }
  if(g('[data-a="chainDemo"]')){S.qText='v0=0 a=10 t=3 m=2';S.chainTarget='K';render();return}

  if(g('[data-vsel]')){S.varSel=g('[data-vsel]').dataset.vsel;render();return}
  if(g('[data-jump]')){
    const f=findF(g('[data-jump]').dataset.jump);
    if(f){S.catId=f.cat;S.formulaId=f.id;S.target=null;S.tab='calc';render();window.scrollTo(0,0)}
    return;
  }

  if(g('[data-a="shCheck"]')){
    const s=S.shared,r=solveOne(s.fid,s.target,s.knowns),u=num(document.getElementById('shAns').value),o=document.getElementById('shRes');
    if(!Number.isFinite(u)){toast('یک عدد وارد کن');return}
    o.innerHTML=r.ok&&checkAnswer(u,r.val)?'✅ پاسخ صحیح است':`❌ پاسخ درست نیست — پاسخ صحیح: <b>${fmt(r.val)} ${esc(r.unit||'')}</b>`;
    return;
  }

  if(g('[data-qcat]')){S.quiz.category=g('[data-qcat]').dataset.qcat;render();return}
  if(g('[data-qtype]')){S.quiz.type=g('[data-qtype]').dataset.qtype;render();return}
  if(g('[data-qdiff]')){S.quiz.difficulty=g('[data-qdiff]').dataset.qdiff;render();return}
  if(g('[data-qtotal]')){S.quiz.total=+g('[data-qtotal]').dataset.qtotal;render();return}
  if(g('[data-qshow]')){S.quiz.showF=!S.quiz.showF;render();return}
  if(g('[data-a="startQuiz"]')){startQuiz();return}
  if(g('[data-a="checkQuiz"]')){checkQuizAnswer();return}
  if(g('[data-a="nextQuiz"]')){nextQuiz();return}
  if(g('[data-a="hint"]')){const i=document.getElementById('quizInput');if(i)S.quiz.userAnswer=i.value;S.quiz.hint=!S.quiz.hint;render();return}
  if(g('[data-a="finishQuiz"]')){S.quiz.phase='done';render();return}
  if(g('[data-a="exitQuiz"]')){S.quiz.phase='idle';render();return}

  if(g('[data-a="glx"]')){S.g.lx=!S.g.lx;render();return}
  if(g('[data-a="gly"]')){S.g.ly=!S.g.ly;render();return}
});

$('#app').addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='qin')S.qText=t.value;
  if(t.id==='quizInput')S.quiz.userAnswer=t.value;
  if(S.g){if(t.dataset.gv)S.g.vals[t.dataset.gv]=t.value;if(t.id==='gmin')S.g.xmin=t.value;if(t.id==='gmax')S.g.xmax=t.value}
});
$('#app').addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='targetSel'){S.target=t.value;render()}
  if(t.id==='chainTarget'){S.chainTarget=t.value;render()}
  if(t.id==='gf'){resetG(t.value);render()}
  if(t.id==='gy'){S.g.y=t.value;S.g.x=null;S.g.vals={};initGX();render()}
  if(t.id==='gx'){S.g.x=t.value;initGX();render()}
  if(t.dataset.gv||t.id==='gmin'||t.id==='gmax')render();
});
$('#app').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='quizInput'){e.preventDefault();checkQuizAnswer()}
});
function gHover(e){
  const s=e.target.closest&&e.target.closest('#gsvg');if(!s||!S.g||!S.g.draw)return;
  const D=S.g.draw,r=s.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*D.W;
  let best=null,bd=1e9;D.pts.forEach(p=>{const d=Math.abs(D.sx(p[0])-px);if(d<bd){bd=d;best=p}});
  if(!best)return;
  const dot=document.getElementById('gdot');dot.setAttribute('cx',D.sx(best[0]));dot.setAttribute('cy',D.sy(best[1]));dot.style.display='';
  document.getElementById('gro').textContent=`${S.g.x} = ${fmt(best[0])}   ،   ${S.g.y} = ${fmt(best[1])}`;
}
$('#app').addEventListener('pointermove',gHover);
$('#app').addEventListener('pointerdown',gHover);

/* ═══════════════ شروع ═══════════════ */
checkShared();
render();
Kit.initTheme(); Kit.header('محاسبه‌گر فیزیک و شیمی');
</script>
</body>
</html>
