<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاسبه‌گر تخصصی فیزیک و شیمی | مستر پلنر</title>
<meta name="description" content="محاسبه‌گر پیشرفته فیزیک و شیمی: حل هر فرمول برای هر متغیر، حل زنجیره‌ای چندفرمولی، کاوشگر ارتباط متغیرها و نمودار شبکهٔ فرمول‌ها.">
<link rel="canonical" href="https://ehssnrouhani.github.io/Mestrplanner/calculator.html">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="mp-tools.css">
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
main{max-width:1000px}
.tabs{max-width:1000px}
.th{max-width:1000px}
.cat-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cat-bar button{background:var(--p);border:1.5px solid var(--bd);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--mu);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.cat-bar button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:18px}
.fcard{background:var(--p);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
.fcard:hover{border-color:var(--ac);transform:translateY(-1px)}
.fcard.on{border-color:var(--ac);background:rgba(232,151,31,.08)}
.fcard b{display:block;font-size:13.5px;color:#f8fafc;margin-bottom:6px}
.fcard small{font-size:11.5px;color:var(--mu)}
.fcard .tex-mini{font-size:13px;color:#fbbf24;margin-top:6px;direction:ltr;text-align:left}
.var-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.vfield label{display:block;font-size:12px;color:#fbbf24;margin-bottom:4px;font-weight:700}
.vfield input{width:100%;background:#0f172a;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;font-size:14px;color:var(--tx);font-family:inherit}
.vfield input:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
.vfield small{display:block;font-size:10.5px;color:var(--mu);margin-top:3px;direction:ltr;text-align:left}
.target-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.target-row select{flex:1;min-width:200px;background:#0f172a;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-family:inherit;color:var(--tx);font-size:14px;font-weight:700}
.result-box{background:linear-gradient(135deg,#0b1120,#1e293b);border:2px solid var(--ac);border-radius:16px;padding:20px;margin-top:14px;text-align:center}
.result-box .lbl{font-size:13px;color:#fbbf24;font-weight:700;margin-bottom:6px}
.result-box .val{font-size:30px;font-weight:800;color:#fff;direction:ltr;font-variant-numeric:tabular-nums}
.result-box .unit{font-size:15px;color:var(--mu);margin-right:8px}
.result-box .expr{font-size:12px;color:var(--mu);margin-top:8px;direction:ltr}
.result-box.err{border-color:#ef4444;background:rgba(239,68,68,.08)}
.result-box.err .val{font-size:15px;color:#f87171}
.steps{background:#0b1120;border:1px dashed var(--bd);border-radius:14px;padding:14px;margin-top:14px}
.steps h4{margin:0 0 10px;color:#fbbf24;font-size:13.5px}
.step-item{background:var(--p);border-radius:10px;padding:12px 14px;margin-bottom:8px;border-right:3px solid var(--ac)}
.step-item:last-child{margin-bottom:0}
.step-item .st-h{font-size:12.5px;color:#fbbf24;font-weight:700;margin-bottom:6px}
.step-item .st-b{font-size:14px;color:#e2e8f0;direction:ltr;text-align:left;font-family:'Courier New',monospace;line-height:1.8}
.step-item .st-b b{color:#6ee7b7;font-weight:800}
.qinput{width:100%;background:#0f172a;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-family:'Courier New',monospace;font-size:14px;color:var(--tx);direction:ltr;text-align:left}
.qinput::placeholder{color:#64748b;direction:rtl;text-align:right;font-family:'Vazirmatn',Tahoma,sans-serif}
.parsed{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.parsed span{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid #10b981;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;direction:ltr}
.parsed span.bad{background:rgba(239,68,68,.15);color:#f87171;border-color:#ef4444}
.hint{font-size:12.5px;color:var(--mu);margin:8px 0;line-height:1.8}
.hint code{background:#0b1120;padding:1px 6px;border-radius:4px;color:#fbbf24;font-family:'Courier New',monospace;direction:ltr;display:inline-block}
.var-explorer{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:16px;max-height:220px;overflow-y:auto;padding:8px;background:#0b1120;border-radius:12px;border:1px solid var(--bd)}
.var-explorer button{background:var(--p);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer;color:#cbd5e1;font-size:12.5px;font-weight:700;direction:ltr;text-align:center}
.var-explorer button:hover{border-color:var(--ac)}
.var-explorer button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.rel-item{background:var(--p);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.rel-item b{display:block;font-size:13px;color:#f8fafc;margin-bottom:4px}
.rel-item .rel-tex{font-size:12.5px;color:#fbbf24;direction:ltr;text-align:left;margin:4px 0}
.rel-item .rel-formula{font-size:12px;color:var(--mu);direction:ltr;text-align:left;background:#0b1120;padding:6px 10px;border-radius:6px;font-family:'Courier New',monospace;margin-top:4px}
.mini-btn{background:#0f172a;border:1px solid var(--bd);border-radius:8px;padding:5px 10px;cursor:pointer;color:#cbd5e1;font-size:11.5px;font-weight:700;margin-top:4px}
.mini-btn:hover{border-color:var(--ac);color:#fbbf24}
.help-section{background:var(--p);border-radius:14px;padding:18px;margin-bottom:14px;border-right:4px solid var(--ac)}
.help-section h3{font-size:15px;color:#fbbf24;margin:0 0 8px}
.help-section p,.help-section li{font-size:13.5px;color:#cbd5e1;line-height:1.9}
.help-section code{background:#0b1120;padding:2px 8px;border-radius:5px;color:#6ee7b7;font-family:'Courier New',monospace;direction:ltr;display:inline-block}
@media print{.top,.tabs,.noprint{display:none!important}main{padding:0;max-width:100%}}
</style>
</head>
<body>
<div class="top">
  <div class="th">
    <a href="index.html"><i class="fa-solid fa-arrow-right"></i> مستر پلنر</a>
    <h1>محاسبه‌گر تخصصی فیزیک و شیمی</h1>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="calc" class="on">محاسبه</button>
    <button data-t="chain">زنجیره</button>
    <button data-t="vars">شبکهٔ متغیر</button>
    <button data-t="help">راهنما</button>
  </div>
</div>
<main id="app"></main>
<div id="toast"></div>

<script>
/* ═══════════════ پایگاه دانش ═══════════════ */
const KB = {
  cats: [
    {id:'mechanics',label:'مکانیک',icon:'fa-person-running'},
    {id:'electricity',label:'الکتریسیته',icon:'fa-bolt'},
    {id:'magnetism',label:'مغناطیس',icon:'fa-magnet'},
    {id:'waves',label:'موج و نوسان',icon:'fa-wave-square'},
    {id:'thermo',label:'گرما و شاره',icon:'fa-temperature-half'},
    {id:'atomic',label:'فیزیک جدید',icon:'fa-atom'},
    {id:'chemistry',label:'شیمی',icon:'fa-flask'}
  ],
  constants: {
    g:{v:10,u:'m/s²',l:'گرانش'},
    k:{v:9e9,u:'N·m²/C²',l:'کولن'},
    NA:{v:6.022e23,u:'1/mol',l:'آووگادرو'},
    R:{v:8.314,u:'J/(mol·K)',l:'گازها'},
    h:{v:6.63e-34,u:'J·s',l:'پلانک'},
    c:{v:3e8,u:'m/s',l:'نور'},
    F:{v:96485,u:'C/mol',l:'فارادی'},
    I0:{v:1e-12,u:'W/m²',l:'شدت مرجع'}
  },
  formulas: [
    // ── مکانیک ──
    {id:'v_kin',cat:'mechanics',l:'سرعت نهایی (شتاب ثابت)',tex:'v = v_0 + at',
     vars:{v:'m/s',v0:'m/s',a:'m/s²',t:'s'},
     solve:{v:'v0+a*t',v0:'v-a*t',a:'(v-v0)/t',t:'(v-v0)/a'}},
    {id:'x_kin',cat:'mechanics',l:'جابجایی (شتاب ثابت)',tex:'x = v_0 t + \\tfrac{1}{2}at^2',
     vars:{x:'m',v0:'m/s',a:'m/s²',t:'s'},
     solve:{x:'v0*t+0.5*a*t*t',v0:'(x-0.5*a*t*t)/t',a:'2*(x-v0*t)/(t*t)',t:'(-v0+Math.sqrt(Math.max(0,v0*v0+2*a*x)))/a'}},
    {id:'v2_kin',cat:'mechanics',l:'رابطهٔ سرعت و جابجایی',tex:'v^2 = v_0^2 + 2a\\Delta x',
     vars:{v:'m/s',v0:'m/s',a:'m/s²',dx:'m'},
     solve:{v:'Math.sqrt(Math.max(0,v0*v0+2*a*dx))',v0:'Math.sqrt(Math.max(0,v*v-2*a*dx))',a:'(v*v-v0*v0)/(2*dx)',dx:'(v*v-v0*v0)/(2*a)'}},
    {id:'newton2',cat:'mechanics',l:'قانون دوم نیوتن',tex:'F = ma',
     vars:{F:'N',m:'kg',a:'m/s²'},
     solve:{F:'m*a',m:'F/a',a:'F/m'}},
    {id:'weight',cat:'mechanics',l:'وزن',tex:'W = mg',
     vars:{W:'N',m:'kg',g:'m/s²'},
     solve:{W:'m*g',m:'W/g',g:'W/m'}},
    {id:'friction',cat:'mechanics',l:'اصطکاک جنبشی',tex:'f_k = \\mu N',
     vars:{fk:'N',mu:'-',N:'N'},
     solve:{fk:'mu*N',mu:'fk/N',N:'fk/mu'}},
    {id:'circ_ac',cat:'mechanics',l:'شتاب مرکزگرا',tex:'a_c = \\frac{v^2}{r}',
     vars:{ac:'m/s²',v:'m/s',r:'m'},
     solve:{ac:'v*v/r',v:'Math.sqrt(ac*r)',r:'v*v/ac'}},
    {id:'work',cat:'mechanics',l:'کار نیرو',tex:'W = Fd\\cos\\theta',
     vars:{W:'J',F:'N',d:'m',cos:'-'},defaults:{cos:1},
     solve:{W:'F*d*cos',F:'W/(d*cos)',d:'W/(F*cos)',cos:'W/(F*d)'}},
    {id:'kinetic',cat:'mechanics',l:'انرژی جنبشی',tex:'K = \\tfrac{1}{2}mv^2',
     vars:{K:'J',m:'kg',v:'m/s'},
     solve:{K:'0.5*m*v*v',m:'2*K/(v*v)',v:'Math.sqrt(2*K/m)'}},
    {id:'potential',cat:'mechanics',l:'انرژی پتانسیل گرانشی',tex:'U = mgh',
     vars:{U:'J',m:'kg',g:'m/s²',h:'m'},
     solve:{U:'m*g*h',m:'U/(g*h)',g:'U/(m*h)',h:'U/(m*g)'}},
    {id:'power',cat:'mechanics',l:'توان مکانیکی',tex:'P_w = \\frac{W}{t}',
     vars:{Pw:'W',W:'J',t:'s'},
     solve:{Pw:'W/t',W:'Pw*t',t:'W/Pw'}},
    {id:'work_energy',cat:'mechanics',l:'قضیهٔ کار-انرژی',tex:'W_{net} = \\Delta K',
     vars:{Wnet:'J',dK:'J'},
     solve:{Wnet:'dK',dK:'Wnet'}},
    // ── الکتریسیته ──
    {id:'coulomb',cat:'electricity',l:'قانون کولن',tex:'F = k\\frac{|q_1 q_2|}{r^2}',
     vars:{F:'N',k:'N·m²/C²',q1:'C',q2:'C',r:'m'},defaults:{k:9e9},
     solve:{F:'k*q1*q2/(r*r)',k:'F*r*r/(q1*q2)',q1:'F*r*r/(k*q2)',q2:'F*r*r/(k*q1)',r:'Math.sqrt(Math.abs(k*q1*q2/F))'}},
    {id:'efield',cat:'electricity',l:'میدان ذرهٔ باردار',tex:'E = k\\frac{Q}{r^2}',
     vars:{E:'N/C',k:'N·m²/C²',Q:'C',r:'m'},defaults:{k:9e9},
     solve:{E:'k*Q/(r*r)',k:'E*r*r/Q',Q:'E*r*r/k',r:'Math.sqrt(Math.abs(k*Q/E))'}},
    {id:'vpoint',cat:'electricity',l:'پتانسیل ذرهٔ باردار',tex:'V_p = k\\frac{Q}{r}',
     vars:{Vp:'V',k:'N·m²/C²',Q:'C',r:'m'},defaults:{k:9e9},
     solve:{Vp:'k*Q/r',k:'Vp*r/Q',Q:'Vp*r/k',r:'k*Q/Vp'}},
    {id:'unifield',cat:'electricity',l:'میدان یکنواخت',tex:'V_p = Ed',
     vars:{Vp:'V',E:'V/m',d:'m'},
     solve:{Vp:'E*d',E:'Vp/d',d:'Vp/E'}},
    {id:'capacitor',cat:'electricity',l:'ظرفیت خازن',tex:'C = \\frac{Q}{V_p}',
     vars:{C:'F',Q:'C',Vp:'V'},
     solve:{C:'Q/Vp',Q:'C*Vp',Vp:'Q/C'}},
    {id:'cap_energy',cat:'electricity',l:'انرژی خازن',tex:'U_c = \\tfrac{1}{2}QV_p',
     vars:{Uc:'J',Q:'C',Vp:'V'},
     solve:{Uc:'0.5*Q*Vp',Q:'2*Uc/Vp',Vp:'2*Uc/Q'}},
    {id:'current_def',cat:'electricity',l:'تعریف جریان',tex:'I = \\frac{Q}{t}',
     vars:{I:'A',Q:'C',t:'s'},
     solve:{I:'Q/t',Q:'I*t',t:'Q/I'}},
    {id:'ohm',cat:'electricity',l:'قانون اهم',tex:'V_p = IR',
     vars:{Vp:'V',I:'A',R:'Ω'},
     solve:{Vp:'I*R',I:'Vp/R',R:'Vp/I'}},
    {id:'elec_power',cat:'electricity',l:'توان الکتریکی',tex:'P_e = V_p I',
     vars:{Pe:'W',Vp:'V',I:'A'},
     solve:{Pe:'Vp*I',Vp:'Pe/I',I:'Pe/Vp'}},
    {id:'r_wire',cat:'electricity',l:'مقاومت سیم',tex:'R = \\rho\\frac{L}{A}',
     vars:{R:'Ω',rho:'Ω·m',L:'m',A:'m²'},
     solve:{R:'rho*L/A',rho:'R*A/L',L:'R*A/rho',A:'rho*L/R'}},
    {id:'r_series',cat:'electricity',l:'مقاومت سری',tex:'R_s = R_1 + R_2',
     vars:{Rs:'Ω',R1:'Ω',R2:'Ω'},
     solve:{Rs:'R1+R2',R1:'Rs-R2',R2:'Rs-R1'}},
    // ── مغناطیس ──
    {id:'mag_charge',cat:'magnetism',l:'نیروی مغناطیسی بر بار',tex:'F = qvB\\sin\\theta',
     vars:{F:'N',q:'C',v:'m/s',B:'T',sin:'-'},defaults:{sin:1},
     solve:{F:'q*v*B*sin',q:'F/(v*B*sin)',v:'F/(q*B*sin)',B:'F/(q*v*sin)',sin:'F/(q*v*B)'}},
    {id:'mag_wire',cat:'magnetism',l:'نیروی مغناطیسی بر سیم',tex:'F = ILB\\sin\\theta',
     vars:{F:'N',I:'A',L:'m',B:'T',sin:'-'},defaults:{sin:1},
     solve:{F:'I*L*B*sin',I:'F/(L*B*sin)',L:'F/(I*B*sin)',B:'F/(I*L*sin)',sin:'F/(I*L*B)'}},
    {id:'mag_radius',cat:'magnetism',l:'شعاع مسیر دایره‌ای',tex:'r = \\frac{mv}{qB}',
     vars:{r:'m',m:'kg',v:'m/s',q:'C',B:'T'},
     solve:{r:'m*v/(q*B)',m:'r*q*B/v',v:'r*q*B/m',q:'m*v/(r*B)',B:'m*v/(r*q)'}},
    // ── موج ──
    {id:'wave_speed',cat:'waves',l:'سرعت موج',tex:'v = f\\lambda',
     vars:{v:'m/s',f:'Hz',lam:'m'},
     solve:{v:'f*lam',f:'v/lam',lam:'v/f'}},
    {id:'sound_int',cat:'waves',l:'شدت صوت',tex:'I = \\frac{P_s}{4\\pi r^2}',
     vars:{I:'W/m²',Ps:'W',r:'m'},
     solve:{I:'Ps/(4*Math.PI*r*r)',Ps:'I*4*Math.PI*r*r',r:'Math.sqrt(Ps/(4*Math.PI*I))'}},
    {id:'sound_level',cat:'waves',l:'تراز صوت',tex:'\\beta = 10\\log\\frac{I}{I_0}',
     vars:{beta:'dB',I:'W/m²',I0:'W/m²'},defaults:{I0:1e-12},
     solve:{beta:'10*Math.log10(I/I0)',I:'I0*Math.pow(10,beta/10)',I0:'I/Math.pow(10,beta/10)'}},
    {id:'spring_T',cat:'waves',l:'دورهٔ فنر',tex:'T_p = 2\\pi\\sqrt{m/k_s}',
     vars:{Tp:'s',m:'kg',ks:'N/m'},
     solve:{Tp:'2*Math.PI*Math.sqrt(m/ks)',m:'ks*Math.pow(Tp/(2*Math.PI),2)',ks:'m*Math.pow(2*Math.PI/Tp,2)'}},
    {id:'pendulum_T',cat:'waves',l:'دورهٔ آونگ',tex:'T_p = 2\\pi\\sqrt{L/g}',
     vars:{Tp:'s',L:'m',g:'m/s²'},defaults:{g:10},
     solve:{Tp:'2*Math.PI*Math.sqrt(L/g)',L:'g*Math.pow(Tp/(2*Math.PI),2)',g:'L*Math.pow(2*Math.PI/Tp,2)'}},
    // ── گرما ──
    {id:'pressure',cat:'thermo',l:'فشار',tex:'P = \\frac{F}{A}',
     vars:{P:'Pa',F:'N',A:'m²'},
     solve:{P:'F/A',F:'P*A',A:'F/P'}},
    {id:'fluid_pressure',cat:'thermo',l:'فشار شاره',tex:'P = P_0 + \\rho g h',
     vars:{P:'Pa',P0:'Pa',rho:'kg/m³',g:'m/s²',h:'m'},defaults:{g:10,P0:1e5},
     solve:{P:'P0+rho*g*h',P0:'P-rho*g*h',rho:'(P-P0)/(g*h)',g:'(P-P0)/(rho*h)',h:'(P-P0)/(rho*g)'}},
    {id:'buoyancy',cat:'thermo',l:'نیروی شناوری',tex:'F_b = \\rho g V',
     vars:{Fb:'N',rho:'kg/m³',g:'m/s²',V:'m³'},defaults:{g:10},
     solve:{Fb:'rho*g*V',rho:'Fb/(g*V)',g:'Fb/(rho*V)',V:'Fb/(rho*g)'}},
    {id:'heat',cat:'thermo',l:'گرمای ویژه',tex:'Q = m c \\Delta T',
     vars:{Q:'J',m:'kg',c:'J/(kg·K)',dT:'K'},
     solve:{Q:'m*c*dT',m:'Q/(c*dT)',c:'Q/(m*dT)',dT:'Q/(m*c)'}},
    {id:'ideal_gas',cat:'thermo',l:'گاز آرمانی',tex:'PV = nRT',
     vars:{P:'Pa',V:'m³',n:'mol',R:'J/(mol·K)',T:'K'},defaults:{R:8.314},
     solve:{P:'n*R*T/V',V:'n*R*T/P',n:'P*V/(R*T)',R:'P*V/(n*T)',T:'P*V/(n*R)'}},
    // ── فیزیک جدید ──
    {id:'bohr_E',cat:'atomic',l:'انرژی تراز بور',tex:'E_n = -\\frac{13.6}{n^2}',
     vars:{En:'eV',n:'-'},
     solve:{En:'-13.6/(n*n)',n:'Math.sqrt(-13.6/En)'}},
    {id:'photon',cat:'atomic',l:'انرژی فوتون',tex:'E = \\frac{hc}{\\lambda}',
     vars:{E:'J',h:'J·s',c:'m/s',lam:'m'},defaults:{h:6.63e-34,c:3e8},
     solve:{E:'h*c/lam',h:'E*lam/c',c:'E*lam/h',lam:'h*c/E'}},
    {id:'photoelec',cat:'atomic',l:'فوتوالکتریک',tex:'K_{max} = hf - W_0',
     vars:{Kmax:'J',h:'J·s',f:'Hz',W0:'J'},defaults:{h:6.63e-34},
     solve:{Kmax:'h*f-W0',h:'(Kmax+W0)/f',f:'(Kmax+W0)/h',W0:'h*f-Kmax'}},
    // ── شیمی ──
    {id:'mole',cat:'chemistry',l:'تعداد مول',tex:'n = \\frac{m}{M}',
     vars:{n:'mol',m:'g',M:'g/mol'},
     solve:{n:'m/M',m:'n*M',M:'m/n'}},
    {id:'particles',cat:'chemistry',l:'تعداد ذره',tex:'N_p = n N_A',
     vars:{Np:'-',n:'mol',NA:'1/mol'},defaults:{NA:6.022e23},
     solve:{Np:'n*NA',n:'Np/NA',NA:'Np/n'}},
    {id:'molarity',cat:'chemistry',l:'غلظت مولار',tex:'c = \\frac{n}{V}',
     vars:{c:'mol/L',n:'mol',V:'L'},
     solve:{c:'n/V',n:'c*V',V:'n/c'}},
    {id:'ph',cat:'chemistry',l:'pH',tex:'pH = -\\log[H^+]',
     vars:{pH:'-',H:'mol/L'},

/* ═══════════════ ابزارها ═══════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa = n => {
  if (n===undefined||n===null) return '—';
  const abs = Math.abs(n);
  if (abs!==0 && (abs<0.001 || abs>=1e6)) return n.toExponential(3).replace(/\.?0+e/,'e').replace('e+','×10^');
  return Number(n).toLocaleString('fa-IR',{maximumFractionDigits:4});
};
const fmt = n => {
  if (!Number.isFinite(n)) return '—';
  const abs = Math.abs(n);
  if (abs!==0 && (abs<0.001 || abs>=1e6)) return n.toExponential(3);
  return Number(n.toLocaleString('fa-IR',{maximumFractionDigits:4}));
};
function toast(t){const e=$('#toast');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}

function findF(id){return KB.formulas.find(f=>f.id===id)}

function evalExpr(expr, knowns){
  const keys = Object.keys(knowns).filter(k=>/^[A-Za-z_][A-Za-z0-9_]*$/.test(k));
  const vals = keys.map(k=>knowns[k]);
  try{
    const fn = new Function(...keys, `"use strict"; return (${expr});`);
    const r = fn(...vals);
    return Number.isFinite(r)?r:null;
  }catch(e){return null}
}

function typeset(){
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().catch(()=>{});
}

/* ═══════════════ حالت ═══════════════ */
let S = {
  tab:'calc',
  catId:'mechanics',
  formulaId:'v_kin',
  target:null,
  knowns:{},
  qText:'',
  varSel:null
};

/* ═══════════════ حل یک فرمول ═══════════════ */
function solveOne(fid, target, userKnowns){
  const f = findF(fid); if(!f) return {err:'فرمول پیدا نشد'};
  if (!f.solve[target]) return {err:'این فرمول برای این متغیر حل نشده است'};
  const K = Object.assign({}, f.defaults||{}, userKnowns);
  const needed = Object.keys(f.vars).filter(v=>v!==target);
  for (const v of needed){
    if (K[v]===undefined || K[v]===null || K[v]==='' || !Number.isFinite(+K[v])){
      return {err:`مقدار «${v}» را وارد کن`};
    }
    K[v] = +K[v];
  }
  const val = evalExpr(f.solve[target], K);
  if (val===null) return {err:'محاسبه ناموفق (تقسیم بر صفر یا دامنهٔ نامعتبر)'};
  return {ok:true, val, unit:f.vars[target], expr:f.solve[target], formula:f, K};
}

/* ═══════════════ حل زنجیره‌ای ═══════════════ */
function chainSolve(userKnowns, target, maxIter=25){
  let K = {};
  for (const k in userKnowns){ if (Number.isFinite(+userKnowns[k])) K[k] = +userKnowns[k]; }
  const steps = [];
  const used = new Set();
  for (let it=0; it<maxIter; it++){
    if (K[target]!==undefined) break;
    let progress = false;
    for (const f of KB.formulas){
      const all = Object.keys(f.vars);
      const unknown = all.filter(v=>K[v]===undefined);
      if (unknown.length!==1) continue;
      const t = unknown[0];
      if (!f.solve[t]) continue;
      const sig = f.id+':'+t;
      if (used.has(sig)) continue;
      const localK = Object.assign({}, f.defaults||{}, K);
      const val = evalExpr(f.solve[t], localK);
      if (val===null) continue;
      K[t] = val;
      used.add(sig);
      steps.push({formula:f, target:t, val, unit:f.vars[t]});
      progress = true;
      if (t===target) return {ok:true, val, steps, knowns:K};
    }
    if (!progress) break;
  }
  return {ok:false, error:K[target]!==undefined?'':'به هدف نرسیدیم — داده‌های بیشتری لازم است', steps, knowns:K};
}

/* ═══════════════ ورودی سریع ═══════════════ */
function parseKnowns(text){
  const knowns = {}, bad = [];
  const re = /([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(-?\d*\.?\d+(?:[eE][-+]?\d+)?)/g;
  let m, matched = '';
  while ((m=re.exec(text))!==null){
    knowns[m[1]] = parseFloat(m[2]);
    matched += m[0];
  }
  // تشخیص عبارت‌های نامفهوم
  const cleaned = text.replace(re,'').replace(/[\s,;]/g,'');
  if (cleaned) bad.push(cleaned);
  return {knowns, bad};
}

/* ═══════════════ رندر ═══════════════ */
function renderCats(){
  return `<div class="cat-bar">${KB.cats.map(c=>`<button class="${S.catId===c.id?'on':''}" data-cat="${c.id}"><i class="fa-solid ${c.icon}"></i> ${c.label}</button>`).join('')}</div>`;
}
function renderFormulaList(){
  const list = KB.formulas.filter(f=>f.cat===S.catId);
  return `<div class="flist">${list.map(f=>`
    <div class="fcard ${S.formulaId===f.id?'on':''}" data-f="${f.id}">
      <b>${f.l}</b>
      <div class="tex-mini">\\(${f.tex}\\)</div>
      <small>${Object.keys(f.vars).length} متغیر</small>
    </div>`).join('')}</div>`;
}
function renderFormulaCard(){
  const f = findF(S.formulaId);
  if (!f) return '<div class="cd"><p class="hn">فرمول را انتخاب کن.</p></div>';
  const vars = Object.keys(f.vars);
  const target = S.target && f.vars[S.target]!==undefined ? S.target : vars[0];
  const inputs = vars.filter(v=>v!==target);
  return `<div class="cd">
    <h2>${esc(f.l)}</h2>
    <p class="hn" style="direction:ltr;text-align:center;font-size:17px;color:#fbbf24;margin:10px 0">\\[${f.tex}\\]</p>
    <div class="target-row">
      <label style="font-size:13px;color:#fbbf24;font-weight:700;white-space:nowrap">می‌خواهم حساب کنم:</label>
      <select id="targetSel">${vars.map(v=>`<option value="${v}" ${v===target?'selected':''}>${v} (${f.vars[v]})</option>`).join('')}</select>
    </div>
    <div class="var-grid">
      ${inputs.map(v=>{
        const c = (S.knowns[f.id] && S.knowns[f.id][v]!==undefined) ? S.knowns[f.id][v] : '';
        return `<div class="vfield"><label>${v}</label><input type="number" step="any" data-var="${v}" value="${esc(c)}" placeholder="0"><small>${f.vars[v]}</small></div>`;
      }).join('')}
    </div>
    <button class="b pr w" data-a="calc"><i class="fa-solid fa-calculator"></i> محاسبه</button>
    <div id="resultArea"></div>
  </div>`;
}

function renderResult(res, target){
  if (!res) return '';
  if (res.err) return `<div class="result-box err"><div class="lbl">خطا</div><div class="val">${esc(res.err)}</div></div>`;
  return `<div class="result-box">
    <div class="lbl">${target} =</div>
    <div class="val">${fmt(res.val)}<span class="unit">${res.unit||''}</span></div>
    <div class="expr">${esc(res.expr)}</div>
  </div>`;
}

function renderChain(){
  const parsed = parseKnowns(S.qText||'');
  const chipList = Object.entries(parsed.knowns).map(([k,v])=>`<span>${esc(k)} = ${v}</span>`).join('');
  const badList = parsed.bad.map(b=>`<span class="bad">${esc(b)}</span>`).join('');
  const allVars = [...new Set(KB.formulas.flatMap(f=>Object.keys(f.vars)))].sort();
  return `<div class="cd">
    <h2>حل‌کنندهٔ زنجیره‌ای</h2>
    <p class="hn">چیزهایی که می‌دانی را بنویس. سیستم خودش مسیر فرمول‌ها را پیدا می‌کند.</p>
    <input class="qinput" id="qin" placeholder="مثال: v0=0 a=10 t=3 m=2" value="${esc(S.qText||'')}">
    <div class="parsed">${chipList}${badList}</div>
    <div class="target-row" style="margin-top:12px">
      <label style="font-size:13px;color:#fbbf24;font-weight:700;white-space:nowrap">هدف:</label>
      <select id="chainTarget">
        <option value="">— انتخاب کن —</option>
        ${allVars.map(v=>`<option value="${v}" ${S.chainTarget===v?'selected':''}>${v}</option>`).join('')}
      </select>
      <button class="b pr" data-a="chain" style="white-space:nowrap"><i class="fa-solid fa-diagram-project"></i> حل کن</button>
    </div>
    <p class="hint">می‌توانی هدف را هم داخل کادر بنویسی: <code>v0=0 a=10 t=3 → K</code>. سیستم هدف را از فلش می‌خواند.</p>
    <div id="chainResult"></div>
  </div>`;
}

function renderChainResult(){
  const target = S.chainTarget;
  if (!target) return '';
  const parsed = parseKnowns(S.qText||'');
  if (parsed.knowns[target]!==undefined){
    return `<div class="result-box"><div class="lbl">${target} از قبل معلوم است</div><div class="val">${fmt(parsed.knowns[target])}</div></div>`;
  }
  const res = chainSolve(parsed.knowns, target);
  if (res.ok){
    const stepsHtml = res.steps.map((st,i)=>`
      <div class="step-item">
        <div class="st-h">گام ${i+1}: ${esc(st.formula.l)}</div>
        <div class="st-b">${esc(st.target)} = <b>${fmt(st.val)}</b> ${st.unit?`<span style="color:#94a3b8">${st.unit}</span>`:''}</div>
      </div>`).join('');
    return `<div class="result-box">
      <div class="lbl">نتیجه</div>
      <div class="val">${target} = ${fmt(res.val)}</div>
    </div>
    <div class="steps">
      <h4>مسیر حل (${res.steps.length} گام)</h4>
      ${stepsHtml}
    </div>`;
  }
  // اگر هدف نرسید، بگو چه چیزهایی می‌شود حساب کرد
  const reachable = Object.keys(res.knowns).filter(k=>!parsed.knowns[k]);
  const reachHtml = reachable.length 
    ? `<p class="hint">با این داده‌ها این‌ها قابل محاسبه‌اند: ${reachable.map(v=>`<code>${v}</code>`).join(' ')}</p>` 
    : `<p class="hint">با این داده‌ها نمی‌شود چیز بیشتری حساب کرد. داده‌های بیشتری وارد کن.</p>`;
  return `<div class="result-box err"><div class="lbl">نرسیدیم</div><div class="val">${esc(res.error)}</div></div>${reachHtml}`;
}

function renderVars(){
  const varMap = {};
  KB.formulas.forEach(f=>{
    Object.keys(f.vars).forEach(v=>{
      if (!varMap[v]) varMap[v] = [];
      varMap[v].push(f);
    });
  });
  const vars = Object.keys(varMap).sort();
  const sel = S.varSel;
  let detail = '';
  if (sel && varMap[sel]){
    detail = `<h2 style="margin-top:18px">فرمول‌هایی که «${esc(sel)}» دارند</h2>
      ${varMap[sel].map(f=>`
        <div class="rel-item">
          <b>${esc(f.l)}</b>
          <div class="rel-tex">\\(${f.tex}\\)</div>
          <div class="rel-formula">${esc(f.solve[sel]||'—')}</div>
          <button class="mini-btn" data-jump="${f.id}">باز کردن در محاسبه‌گر</button>
        </div>`).join('')}`;
  }
  return `<div class="cd">
    <h2>کاوشگر متغیر</h2>
    <p class="hn">یک متغیر را انتخاب کن تا ببینی در کدام فرمول‌ها استفاده می‌شود و چطور حل می‌شود.</p>
    <div class="var-explorer">
      ${vars.map(v=>`<button class="${sel===v?'on':''}" data-vsel="${v}">${esc(v)}</button>`).join('')}
    </div>
    ${detail}
  </div>`;
}

function renderHelp(){
  return `<div class="help-section">
    <h3>این ابزار چیست؟</h3>
    <p>یک محاسبه‌گر تخصصی فیزیک و شیمی که بر پایهٔ <b>شبکهٔ ارتباط فرمول‌ها</b> کار می‌کند. سه حالت دارد:</p>
    <ul>
      <li><b>محاسبه:</b> یک فرمول انتخاب کن، متغیر هدف را مشخص کن، بقیه را وارد کن.</li>
      <li><b>زنجیره:</b> فقط داده‌هایی که داری را بنویس و هدف را انتخاب کن؛ سیستم خودش مسیر فرمول‌ها را پیدا می‌کند.</li>
      <li><b>شبکهٔ متغیر:</b> ببین هر متغیر در چه فرمول‌هایی استفاده می‌شود.</li>
    </ul>
  </div>
  <div class="help-section">
    <h3>نحو ورودی زنجیره</h3>
    <p>داده‌ها را با <code>=</code> بنویس و با فاصله یا کاما جدا کن:</p>
    <p><code>v0=0 a=10 t=3 m=2</code></p>
    <p>هدف را در کادر «هدف» انتخاب کن یا بعد از یک فلش بنویس:</p>
    <p><code>v0=0 a=10 t=3 → K</code></p>
    <p>پشتیبانی از نماد علمی: <code>h=6.63e-34</code> یا <code>NA=6.022e23</code>.</p>
  </div>
  <div class="help-section">
    <h3>ثابت‌های آماده</h3>
    <p>این ثابت‌ها در محاسبات به‌صورت خودکار پر می‌شوند (اگر خودت مقدار دیگری ندهی):</p>
    <ul>${Object.entries(KB.constants).map(([k,c])=>`<li><code>${k}</code> = ${c.v} ${c.u} — ${c.l}</li>`).join('')}</ul>
  </div>
  <div class="help-section">
    <h3>واحدها</h3>
    <p>همهٔ محاسبات در واحدهای SI انجام می‌شوند. برای هر متغیر، واحد در کنار فیلد نمایش داده می‌شود. در زنجیره، فرض بر یکسانی واحدهاست — اگر واحدها متفاوت‌اند، بهتر است فقط از «محاسبه» استفاده کنی.</p>
  </div>
  <div class="help-section" style="border-right-color:#ef4444">
    <h3>محدودیت‌ها</h3>
    <ul>
      <li>در زنجیره، اگر یک متغیر در دو زمینهٔ معنایی متفاوت باشد (مثلاً P برای فشار و توان)، ممکن است مسیر اشتباه انتخاب شود. راه‌حل: همهٔ متغیرهای مسئله را صریح وارد کن.</li>
      <li>فرمول‌هایی که جواب چندگانه دارند (مثل معادلهٔ درجه دوم)، فقط ریشهٔ اصلی را برمی‌گردانند.</li>
      <li>این ابزار جای معلم و حل مسئلهٔ مفهومی را نمی‌گیرد؛ برای <b>بازبینی و تسریع</b> است.</li>
    </ul>
  </div>`;
}

/* ═══════════════ چرخهٔ رندر ═══════════════ */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===S.tab));
  const app = $('#app');
  if (S.tab==='calc'){
    app.innerHTML = renderCats() + renderFormulaList() + renderFormulaCard();
  } else if (S.tab==='chain'){
    app.innerHTML = renderChain() + renderChainResult();
  } else if (S.tab==='vars'){
    app.innerHTML = renderVars();
  } else {
    app.innerHTML = renderHelp();
  }
  typeset();
}

/* ═══════════════ رویدادها ═══════════════ */
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('[data-t]');
  if (b){ S.tab = b.dataset.t; render(); window.scrollTo(0,0); }
});

$('#app').addEventListener('click', e=>{
  const g = s => e.target.closest(s);

  // انتخاب دسته
  if (g('[data-cat]')){
    S.catId = g('[data-cat]').dataset.cat;
    const first = KB.formulas.find(f=>f.cat===S.catId);
    if (first) S.formulaId = first.id;
    S.target = null;
    render(); return;
  }
  // انتخاب فرمول
  if (g('[data-f]')){
    S.formulaId = g('[data-f]').dataset.f;
    S.target = null;
    render(); return;
  }
  // محاسبهٔ یک فرمول
  if (g('[data-a="calc"]')){
    const f = findF(S.formulaId);
    const sel = document.getElementById('targetSel');
    const target = sel ? sel.value : null;
    if (!target){ toast('متغیر هدف را انتخاب کن'); return; }
    // جمع‌آوری مقادیر
    const vals = {};
    document.querySelectorAll('#app [data-var]').forEach(inp=>{
      if (inp.value.trim()!=='') vals[inp.dataset.var] = +inp.value;
    });
    // ذخیره
    if (!S.knowns[f.id]) S.knowns[f.id] = {};
    Object.assign(S.knowns[f.id], vals);
    const res = solveOne(f.id, target, vals);
    const ra = document.getElementById('resultArea');
    if (ra) ra.innerHTML = renderResult(res, target);
    typeset(); return;
  }
  // حل زنجیره
  if (g('[data-a="chain"]')){
    const qt = document.getElementById('qin');
    if (qt) S.qText = qt.value;
    // هدف از طریق فلش در متن
    const fm = S.qText.match(/[→\-]>?\s*([A-Za-z_][A-Za-z0-9_]*)\s*$/);
    const sel = document.getElementById('chainTarget');
    if (fm && (!sel || !sel.value)) S.chainTarget = fm[1];
    else if (sel) S.chainTarget = sel.value;
    const cr = document.getElementById('chainResult');
    if (cr) cr.innerHTML = renderChainResult();
    typeset(); return;
  }
  // پرش از کاوشگر به محاسبه
  if (g('[data-jump]')){
    const f = findF(g('[data-jump]').dataset.jump);
    if (f){ S.catId = f.cat; S.formulaId = f.id; S.target = null; S.tab='calc'; render(); window.scrollTo(0,0); }
    return;
  }
  // انتخاب متغیر
  if (g('[data-vsel]')){
    S.varSel = g('[data-vsel]').dataset.vsel;
    render(); return;
  }
});

$('#app').addEventListener('input', e=>{
  if (e.target.id==='qin'){ S.qText = e.target.value; }
});

$('#app').addEventListener('change', e=>{
  if (e.target.id==='targetSel'){
    S.target = e.target.value;
    render(); return;
  }
  if (e.target.id==='chainTarget'){
    S.chainTarget = e.target.value; return;
  }
});

// وقتی target عوض شد، فیلدها بازسازی می‌شوند ولی متغیرهای واردشده حفظ می‌شوند
// (این کار با render دوباره انجام می‌شود)

/* شروع */
render();
