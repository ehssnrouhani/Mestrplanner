<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مفهوم‌ساز | نقشهٔ مفهومی با ابزارهای تفکر | مستر پلنر</title>
<meta name="description" content="مفهوم‌ساز مستر پلنر: ساخت نقشهٔ مفهومی با ابزارهای تفکر مقایسه، بسط، ترکیب، تجزیه و تحلیل، تضادیابی و رابطهٔ مستقیم و معکوس." />
<link rel="canonical" href="https://ehssnrouhani.github.io/Mestrplanner/concept-maker.html" />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
*{box-sizing:border-box}
:root{--bg:#0f172a;--p:#1e293b;--bd:#334155;--tx:#f8fafc;--mu:#94a3b8;--ac:#e8971f}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;overflow:hidden}
button,input,textarea,select{font-family:inherit;font-size:14px;color:var(--tx)}
.top{height:56px;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--p);border-bottom:1px solid var(--bd)}
.top h1{font-size:16px;margin:0;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top a{color:var(--ac);text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap}
.ib{width:38px;height:38px;border:1px solid var(--bd);background:#0f172a;border-radius:10px;cursor:pointer}
.ib:hover,.ib.on{border-color:var(--ac);color:var(--ac)}
.ib:disabled{opacity:.35;cursor:default}
#app{display:grid;grid-template-columns:350px 1fr;height:calc(100dvh - 56px)}
#cvw{position:relative;overflow:hidden;background:radial-gradient(#334155 1px,transparent 1px) 0 0/26px 26px}
#cv{width:100%;height:100%;touch-action:none;display:block;direction:ltr}
#cv.arm{cursor:crosshair}
.panel{background:var(--p);border-left:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0}
.tabs button{flex:1;padding:12px 4px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font-weight:700;cursor:pointer}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
#pc{padding:14px;overflow:auto;flex:1}
.hn{font-size:13px;color:var(--mu);line-height:1.9;margin:0 0 12px}
.tool{display:grid;grid-template-columns:34px 1fr;column-gap:10px;width:100%;text-align:right;background:#0f172a;border:1.5px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.tool i{grid-row:span 2;align-self:center;font-size:20px;color:var(--ac);text-align:center}
.tool b{font-size:14px}.tool span{font-size:12px;color:var(--mu);line-height:1.6}
.tool:hover{border-color:var(--ac)}.tool.off{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{border:1.5px solid var(--c);color:var(--c);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.chip.on,.chip:hover{background:var(--c);color:#0f172a}
.chip.z{opacity:.4}
h4{margin:14px 0 6px;font-size:13.5px;color:#fbbf24}
.f{width:100%;background:#0f172a;border:1px solid var(--bd);border-radius:8px;padding:9px 10px;margin-bottom:8px}
.sw{display:flex;gap:8px;margin-bottom:12px}
.sw i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw i.on{border-color:#fff}
.b{background:#0f172a;border:1px solid var(--bd);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700;margin:0 0 8px}
.b:hover{border-color:var(--ac)}.b.pr{background:var(--ac);border-color:var(--ac);color:#fff}.b.dg{color:#f87171}
.b.w{width:100%;text-align:right}
.bar{height:8px;background:#0f172a;border-radius:4px;overflow:hidden;margin:3px 0 10px}.bar i{display:block;height:100%}
.sg{background:rgba(232,151,31,.1);border-right:4px solid var(--ac);border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:13px;line-height:1.8;color:#e2e8f0}
.stat{display:flex;gap:8px;margin-bottom:12px}.stat div{flex:1;background:#0f172a;border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--mu)}.stat b{display:block;font-size:20px;color:var(--tx)}
#md{position:fixed;inset:0;background:rgba(2,6,23,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
#md[hidden]{display:none}
.mc{background:var(--p);border:1px solid var(--bd);border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:90dvh;overflow:auto}
.mc h3{margin:0 0 6px}.mc p{margin:0 0 12px;font-size:13px;color:var(--mu)}
.mc label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}
.mc label>*{display:block;width:100%;margin-top:5px;background:#0f172a;border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
.ac{display:flex;gap:8px}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
#start .mc{pointer-events:auto;text-align:center}
#toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:#0b1120;border:1px solid var(--ac);border-radius:999px;padding:9px 18px;font-size:13px;z-index:60;max-width:92vw;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#pt{display:none}
@media(max-width:820px){
 #app{grid-template-columns:1fr}
 .panel{position:fixed;bottom:0;left:0;right:0;height:46dvh;border-top:1px solid var(--bd);border-left:0;z-index:20;transition:transform .25s}
 .panel.min{transform:translateY(calc(100% - 46px))}
 #pt{display:inline-block}
 .top h1{font-size:14px}
}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a href="index.html"><i class="fa-solid fa-arrow-right"></i> مستر پلنر</a>
  <h1>مفهوم‌ساز</h1>
  <button class="ib" id="bAdd" title="مفهوم جدید"><i class="fa-solid fa-plus"></i></button>
  <button class="ib" id="bMulti" title="چندانتخابی (برای لمس)"><i class="fa-solid fa-object-group"></i></button>
  <button class="ib" id="bUndo" title="بازگشت (Ctrl+Z)"><i class="fa-solid fa-rotate-left"></i></button>
  <button class="ib" id="bRedo" title="جلو (Ctrl+Y)"><i class="fa-solid fa-rotate-right"></i></button>
  <button class="ib" id="bLay" title="چیدمان خودکار"><i class="fa-solid fa-diagram-project"></i></button>
  <button class="ib" id="bFit" title="نمایش همه"><i class="fa-solid fa-expand"></i></button>
  <button class="ib" id="pt" title="پنل"><i class="fa-solid fa-sliders"></i></button>
</header>

<div id="app">
  <aside class="panel" id="panel">
    <div class="tabs">
      <button data-tab="tools">ابزارها</button>
      <button data-tab="sel">انتخاب</button>
      <button data-tab="an">تحلیل</button>
      <button data-tab="file">فایل</button>
    </div>
    <div id="pc"></div>
  </aside>
  <div id="cvw">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="start" hidden>
      <form class="mc" id="sf">
        <h3>نقشهٔ مفهومی‌ات را شروع کن</h3>
        <p>مفهوم مرکزی چیست؟ بعد با ابزارهای تفکر آن را گسترش بده.</p>
        <label>مفهوم مرکزی<input id="sc" placeholder="مثلاً: یادگیری عمیق" required></label>
        <div class="ac"><button class="b pr">ساخت نقشه</button><button type="button" class="b" id="sd">نقشهٔ نمونه</button></div>
      </form>
    </div>
  </div>
</div>
<div id="md" hidden></div>
<div id="toast"></div>
<input type="file" id="fi" accept=".json" hidden />

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K={
 direct:{n:'رابطه مستقیم',c:'#10b981',s:'+'},
 inverse:{n:'رابطه معکوس',c:'#ef4444',s:'−',d:'7 5'},
 cause:{n:'علت ← معلول',c:'#f59e0b',a:1},
 contrast:{n:'تضاد',c:'#ec4899',d:'3 5'},
 similar:{n:'شباهت',c:'#38bdf8'},
 part:{n:'جزئی از',c:'#a78bfa',a:1},
 type:{n:'نوعی از',c:'#6366f1',a:1},
 example:{n:'مثال برای',c:'#14b8a6',a:1},
 combine:{n:'ترکیب',c:'#fb923c',a:1},
 link:{n:'ارتباط',c:'#94a3b8'}
};
const PAL=['#3b82f6','#10b981','#e8971f','#8b5cf6','#ec4899','#14b8a6','#94a3b8'];
let S={nodes:[],edges:[],v:{x:0,y:0,k:1}},sel=new Set(),selE=null,tab='tools',multi=false,arm=null,hist=[],fut=[],uid=1;
const cv=$('#cv'),nd=id=>S.nodes.find(n=>n.id==id);

/* ---------- ذخیره و بازگشت ---------- */
const cur=()=>JSON.stringify({nodes:S.nodes,edges:S.edges,uid});
function snap(){hist.push(cur());if(hist.length>60)hist.shift();fut=[]}
function load(j){const o=JSON.parse(j);S.nodes=o.nodes;S.edges=o.edges;uid=o.uid||S.nodes.length+S.edges.length+9;sel.clear();selE=null;arm=null;all()}
function save(){try{localStorage.setItem('mp_concept_v1',JSON.stringify({...S,uid}))}catch(e){}}
function undo(){if(hist.length){fut.push(cur());load(hist.pop());save()}}
function redo(){if(fut.length){hist.push(cur());load(fut.pop());save()}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}

/* ---------- مدل ---------- */
function addNode(t,x,y,c=0){const n={id:'n'+uid++,t,x,y,c,note:''};S.nodes.push(n);return n}
function addEdge(a,b,k='link',l=''){if(a==b||S.edges.some(e=>e.a==a&&e.b==b&&e.k==k))return;S.edges.push({id:'e'+uid++,a,b,k,l})}
const lines=s=>(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
function spawn(src,count,i){
 const cx=src.reduce((s,n)=>s+n.x,0)/src.length,cy=src.reduce((s,n)=>s+n.y,0)/src.length;
 const mx=S.nodes.reduce((s,n)=>s+n.x,0)/S.nodes.length,my=S.nodes.reduce((s,n)=>s+n.y,0)/S.nodes.length;
 let base=Math.hypot(cx-mx,cy-my)<5?-Math.PI/2:Math.atan2(cy-my,cx-mx);
 const a=base+(i-(count-1)/2)*(count>6?.5:.75),r=210+(count>6?(i%2)*80:0);
 return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]}
function mk(src,t,c,i,n){const[x,y]=spawn(src,n,i);return addNode(t,x,y,c)}

/* ---------- ابزارهای تفکر ---------- */
const Q=[
 ['اجزا و ویژگی‌هایش چیست؟','part',1,0],['چه انواع یا دسته‌هایی دارد؟','type',1,1],
 ['مثال‌هایش؟','example',1,2],['چه چیزی باعث آن می‌شود؟ (علت)','cause',1,3],
 ['چه پیامدی دارد؟ (معلول)','cause',0,4],['کاربرد یا ارتباط با مفهومی دیگر؟','link',0,5]];
const T=[
{id:'expand',i:'fa-up-right-and-down-left-from-center',n:'بسط و گسترش',d:'با پرسش‌های راهنما، یک مفهوم را شاخه‌شاخه کن.',need:'1',
 async run([a]){
  const v=await ask('بسط «'+a.t+'»',Q.map(q=>({l:q[0],a:1})),'هر خط یک مفهوم. پرسش‌های بی‌جواب نادیده گرفته می‌شوند.');if(!v)return;
  const items=[];Q.forEach((q,i)=>lines(v[i]).forEach(t=>items.push([q,t])));if(!items.length)return;
  snap();items.forEach(([q,t],i)=>{const n=mk([a],t,q[3],i,items.length);q[2]?addEdge(n.id,a.id,q[1]):addEdge(a.id,n.id,q[1])})}},
{id:'analyze',i:'fa-magnifying-glass-chart',n:'تجزیه و تحلیل',d:'مفهوم را به اجزایش بشکن و نقش هر جزء را بنویس.',need:'1',
 async run([a]){
  const v=await ask('تجزیه‌ی «'+a.t+'»',[{l:'از چه اجزایی ساخته شده؟',a:1},{l:'نتیجهٔ تحلیل: اجزا چگونه با هم کار می‌کنند؟',a:1,p:'یادداشت روی مفهوم ذخیره می‌شود'}]);if(!v)return;
  const p=lines(v[0]);if(!p.length&&!v[1])return;snap();
  p.forEach((t,i)=>{const n=mk([a],t,1,i,p.length);addEdge(n.id,a.id,'part')});
  if(v[1])a.note=(a.note?a.note+'\n':'')+'تحلیل: '+v[1]}},
{id:'compare',i:'fa-scale-balanced',n:'مقایسه',d:'دو مفهوم را انتخاب کن؛ شباهت‌ها و تفاوت‌ها را بساز.',need:'2',
 async run([a,b]){
  const v=await ask('مقایسهٔ «'+a.t+'» و «'+b.t+'»',[{l:'ملاک مقایسه',p:'مثلاً: نحوهٔ عملکرد'},{l:'شباهت‌ها',a:1},{l:'تفاوت‌های «'+a.t+'»',a:1},{l:'تفاوت‌های «'+b.t+'»',a:1}]);if(!v)return;
  const s=lines(v[1]),da=lines(v[2]),db=lines(v[3]);snap();
  addEdge(a.id,b.id,'link','مقایسه'+(v[0]?': '+v[0]:''));
  s.forEach((t,i)=>{const n=mk([a,b],t,5,i,s.length);addEdge(n.id,a.id,'similar');addEdge(n.id,b.id,'similar')});
  [[a,da],[b,db]].forEach(([x,l])=>l.forEach((t,i)=>{const n=mk([x],t,2,i,l.length);addEdge(x.id,n.id,'link','ویژگی')}))}},
{id:'combine',i:'fa-code-merge',n:'ترکیب',d:'دو مفهوم یا بیشتر را انتخاب کن و مفهوم تازه‌ای از آن‌ها بساز.',need:'2+',
 async run(ns){
  const v=await ask('ترکیب '+ns.length+' مفهوم',[{l:'مفهوم جدید حاصل از ترکیب',p:'مثلاً: یادگیری فعال'},{l:'چه چیزی از هر کدام گرفته شد؟ (اختیاری)'}]);if(!v||!v[0])return;
  snap();const n=mk(ns,v[0],3,0,1);ns.forEach(x=>addEdge(x.id,n.id,'combine',v[1]));sel=new Set([n.id])}},
{id:'contrast',i:'fa-arrows-left-right',n:'تضادیابی',d:'ضد یا متضاد مفهوم را پیدا کن و محور تضاد را بنویس.',need:'1',
 async run([a]){
  const v=await ask('تضاد «'+a.t+'»',[{l:'متضاد یا مخالف آن چیست؟',a:1},{l:'محور تضاد: از چه نظر متضادند؟',p:'مثلاً: عمق درک'}]);if(!v)return;
  const o=lines(v[0]);if(!o.length)return;snap();
  o.forEach((t,i)=>{const n=mk([a],t,4,i,o.length);addEdge(a.id,n.id,'contrast',v[1])})}},
{id:'relation',i:'fa-plus-minus',n:'رابطهٔ مستقیم و معکوس',d:'دو مفهوم را انتخاب کن؛ بسنج با افزایش یکی، دیگری چه می‌شود.',need:'2',
 async run([a,b]){
  const v=await ask('رابطهٔ «'+a.t+'» با «'+b.t+'»',[{l:'نوع رابطه',s:['مستقیم: هر دو با هم زیاد/کم می‌شوند','معکوس: یکی زیاد شود، دیگری کم می‌شود']},{l:'شرح رابطه',p:'هرچه … بیشتر شود، … '}]);if(!v)return;
  snap();addEdge(a.id,b.id,v[0]=='1'?'inverse':'direct',v[1])}}
];
const okSel=t=>t.need=='1'?sel.size==1:t.need=='2'?sel.size==2:sel.size>=2;
async function runTool(id){
 const t=T.find(x=>x.id==id);
 if(!okSel(t))return toast({'1':'برای این ابزار یک مفهوم را انتخاب کن.','2':'برای این ابزار دقیقاً دو مفهوم را انتخاب کن (Shift یا دکمهٔ چندانتخابی).','2+':'برای ترکیب دست‌کم دو مفهوم را انتخاب کن.'}[t.need]);
 await t.run([...sel].map(nd));save();all();fitIfNeeded()}

/* ---------- پنجرهٔ پرسش ---------- */
function ask(title,fields,sub=''){return new Promise(res=>{
 const m=$('#md');
 m.innerHTML=`<form class="mc"><h3>${esc(title)}</h3><p>${esc(sub)}</p>${fields.map((f,i)=>`<label>${esc(f.l)}${f.s?`<select name="f${i}">${f.s.map((o,j)=>`<option value="${j}">${esc(o)}</option>`).join('')}</select>`:f.a?`<textarea name="f${i}" rows="2" placeholder="${esc(f.p||'هر خط یک مفهوم')}"></textarea>`:`<input name="f${i}" value="${esc(f.v||'')}" placeholder="${esc(f.p||'')}">`}</label>`).join('')}<div class="ac"><button class="b pr">تایید</button><button type="button" class="b" id="mx">انصراف</button></div></form>`;
 m.hidden=false;const fm=m.firstChild;fm.querySelector('input,textarea,select').focus();
 const done=v=>{m.hidden=true;m.innerHTML='';res(v)};
 fm.onsubmit=e=>{e.preventDefault();done(fields.map((_,i)=>fm['f'+i].value.trim()))};
 $('#mx').onclick=()=>done(null)})}

/* ---------- رسم ---------- */
function wrap(t){const w=String(t).split(/\s+/),r=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>16&&c){r.push(c);c=x}else c=(c+' '+x).trim()});if(c)r.push(c);return r.slice(0,3)}
function dims(n){const l=wrap(n.t);return{l,w:Math.max(84,Math.max(...l.map(x=>x.length))*9.6+30),h:24+l.length*21}}
function pt(n,tx,ty){const d=dims(n),dx=tx-n.x,dy=ty-n.y;const s=Math.min(dx?(d.w/2+4)/Math.abs(dx):1e9,dy?(d.h/2+4)/Math.abs(dy):1e9);return[n.x+dx*s,n.y+dy*s]}
function inner(ex){
 const defs=Object.entries(K).filter(([,k])=>k.a).map(([id,k])=>`<marker id="m-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10z" fill="${k.c}"/></marker>`).join('');
 const E=S.edges.map(e=>{const a=nd(e.a),b=nd(e.b);if(!a||!b)return'';const k=K[e.k],p=pt(a,b.x,b.y),q=pt(b,a.x,a.y);
  const lb=(k.s?k.s+' ':'')+(e.l||(k.s?'':k.n)),mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,on=!ex&&selE==e.id;
  return`<g data-e="${e.id}"><line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="transparent" stroke-width="16"/><line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${k.c}" stroke-width="${on?4:2.2}" ${k.d?`stroke-dasharray="${k.d}"`:''} ${k.a?`marker-end="url(#m-${e.k})"`:''}/>`+
  (lb.trim()?`<rect x="${mx-lb.length*3.6-8}" y="${my-11}" width="${lb.length*7.2+16}" height="22" rx="11" fill="#0f172a" stroke="${k.c}"/><text x="${mx}" y="${my+4.5}" text-anchor="middle" font-size="12" fill="${k.c}" font-weight="700" font-family="Vazirmatn,Tahoma,sans-serif">${esc(lb)}</text>`:'')+'</g>'}).join('');
 const N=S.nodes.map(n=>{const d=dims(n),c=PAL[n.c%PAL.length],on=!ex&&sel.has(n.id);
  return`<g data-n="${n.id}" transform="translate(${n.x} ${n.y})" style="cursor:grab"><title>${esc(n.note)}</title><rect x="${-d.w/2}" y="${-d.h/2}" width="${d.w}" height="${d.h}" rx="14" fill="${c}30" stroke="${on?'#fff':c}" stroke-width="${on?3:1.8}"/>`+
  d.l.map((x,i)=>`<text y="${(i-(d.l.length-1)/2)*21+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc" font-family="Vazirmatn,Tahoma,sans-serif">${esc(x)}</text>`).join('')+(n.note?`<circle cx="${d.w/2-6}" cy="${-d.h/2+6}" r="4" fill="#fbbf24"/>`:'')+'</g>'}).join('');
 return`<defs>${defs}</defs>${E}${N}`}
function render(){cv.innerHTML=`<g transform="translate(${S.v.x} ${S.v.y}) scale(${S.v.k})">${inner()}</g>`;$('#start').hidden=!!S.nodes.length;$('#bUndo').disabled=!hist.length;$('#bRedo').disabled=!fut.length;cv.classList.toggle('arm',!!arm);$('#bMulti').classList.toggle('on',multi)}
function fit(){if(!S.nodes.length)return;const r=cv.getBoundingClientRect();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 S.nodes.forEach(n=>{const d=dims(n);x0=Math.min(x0,n.x-d.w/2);x1=Math.max(x1,n.x+d.w/2);y0=Math.min(y0,n.y-d.h/2);y1=Math.max(y1,n.y+d.h/2)});
 const pad=50,k=Math.min(1.2,(r.width-pad*2)/Math.max(x1-x0,1),(r.height-pad*2)/Math.max(y1-y0,1));
 S.v={k,x:r.width/2-k*(x0+x1)/2,y:r.height/2-k*(y0+y1)/2};render()}
function fitIfNeeded(){const r=cv.getBoundingClientRect();if(S.nodes.some(n=>{const x=n.x*S.v.k+S.v.x,y=n.y*S.v.k+S.v.y;return x<30||y<30||x>r.width-30||y>r.height-30}))fit()}
function layout(){if(!S.nodes.length)return;snap();
 const adj=id=>S.edges.flatMap(e=>e.a==id?[e.b]:e.b==id?[e.a]:[]),deg=n=>adj(n.id).length,seen=new Set();let ox=0;
 [...S.nodes].sort((a,b)=>deg(b)-deg(a)).forEach(r=>{if(seen.has(r.id))return;seen.add(r.id);const lv=[[r.id]];
  for(let i=0;i<lv.length;i++){const nx=[];lv[i].forEach(id=>adj(id).forEach(j=>{if(!seen.has(j)){seen.add(j);nx.push(j)}}));if(nx.length)lv.push(nx)}
  let pr=0,mr=0;lv.forEach((l,i)=>{const R=i?Math.max(pr+190,l.length*140/6.283):0;pr=R;mr=R;
   l.forEach((id,j)=>{const a=6.283*j/l.length+i*.6;nd(id).x=ox+R*Math.cos(a);nd(id).y=R*Math.sin(a)})});
  ox+=mr*2+320});
 save();fit()}

/* ---------- تعامل ---------- */
const ptr=new Map();let drag=null,pin=0;
const w2s=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left-S.v.x)/S.v.k,(e.clientY-r.top-S.v.y)/S.v.k]};
function zoomAt(cx,cy,f){const r=cv.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,nk=Math.min(2.5,Math.max(.25,S.v.k*f));f=nk/S.v.k;S.v.x=px-(px-S.v.x)*f;S.v.y=py-(py-S.v.y)*f;S.v.k=nk}
function connect(from,to,k){snap();addEdge(from,to,k);arm=null;save();all();toast('پیوند ساخته شد — برای نوشتن توضیح، روی آن بزن.')}
cv.addEventListener('pointerdown',e=>{
 ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);
 if(ptr.size==2){drag=null;pin=0;return}
 const g=e.target.closest('[data-n]'),ed=e.target.closest('[data-e]');
 if(g){const id=g.dataset.n;
  if(arm){if(id!=arm.from)connect(arm.from,id,arm.k);return}
  selE=null;if(e.shiftKey||multi)sel.has(id)?sel.delete(id):sel.add(id);else if(!sel.has(id)){sel.clear();sel.add(id)}
  drag={t:'n',sx:e.clientX,sy:e.clientY,m:0,o:[...sel].map(i=>[i,nd(i).x,nd(i).y])};if(tab=='tools'&&sel.size==1&&false)tab='sel'}
 else if(ed){selE=ed.dataset.e;sel.clear();tab='sel';drag=null}
 else{arm=null;if(!multi)sel.clear();selE=null;drag={t:'p',sx:e.clientX,sy:e.clientY,vx:S.v.x,vy:S.v.y}}
 ui();render()});
cv.addEventListener('pointermove',e=>{
 if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size==2){const[p,q]=[...ptr.values()],d=Math.hypot(p.x-q.x,p.y-q.y);if(pin)zoomAt((p.x+q.x)/2,(p.y+q.y)/2,d/pin);pin=d;render();return}
 if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
 if(drag.t=='p'){S.v.x=drag.vx+dx;S.v.y=drag.vy+dy}
 else{if(!drag.m&&Math.hypot(dx,dy)>4){snap();drag.m=1}if(drag.m)drag.o.forEach(([i,x,y])=>{nd(i).x=x+dx/S.v.k;nd(i).y=y+dy/S.v.k})}
 render()});
const up=e=>{ptr.delete(e.pointerId);pin=0;if(drag&&drag.m)save();if(!ptr.size)drag=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.1:.91);render()},{passive:false});
cv.addEventListener('dblclick',async e=>{
 const g=e.target.closest('[data-n]');if(g)return editNode(g.dataset.n);
 if(e.target.closest('[data-e]'))return;
 const[x,y]=w2s(e),v=await ask('مفهوم جدید',[{l:'عنوان مفهوم'}]);if(v&&v[0]){snap();addNode(v[0],x,y,6);save();all()}});
async function editNode(id){const n=nd(id),v=await ask('ویرایش مفهوم',[{l:'عنوان',v:n.t}]);if(v&&v[0]){snap();n.t=v[0];save();all()}}
function del(){if(!sel.size&&!selE)return;snap();
 if(selE)S.edges=S.edges.filter(e=>e.id!=selE);
 S.nodes=S.nodes.filter(n=>!sel.has(n.id));S.edges=S.edges.filter(e=>nd(e.a)&&nd(e.b));sel.clear();selE=null;save();all()}
document.addEventListener('keydown',e=>{
 if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 if(e.key=='Delete'||e.key=='Backspace')del();
 if(e.ctrlKey&&e.key=='z')undo();if(e.ctrlKey&&e.key=='y')redo();if(e.key=='Escape'){arm=null;sel.clear();selE=null;all()}});

/* ---------- پنل ---------- */
const chips=(cur,attr='data-k')=>`<div class="chips">${Object.entries(K).map(([id,k])=>`<button class="chip ${cur==id?'on':''}" ${attr}="${id}" style="--c:${k.c}">${k.s?k.s+' ':''}${k.n}</button>`).join('')}</div>`;
function ui(){
 $$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab==tab));
 const P=$('#pc');let h='';
 if(tab=='tools'){
  h=`<p class="hn">${sel.size?'انتخاب‌شده: '+sel.size+' مفهوم. ':'ابتدا مفهوم(ها) را روی بوم انتخاب کن. '}هر ابزار، یک شیوهٔ فکر کردن را به چند پرسش ساده تبدیل می‌کند.</p>`+
  T.map(t=>`<button class="tool ${okSel(t)?'':'off'}" data-t="${t.id}"><i class="fa-solid ${t.i}"></i><b>${t.n}</b><span>${t.d}</span></button>`).join('')+
  `<h4>راهنمای رنگ پیوندها</h4>`+chips(null,'data-x')}
 else if(tab=='sel'){
  if(selE){const e=S.edges.find(x=>x.id==selE);if(e)h=`<h4>نوع پیوند</h4>${chips(e.k)}<h4>توضیح روی پیوند</h4><input class="f" data-f="label" value="${esc(e.l)}" placeholder="مثلاً: هرچه تمرین بیشتر، خطا کمتر"><button class="b w" data-a="swap"><i class="fa-solid fa-right-left"></i> برگرداندن جهت</button><button class="b w dg" data-a="del"><i class="fa-solid fa-trash"></i> حذف پیوند</button>`}
  else if(sel.size==1){const n=nd([...sel][0]);h=`<h4>عنوان مفهوم</h4><input class="f" data-f="text" value="${esc(n.t)}"><h4>رنگ</h4><div class="sw">${PAL.map((c,i)=>`<i data-col="${i}" class="${n.c==i?'on':''}" style="background:${c}"></i>`).join('')}</div><h4>یادداشت</h4><textarea class="f" rows="3" data-f="note" placeholder="توضیح، مثال یا نکته...">${esc(n.note)}</textarea><h4>اتصال به مفهوم دیگر</h4><p class="hn">نوع رابطه را بزن، سپس مفهوم مقصد را روی بوم بزن.</p>${chips(arm&&arm.k)}<button class="b w dg" data-a="del"><i class="fa-solid fa-trash"></i> حذف مفهوم</button>`}
  else if(sel.size>1){const a=[...sel].map(nd);h=`<p class="hn">${sel.size} مفهوم انتخاب شده. نوع رابطه را بزن تا از «${esc(a[0].t)}» به «${esc(a[1].t)}» وصل شود.</p>${chips(null)}<button class="b w dg" data-a="del"><i class="fa-solid fa-trash"></i> حذف انتخاب‌شده‌ها</button>`}
  else h=`<p class="hn">یک مفهوم یا یک پیوند را روی بوم بزن تا اینجا ویرایشش کنی. برای مفهوم تازه، روی بوم دوبار بزن یا + را بزن.</p>`}
 else if(tab=='an')h=analysis();
 else h=`<button class="b w" data-a="json"><i class="fa-solid fa-download"></i> ذخیره به‌صورت فایل (JSON)</button><button class="b w" data-a="load"><i class="fa-solid fa-upload"></i> بارگذاری فایل نقشه</button><button class="b w" data-a="png"><i class="fa-solid fa-image"></i> خروجی تصویر (PNG)</button><button class="b w" data-a="sample"><i class="fa-solid fa-lightbulb"></i> بارگذاری نقشهٔ نمونه</button><button class="b w dg" data-a="new"><i class="fa-solid fa-file"></i> نقشهٔ جدید</button><p class="hn">نقشه به‌طور خودکار در همین مرورگر ذخیره می‌شود.</p>`;
 P.innerHTML=h}
function analysis(){
 const N=S.nodes,E=S.edges;if(!N.length)return'<p class="hn">هنوز نقشه‌ای نساخته‌ای.</p>';
 const use={};E.forEach(e=>use[e.k]=(use[e.k]||0)+1);
 const deg={};N.forEach(n=>deg[n.id]=0);E.forEach(e=>{deg[e.a]++;deg[e.b]++});
 const seen=new Set();let comp=0;N.forEach(n=>{if(seen.has(n.id))return;comp++;const st=[n.id];seen.add(n.id);while(st.length){const x=st.pop();E.forEach(e=>{const y=e.a==x?e.b:e.b==x?e.a:null;if(y&&!seen.has(y)){seen.add(y);st.push(y)}})}});
 const cross=E.length-N.length+comp,sg=[];
 const iso=N.filter(n=>!deg[n.id]),leaf=N.filter(n=>deg[n.id]==1);
 iso.slice(0,3).forEach(n=>sg.push(`«${esc(n.t)}» به هیچ مفهومی وصل نیست. آن را به نقشه ربط بده.`));
 leaf.slice(0,2).forEach(n=>sg.push(`«${esc(n.t)}» فقط یک ارتباط دارد. با ابزار «بسط» یا «تضادیابی» گسترشش بده.`));
 if(!use.contrast)sg.push('هنوز تضادی نساخته‌ای. ضد یکی از مفاهیم چیست؟');
 if(!use.direct&&!use.inverse)sg.push('رابطهٔ مستقیم یا معکوس میان دو مفهوم بساز: با افزایش یکی، دیگری چه می‌شود؟');
 if(!use.cause)sg.push('علت و معلول در نقشه نیست. چه چیزی باعث چه چیزی می‌شود؟');
 if(N.length>4&&cross<1)sg.push('نقشه درخت‌گونه است. یک پیوند عرضی میان دو شاخهٔ دور از هم، نشانهٔ درک عمیق‌تر است.');
 const nl=E.filter(e=>['direct','inverse','link'].includes(e.k)&&!e.l).length;if(nl)sg.push(`${nl} پیوند بدون توضیح داری. نوشتن «چرا؟» روی پیوند، درک را محکم‌تر می‌کند.`);
 if(!sg.length)sg.push('نقشه متنوع و به‌هم‌پیوسته است. حالا یک مفهوم را از حافظه توضیح بده و با نقشه مقایسه کن.');
 const mx=Math.max(1,...Object.values(use));
 return`<div class="stat"><div><b>${N.length}</b>مفهوم</div><div><b>${E.length}</b>پیوند</div><div><b>${Math.max(0,cross)}</b>پیوند عرضی</div></div><h4>تنوع روابط</h4>`+
 Object.entries(K).map(([id,k])=>`<div style="font-size:12.5px;color:${use[id]?'#e2e8f0':'#64748b'}">${k.n} <b>${use[id]||0}</b></div><div class="bar"><i style="width:${(use[id]||0)/mx*100}%;background:${k.c}"></i></div>`).join('')+`<h4>پیشنهادها</h4>`+sg.map(s=>`<div class="sg">${s}</div>`).join('')}

$('#pc').addEventListener('click',e=>{
 const t=e.target.closest('[data-t]'),k=e.target.closest('[data-k]'),a=e.target.closest('[data-a]'),c=e.target.closest('[data-col]');
 if(t)runTool(t.dataset.t);
 if(c){snap();nd([...sel][0]).c=+c.dataset.col;save();all()}
 if(k){const kk=k.dataset.k;
  if(selE){snap();S.edges.find(x=>x.id==selE).k=kk;save();all()}
  else if(sel.size>=2){const[x,y]=[...sel];connect(x,y,kk);sel=new Set([x,y])}
  else if(sel.size==1){arm={from:[...sel][0],k:kk};toast('حالا مفهوم مقصد را روی بوم بزن.');if(innerWidth<=820)$('#panel').classList.add('min');all()}}
 if(a)act(a.dataset.a)});
$('#pc').addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;snap();
 if(selE){const x=S.edges.find(q=>q.id==selE);if(f=='label')x.l=e.target.value.trim()}
 else{const n=nd([...sel][0]);if(f=='text'&&e.target.value.trim())n.t=e.target.value.trim();if(f=='note')n.note=e.target.value.trim()}
 save();render()});
$$('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(innerWidth<=820)$('#panel').classList.remove('min');ui()});
function all(){render();ui()}

/* ---------- فایل و نمونه ---------- */
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function act(a){
 if(a=='del')del();
 if(a=='swap'){const e=S.edges.find(x=>x.id==selE);snap();[e.a,e.b]=[e.b,e.a];save();all()}
 if(a=='json')dl('concept-map.json',new Blob([cur()],{type:'application/json'}));
 if(a=='load')$('#fi').click();
 if(a=='sample')sample();
 if(a=='new'&&confirm('نقشهٔ فعلی پاک شود؟')){snap();S.nodes=[];S.edges=[];sel.clear();selE=null;save();all()}
 if(a=='png'){if(!S.nodes.length)return toast('نقشه خالی است.');
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;S.nodes.forEach(n=>{const d=dims(n);x0=Math.min(x0,n.x-d.w/2);x1=Math.max(x1,n.x+d.w/2);y0=Math.min(y0,n.y-d.h/2);y1=Math.max(y1,n.y+d.h/2)});
  const p=40,w=x1-x0+p*2,h=y1-y0+p*2;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w*2}" height="${h*2}" viewBox="${x0-p} ${y0-p} ${w} ${h}"><rect x="${x0-p}" y="${y0-p}" width="${w}" height="${h}" fill="#0f172a"/>${inner(1)}</svg>`;
  const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=w*2;c.height=h*2;c.getContext('2d').drawImage(im,0,0);c.toBlob(b=>dl('concept-map.png',b))};
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}}
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{snap();load(r.result);save();fit();toast('نقشه بارگذاری شد.')}catch(x){toast('فایل معتبر نیست.')}};r.readAsText(f);e.target.value=''};
function sample(){snap();S.nodes=[];S.edges=[];const P=[['یادگیری عمیق',0,0,0],['توجه',-300,-120,1],['خستگی ذهنی',-300,140,4],['درک مفهومی',300,-140,1],['حفظ طوطی‌وار',300,150,4],['تکرار فاصله‌دار',0,-260,2],['حافظهٔ بلندمدت',0,260,5]];
 const m={};P.forEach(([t,x,y,c])=>m[t]=addNode(t,x,y,c).id);
 addEdge(m['توجه'],m['یادگیری عمیق'],'direct','هرچه توجه بیشتر، یادگیری عمیق‌تر');
 addEdge(m['خستگی ذهنی'],m['یادگیری عمیق'],'inverse','هرچه خستگی بیشتر، کیفیت کمتر');
 addEdge(m['درک مفهومی'],m['یادگیری عمیق'],'part');
 addEdge(m['درک مفهومی'],m['حفظ طوطی‌وار'],'contrast','عمق پردازش');
 addEdge(m['تکرار فاصله‌دار'],m['حافظهٔ بلندمدت'],'cause');
 addEdge(m['حافظهٔ بلندمدت'],m['یادگیری عمیق'],'direct');
 addEdge(m['تکرار فاصله‌دار'],m['درک مفهومی'],'example','تمرین فعال');
 sel.clear();selE=null;save();all();fit()}

/* ---------- راه‌اندازی ---------- */
$('#sf').onsubmit=e=>{e.preventDefault();snap();addNode($('#sc').value.trim(),0,0,0);$('#sc').value='';save();sel=new Set([S.nodes[0].id]);tab='tools';all();fit()};
$('#sd').onclick=sample;
$('#bAdd').onclick=async()=>{const v=await ask('مفهوم جدید',[{l:'عنوان مفهوم'}]);if(v&&v[0]){const r=cv.getBoundingClientRect();snap();const n=addNode(v[0],(r.width/2-S.v.x)/S.v.k+(Math.random()-.5)*80,(r.height/2-S.v.y)/S.v.k+(Math.random()-.5)*80,6);sel=new Set([n.id]);save();all();if(S.nodes.length==1)fit()}};
$('#bMulti').onclick=()=>{multi=!multi;toast(multi?'چندانتخابی روشن شد.':'چندانتخابی خاموش شد.');render()};
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bLay').onclick=layout;$('#bFit').onclick=fit;
$('#pt').onclick=()=>$('#panel').classList.toggle('min');
addEventListener('resize',render);
try{const o=JSON.parse(localStorage.getItem('mp_concept_v1')||'null');if(o&&o.nodes){S=o;uid=o.uid||999;if(!S.v)S.v={x:0,y:0,k:1}}}catch(e){}
all();if(S.nodes.length)fit();else{const r=cv.getBoundingClientRect();S.v={x:r.width/2,y:r.height/2,k:1}}
</script>
