<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta name="description" content="مفهوم‌ساز مستر پلنر: نقشهٔ مفهومی با ابزارهای تفکر — بسط، مقایسه، ترکیب، تجزیه و تحلیل، تضادیابی، قیاس، پرسش‌سازی، زنجیرهٔ علّی و رابطهٔ مستقیم و معکوس؛ به‌همراه آزمون بازیابی، قالب‌های آماده و خروجی PNG/SVG." />

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

<style>
*{box-sizing:border-box}
:root{--bg:#0f172a;--p:#1e293b;--bd:#334155;--tx:#f8fafc;--mu:#94a3b8;--ac:#e8971f}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;overflow:hidden}
button,input,textarea,select{font-family:inherit;font-size:14px;color:var(--tx)}
.top{height:56px;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--p);border-bottom:1px solid var(--bd)}
.top h1{font-size:16px;margin:0;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top a{color:var(--ac);text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap}
.ib{width:38px;height:38px;border:1px solid var(--bd);background:#0f172a;border-radius:10px;cursor:pointer}
.ib:hover,.ib.on{border-color:var(--ac);color:var(--ac)}
.ib:disabled{opacity:.35;cursor:default}
.hstat{font-size:11px;color:var(--mu);border:1px solid var(--bd);border-radius:999px;padding:4px 10px;white-space:nowrap}
#app{display:grid;grid-template-columns:350px 1fr;height:calc(100dvh - 56px)}
#cvw{position:relative;overflow:hidden;background:radial-gradient(#334155 1px,transparent 1px) 0 0/26px 26px}
#cv{width:100%;height:100%;touch-action:none;display:block;direction:ltr}
#cv.arm{cursor:crosshair}
#rh{position:absolute;top:10px;right:50%;transform:translateX(50%);background:rgba(232,151,31,.14);border:1px solid var(--ac);color:#fbbf24;border-radius:999px;padding:5px 14px;font-size:12px;z-index:5;pointer-events:none;white-space:nowrap;max-width:92vw}
input[type=range]{accent-color:var(--ac)}
.panel{background:var(--p);border-left:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0}
.tabs button{flex:1;padding:12px 4px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font-weight:700;cursor:pointer}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
#pc{padding:14px;overflow:auto;flex:1}
.hn{font-size:13px;color:var(--mu);line-height:1.9;margin:0 0 12px}
.tool{display:grid;grid-template-columns:34px 1fr;column-gap:10px;width:100%;text-align:right;background:#0f172a;border:1.5px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.tool i{grid-row:span 2;align-self:center;font-size:20px;color:var(--ac);text-align:center}
.tool b{font-size:14px}.tool span{font-size:12px;color:var(--mu);line-height:1.6}
.tool:hover{border-color:var(--ac)}.tool.off{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{border:1.5px solid var(--c);color:var(--c);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.chip.on,.chip:hover{background:var(--c);color:#0f172a}
.chip.z{opacity:.4}
h4{margin:14px 0 6px;font-size:13.5px;color:#fbbf24}
.f{width:100%;background:#0f172a;border:1px solid var(--bd);border-radius:8px;padding:9px 10px;margin-bottom:8px}
.sw{display:flex;gap:8px;margin-bottom:12px}
.sw i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw i.on{border-color:#fff}
.b{background:#0f172a;border:1px solid var(--bd);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700;margin:0 0 8px}
.b:hover{border-color:var(--ac)}.b.pr{background:var(--ac);border-color:var(--ac);color:#fff}.b.dg{color:#f87171}
.b.w{width:100%;text-align:right}
.bar{height:8px;background:#0f172a;border-radius:4px;overflow:hidden;margin:3px 0 10px}.bar i{display:block;height:100%}
.sg{background:rgba(232,151,31,.1);border-right:4px solid var(--ac);border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:13px;line-height:1.8;color:#e2e8f0}
.stat{display:flex;gap:8px;margin-bottom:12px}.stat div{flex:1;background:#0f172a;border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--mu)}.stat b{display:block;font-size:20px;color:var(--tx)}
#md{position:fixed;inset:0;background:rgba(2,6,23,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
#md[hidden]{display:none}
.mc{background:var(--p);border:1px solid var(--bd);border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:90dvh;overflow:auto}
.mc h3{margin:0 0 6px}.mc p{margin:0 0 12px;font-size:13px;color:var(--mu)}
.mc label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}
.mc label>*{display:block;width:100%;margin-top:5px;background:#0f172a;border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
.ac{display:flex;gap:8px}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
#start .mc{pointer-events:auto;text-align:center}
#toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:#0b1120;border:1px solid var(--ac);border-radius:999px;padding:9px 18px;font-size:13px;z-index:60;max-width:92vw;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#pt{display:none}
@media(max-width:820px){
 #app{grid-template-columns:1fr}
 .panel{position:fixed;bottom:0;left:0;right:0;height:46dvh;border-top:1px solid var(--bd);border-left:0;z-index:20;transition:transform .25s}
 .panel.min{transform:translateY(calc(100% - 46px))}
 #pt{display:inline-block}
 .top h1{font-size:14px}
 .hstat{display:none}
 #rh{font-size:11px}
}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.top{overflow-x:auto;scrollbar-width:none}.top::-webkit-scrollbar{display:none}.top>*{flex-shrink:0}.top h1{flex:1 1 auto;min-width:70px;flex-shrink:1}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:1 0 auto;padding:12px 11px;white-space:nowrap}
#c3{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block;direction:ltr}
#c3[hidden],#t3[hidden],#sbw[hidden]{display:none}
#t3{position:absolute;top:10px;left:10px;display:flex;gap:6px;align-items:center;z-index:6;background:rgba(15,23,42,.82);border:1px solid var(--bd);border-radius:12px;padding:6px;max-width:calc(100% - 20px);flex-wrap:wrap}
#t3 select{background:#0f172a;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:12.5px}
#t3 .ib{width:32px;height:32px;font-size:13px}
#sbw{position:absolute;bottom:12px;left:12px;z-index:6;display:flex;gap:8px;align-items:center;background:rgba(15,23,42,.9);border:1px solid var(--ac);border-radius:999px;padding:6px 14px}
#sb{background:none;border:0;outline:0;width:200px;max-width:50vw}#sbc{font-size:12px;color:var(--mu);white-space:nowrap}
@media(max-width:820px){#t3{top:auto;bottom:calc(46dvh + 8px);left:8px}#sbw{bottom:calc(46dvh + 8px)}}
#start[hidden]{display:none}
@media(max-width:820px){#start{inset:0 0 46dvh 0;align-items:flex-start;overflow-y:auto;pointer-events:auto}#start .mc{margin:auto;max-height:none}}
</style>

<body>
<header class="top">
  <a href="index.html"><i class="fa-solid fa-arrow-right"></i> مستر پلنر</a>
  <h1>مفهوم‌ساز</h1>
  <span class="hstat" id="hstat">۰ مفهوم · ۰ پیوند</span>
  <button class="ib" id="bAdd" title="مفهوم جدید" aria-label="مفهوم جدید"><i class="fa-solid fa-plus"></i></button>
  <button class="ib" id="bMulti" title="چندانتخابی (برای لمس)" aria-label="چندانتخابی"><i class="fa-solid fa-object-group"></i></button>
  <button class="ib" id="bUndo" title="بازگشت (Ctrl+Z)" aria-label="بازگشت"><i class="fa-solid fa-rotate-left"></i></button>
  <button class="ib" id="bRedo" title="جلو (Ctrl+Y)" aria-label="جلو"><i class="fa-solid fa-rotate-right"></i></button>
  <button class="ib" id="bLay" title="چیدمان خودکار" aria-label="چیدمان خودکار"><i class="fa-solid fa-diagram-project"></i></button>
  <button class="ib" id="bZi" title="بزرگ‌نمایی" aria-label="بزرگ‌نمایی"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
  <button class="ib" id="bZo" title="کوچک‌نمایی" aria-label="کوچک‌نمایی"><i class="fa-solid fa-magnifying-glass-minus"></i></button>

  <button class="ib" id="bSearch" title="جست‌وجو (کلید /)" aria-label="جست‌وجو"><i class="fa-solid fa-magnifying-glass"></i></button>
  <button class="ib" id="bRecall" title="آزمون بازیابی — پنهان‌کردن عنوان‌ها (کلید R)" aria-label="آزمون بازیابی"><i class="fa-solid fa-eye-slash"></i></button>

<div id="app">
  <aside class="panel" id="panel">
    <div class="tabs">
      <button data-tab="tools">ابزارها</button>
      <button data-tab="sel">انتخاب</button>

  <div id="cvw">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg"></svg>
    <canvas id="c3" hidden aria-label="نمای سه‌بعدی نقشهٔ مفهومی"></canvas>
    <div id="t3" hidden><select id="l3" aria-label="چیدمان سه‌بعدی"><option value="force">چیدمان نیرویی</option><option value="layers">لایه‌ای (فاصله از مرکز)</option><option value="flow">جریان: ورودی ← خروجی</option><option value="importance">عمق = اهمیت</option><option value="sphere">کروی</option></select><button class="ib" id="b3r" title="چرخش خودکار" aria-label="چرخش خودکار"><i class="fa-solid fa-rotate"></i></button><button class="ib" id="b3l" title="برچسب مفاهیم" aria-label="برچسب مفاهیم"><i class="fa-solid fa-tag"></i></button><button class="ib" id="b3e" title="برچسب پیوندها" aria-label="برچسب پیوندها"><i class="fa-solid fa-font"></i></button><button class="ib" id="b3m" title="حلقهٔ حافظه" aria-label="حلقهٔ حافظه"><i class="fa-solid fa-brain"></i></button><button class="ib" id="b3c" title="بازنشانی دوربین" aria-label="بازنشانی دوربین"><i class="fa-solid fa-compress"></i></button></div>
    <div id="sbw" hidden><i class="fa-solid fa-magnifying-glass"></i><input id="sb" placeholder="جست‌وجوی مفهوم یا یادداشت…" aria-label="جست‌وجو"><span id="sbc"></span></div>
    <div id="rh" hidden>حالت بازیابی: عنوان‌ها پنهان‌اند — روی هر کارت بزن تا یادآوری کنی</div>
    <div id="start" hidden>
      <form class="mc" id="sf">
        <h3>نقشهٔ مفهومی‌ات را شروع کن</h3>
        <p>مفهوم مرکزی چیست؟ بعد با ابزارهای تفکر آن را گسترش بده.</p>
        <label>مفهوم مرکزی<input id="sc" placeholder="مثلاً: یادگیری عمیق" required></label>
        <div class="ac"><button class="b pr">ساخت نقشه</button><button type="button" class="b" id="sd">نقشهٔ نمونه</button></div>
        <p style="margin:12px 0 0;font-size:12px;color:var(--mu)">یا با یک قالب آماده شروع کن:</p>
        <div class="ac" style="flex-wrap:wrap;margin-top:6px">
          <button type="button" class="b" data-tpl0="water"><i class="fa-solid fa-droplet"></i> چرخهٔ آب</button>
          <button type="button" class="b" data-tpl0="success"><i class="fa-solid fa-seedling"></i> عوامل پیشرفت</button>
          <button type="button" class="b" data-tpl0="story"><i class="fa-solid fa-book-open"></i> ساختار داستان</button>
        </div>
      </form>
    </div>
  </div>
</div>
<div id="md" hidden></div>
<div id="toast"></div>
<input type="file" id="fi" accept=".json" hidden />

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K={
 direct:{n:'رابطه مستقیم',c:'#10b981',s:'+'},
 inverse:{n:'رابطه معکوس',c:'#ef4444',s:'−',d:'7 5'},
 cause:{n:'علت ← معلول',c:'#f59e0b',a:1},
 contrast:{n:'تضاد',c:'#ec4899',d:'3 5'},
 similar:{n:'شباهت',c:'#38bdf8'},
 part:{n:'جزئی از',c:'#a78bfa',a:1},
 type:{n:'نوعی از',c:'#6366f1',a:1},
 example:{n:'مثال برای',c:'#14b8a6',a:1},
 combine:{n:'ترکیب',c:'#fb923c',a:1},
 question:{n:'پرسش',c:'#60a5fa',d:'2 5'},
 analogy:{n:'قیاس',c:'#f472b6',d:'8 4'},
 link:{n:'ارتباط',c:'#94a3b8'}
};
const PAL=['#3b82f6','#10b981','#e8971f','#8b5cf6','#ec4899','#14b8a6','#94a3b8'];
let S={nodes:[],edges:[],v:{x:0,y:0,k:1},recall:false},sel=new Set(),selE=null,tab='tools',multi=false,arm=null,hist=[],fut=[],uid=1;
const revealed=new Set();
const cv=$('#cv'),nd=id=>S.nodes.find(n=>n.id==id);

/* ---------- ذخیره و بازگشت ---------- */
const cur=()=>JSON.stringify({nodes:S.nodes,edges:S.edges,uid});
function snap(){hist.push(cur());if(hist.length>60)hist.shift();fut=[]}
function load(j){const o=JSON.parse(j);S.nodes=o.nodes;S.edges=o.edges;uid=o.uid||S.nodes.length+S.edges.length+9;sel.clear();selE=null;arm=null;revealed.clear();all()}
function save(){try{localStorage.setItem('mp_concept_v1',JSON.stringify({...S,uid}))}catch(e){}}
function undo(){if(hist.length){fut.push(cur());load(hist.pop());save()}}
function redo(){if(fut.length){hist.push(cur());load(fut.pop());save()}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}

/* ---------- مدل ---------- */
function addNode(t,x,y,c=0){const n={id:'n'+uid++,t,x,y,c,note:'',imp:3};S.nodes.push(n);return n}
function addEdge(a,b,k='link',l=''){if(a==b||S.edges.some(e=>e.a==a&&e.b==b&&e.k==k))return;S.edges.push({id:'e'+uid++,a,b,k,l})}
const lines=s=>(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
function spawn(src,count,i){
 const cx=src.reduce((s,n)=>s+n.x,0)/src.length,cy=src.reduce((s,n)=>s+n.y,0)/src.length;
 const mx=S.nodes.reduce((s,n)=>s+n.x,0)/S.nodes.length,my=S.nodes.reduce((s,n)=>s+n.y,0)/S.nodes.length;
 let base=Math.hypot(cx-mx,cy-my)<5?-Math.PI/2:Math.atan2(cy-my,cx-mx);
 const a=base+(i-(count-1)/2)*(count>6?.5:.75),r=210+(count>6?(i%2)*80:0);
 return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]}
function mk(src,t,c,i,n){const[x,y]=spawn(src,n,i);return addNode(t,x,y,c)}

/* ---------- ابزارهای تفکر ---------- */
const Q=[
 ['اجزا و ویژگی‌هایش چیست؟','part',1,0],['چه انواع یا دسته‌هایی دارد؟','type',1,1],
 ['مثال‌هایش؟','example',1,2],['چه چیزی باعث آن می‌شود؟ (علت)','cause',1,3],
 ['چه پیامدی دارد؟ (معلول)','cause',0,4],['کاربرد یا ارتباط با مفهومی دیگر؟','link',0,5]];
const T=[
{id:'expand',i:'fa-up-right-and-down-left-from-center',n:'بسط و گسترش',d:'با پرسش‌های راهنما، یک مفهوم را شاخه‌شاخه کن.',need:'1',
 async run([a]){
  const v=await ask('بسط «'+a.t+'»',Q.map(q=>({l:q[0],a:1})),'هر خط یک مفهوم. پرسش‌های بی‌جواب نادیده گرفته می‌شوند.');if(!v)return;
  const items=[];Q.forEach((q,i)=>lines(v[i]).forEach(t=>items.push([q,t])));if(!items.length)return;
  snap();items.forEach(([q,t],i)=>{const n=mk([a],t,q[3],i,items.length);q[2]?addEdge(n.id,a.id,q[1]):addEdge(a.id,n.id,q[1])})}},
{id:'analyze',i:'fa-magnifying-glass-chart',n:'تجزیه و تحلیل',d:'مفهوم را به اجزایش بشکن و نقش هر جزء را بنویس.',need:'1',
 async run([a]){
  const v=await ask('تجزیه‌ی «'+a.t+'»',[{l:'از چه اجزایی ساخته شده؟',a:1},{l:'نتیجهٔ تحلیل: اجزا چگونه با هم کار می‌کنند؟',a:1,p:'یادداشت روی مفهوم ذخیره می‌شود'}]);if(!v)return;
  const p=lines(v[0]);if(!p.length&&!v[1])return;snap();
  p.forEach((t,i)=>{const n=mk([a],t,1,i,p.length);addEdge(n.id,a.id,'part')});
  if(v[1])a.note=(a.note?a.note+'\n':'')+'تحلیل: '+v[1]}},
{id:'compare',i:'fa-scale-balanced',n:'مقایسه',d:'دو مفهوم را انتخاب کن؛ شباهت‌ها و تفاوت‌ها را بساز.',need:'2',
 async run([a,b]){
  const v=await ask('مقایسهٔ «'+a.t+'» و «'+b.t+'»',[{l:'ملاک مقایسه',p:'مثلاً: نحوهٔ عملکرد'},{l:'شباهت‌ها',a:1},{l:'تفاوت‌های «'+a.t+'»',a:1},{l:'تفاوت‌های «'+b.t+'»',a:1}]);if(!v)return;
  const s=lines(v[1]),da=lines(v[2]),db=lines(v[3]);snap();
  addEdge(a.id,b.id,'link','مقایسه'+(v[0]?': '+v[0]:''));
  s.forEach((t,i)=>{const n=mk([a,b],t,5,i,s.length);addEdge(n.id,a.id,'similar');addEdge(n.id,b.id,'similar')});
  [[a,da],[b,db]].forEach(([x,l])=>l.forEach((t,i)=>{const n=mk([x],t,2,i,l.length);addEdge(x.id,n.id,'link','ویژگی')}))}},
{id:'combine',i:'fa-code-merge',n:'ترکیب',d:'دو مفهوم یا بیشتر را انتخاب کن و مفهوم تازه‌ای از آن‌ها بساز.',need:'2+',
 async run(ns){

const okSel=t=>t.need=='1'?sel.size==1:t.need=='2'?sel.size==2:sel.size>=2;

/* ---------- پنجرهٔ پرسش ---------- */
function ask(title,fields,sub=''){return new Promise(res=>{
 const m=$('#md');
 m.innerHTML=`<form class="mc"><h3>${esc(title)}</h3><p>${esc(sub)}</p>${fields.map((f,i)=>`<label>${esc(f.l)}${f.s?`<select name="f${i}">${f.s.map((o,j)=>`<option value="${j}">${esc(o)}</option>`).join('')}</select>`:f.a?`<textarea name="f${i}" rows="2" placeholder="${esc(f.p||'هر خط یک مفهوم')}"></textarea>`:`<input name="f${i}" value="${esc(f.v||'')}" placeholder="${esc(f.p||'')}">`}</label>`).join('')}<div class="ac"><button class="b pr">تایید</button><button type="button" class="b" id="mx">انصراف</button></div></form>`;
 m.hidden=false;const fm=m.firstChild;fm.querySelector('input,textarea,select').focus();
 const done=v=>{m.hidden=true;m.innerHTML='';res(v)};
 fm.onsubmit=e=>{e.preventDefault();done(fields.map((_,i)=>fm['f'+i].value.trim()))};
 $('#mx').onclick=()=>done(null)})}

/* ---------- رسم ---------- */
function wrap(t){const w=String(t).split(/\s+/),r=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>16&&c){r.push(c);c=x}else c=(c+' '+x).trim()});if(c)r.push(c);return r.slice(0,3)}
function dims(n){const l=wrap(n.t);return{l,w:Math.max(84,Math.max(...l.map(x=>x.length))*9.6+30),h:24+l.length*21}}
function pt(n,tx,ty){const d=dims(n),dx=tx-n.x,dy=ty-n.y;const s=Math.min(dx?(d.w/2+4)/Math.abs(dx):1e9,dy?(d.h/2+4)/Math.abs(dy):1e9);return[n.x+dx*s,n.y+dy*s]}
function inner(ex){
 const defs=`<filter id="nsh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/></filter>`+Object.entries(K).filter(([,k])=>k.a).map(([id,k])=>`<marker id="m-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10z" fill="${k.c}"/></marker>`).join('');
 const E=S.edges.map(e=>{const a=nd(e.a),b=nd(e.b);if(!a||!b)return'';const k=K[e.k],p=pt(a,b.x,b.y),q=pt(b,a.x,a.y);
  const lb=(k.s?k.s+' ':'')+(e.l||(k.s?'':k.n)),mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,on=!ex&&selE==e.id;
  return`<g data-e="${e.id}"><line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="transparent" stroke-width="16"/><line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${k.c}" stroke-width="${on?4:2.2}" ${k.d?`stroke-dasharray="${k.d}"`:''} ${k.a?`marker-end="url(#m-${e.k})"`:''}/>`+
  (lb.trim()?`<rect x="${mx-lb.length*3.6-8}" y="${my-11}" width="${lb.length*7.2+16}" height="22" rx="11" fill="#0f172a" stroke="${k.c}"/><text x="${mx}" y="${my+4.5}" text-anchor="middle" font-size="12" fill="${k.c}" font-weight="700" font-family="Vazirmatn,Tahoma,sans-serif">${esc(lb)}</text>`:'')+'</g>'}).join('');
 const N=S.nodes.map(n=>{const d=dims(n),c=PAL[n.c%PAL.length],on=!ex&&sel.has(n.id),hid=!ex&&S.recall&&!revealed.has(n.id);
  return`<g data-n="${n.id}" transform="translate(${n.x} ${n.y})" style="cursor:grab"><title>${hid?'':esc(n.note)}</title><rect x="${-d.w/2}" y="${-d.h/2}" width="${d.w}" height="${d.h}" rx="14" fill="${hid?'transparent':c+'30'}" stroke="${on?'#f5b041':c}" stroke-width="${on?3:(1.7+(((n.imp||3)-3)*0.45))}" ${hid?'stroke-dasharray="6 4"':''} ${on?'filter="url(#nsh)"':''}/>`+
  d.l.map((x,i)=>`<text y="${(i-(d.l.length-1)/2)*21+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${hid?'transparent':'#f8fafc'}" font-family="Vazirmatn,Tahoma,sans-serif">${esc(x)}</text>`).join('')+
  (n.note&&!hid?`<circle cx="${d.w/2-6}" cy="${-d.h/2+6}" r="4" fill="#fbbf24"/>`:'')+
  (!ex&&(n.imp||3)>=4?`<circle cx="${-d.w/2+7}" cy="${-d.h/2+7}" r="7.5" fill="#fbbf24"/><text x="${-d.w/2+7}" y="${-d.h/2+10.5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">${n.imp}</text>`:'')+'</g>'}).join('');
 return`<defs>${defs}</defs>${E}${N}`}
function render(){cv.innerHTML=`<g transform="translate(${S.v.x} ${S.v.y}) scale(${S.v.k})">${inner()}</g>`;$('#start').hidden=!!S.nodes.length;$('#bUndo').disabled=!hist.length;$('#bRedo').disabled=!fut.length;cv.classList.toggle('arm',!!arm);$('#bMulti').classList.toggle('on',multi);$('#bRecall').classList.toggle('on',!!S.recall);$('#rh').hidden=!S.recall;const hs=$('#hstat');if(hs)hs.textContent=S.nodes.length+' مفهوم · '+S.edges.length+' پیوند'}
function fit(){if(!S.nodes.length)return;const r=cv.getBoundingClientRect();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 S.nodes.forEach(n=>{const d=dims(n);x0=Math.min(x0,n.x-d.w/2);x1=Math.max(x1,n.x+d.w/2);y0=Math.min(y0,n.y-d.h/2);y1=Math.max(y1,n.y+d.h/2)});
 const pad=50,k=Math.min(1.2,(r.width-pad*2)/Math.max(x1-x0,1),(r.height-pad*2)/Math.max(y1-y0,1));
 S.v={k,x:r.width/2-k*(x0+x1)/2,y:r.height/2-k*(y0+y1)/2};render()}
function fitIfNeeded(){const r=cv.getBoundingClientRect();if(S.nodes.some(n=>{const x=n.x*S.v.k+S.v.x,y=n.y*S.v.k+S.v.y;return x<30||y<30||x>r.width-30||y>r.height-30}))fit()}
function bounds(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;S.nodes.forEach(n=>{const d=dims(n);x0=Math.min(x0,n.x-d.w/2);x1=Math.max(x1,n.x+d.w/2);y0=Math.min(y0,n.y-d.h/2);y1=Math.max(y1,n.y+d.h/2)});return[x0,y0,x1,y1]}
function layout(){if(!S.nodes.length)return;snap();
 const adj=id=>S.edges.flatMap(e=>e.a==id?[e.b]:e.b==id?[e.a]:[]),deg=n=>adj(n.id).length,seen=new Set();let ox=0;
 [...S.nodes].sort((a,b)=>deg(b)-deg(a)).forEach(r=>{if(seen.has(r.id))return;seen.add(r.id);const lv=[[r.id]];
  for(let i=0;i<lv.length;i++){const nx=[];lv[i].forEach(id=>adj(id).forEach(j=>{if(!seen.has(j)){seen.add(j);nx.push(j)}}));if(nx.length)lv.push(nx)}
  let pr=0,mr=0;lv.forEach((l,i)=>{const R=i?Math.max(pr+190,l.length*140/6.283):0;pr=R;mr=R;
   l.forEach((id,j)=>{const a=6.283*j/l.length+i*.6;nd(id).x=ox+R*Math.cos(a);nd(id).y=R*Math.sin(a)})});
  ox+=mr*2+320});
 save();fit()}

/* ---------- تعامل ---------- */
const ptr=new Map();let drag=null,pin=0;
const w2s=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left-S.v.x)/S.v.k,(e.clientY-r.top-S.v.y)/S.v.k]};
function zoomAt(cx,cy,f){const r=cv.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,nk=Math.min(2.5,Math.max(.25,S.v.k*f));f=nk/S.v.k;S.v.x=px-(px-S.v.x)*f;S.v.y=py-(py-S.v.y)*f;S.v.k=nk}
function zoomStep(f){const r=cv.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f);render()}
function connect(from,to,k){snap();addEdge(from,to,k);arm=null;save();all();toast('پیوند ساخته شد — برای نوشتن توضیح، روی آن بزن.')}
cv.addEventListener('pointerdown',e=>{
 ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);
 if(ptr.size==2){drag=null;pin=0;return}
 const g=e.target.closest('[data-n]'),ed=e.target.closest('[data-e]');
 if(g){const id=g.dataset.n;
  if(S.recall&&!revealed.has(id)){revealed.add(id);render()}
  if(arm){if(id!=arm.from)connect(arm.from,id,arm.k);return}
  selE=null;if(e.shiftKey||multi)sel.has(id)?sel.delete(id):sel.add(id);else if(!sel.has(id)){sel.clear();sel.add(id)}
  drag={t:'n',sx:e.clientX,sy:e.clientY,m:0,o:[...sel].map(i=>[i,nd(i).x,nd(i).y])}}
 else if(ed){selE=ed.dataset.e;sel.clear();tab='sel';drag=null}
 else{arm=null;if(!multi)sel.clear();selE=null;drag={t:'p',sx:e.clientX,sy:e.clientY,vx:S.v.x,vy:S.v.y}}
 ui();render()});
cv.addEventListener('pointermove',e=>{
 if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size==2){const[p,q]=[...ptr.values()],d=Math.hypot(p.x-q.x,p.y-q.y);if(pin)zoomAt((p.x+q.x)/2,(p.y+q.y)/2,d/pin);pin=d;render();return}
 if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
 if(drag.t=='p'){S.v.x=drag.vx+dx;S.v.y=drag.vy+dy}
 else{if(!drag.m&&Math.hypot(dx,dy)>4){snap();drag.m=1}if(drag.m)drag.o.forEach(([i,x,y])=>{nd(i).x=x+dx/S.v.k;nd(i).y=y+dy/S.v.k})}
 render()});
const up=e=>{ptr.delete(e.pointerId);pin=0;if(drag&&drag.m)save();if(!ptr.size)drag=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.1:.91);render()},{passive:false});
cv.addEventListener('dblclick',async e=>{
 const g=e.target.closest('[data-n]');if(g)return editNode(g.dataset.n);
 if(e.target.closest('[data-e]'))return;
 const[x,y]=w2s(e),v=await ask('مفهوم جدید',[{l:'عنوان مفهوم'}]);if(v&&v[0]){snap();addNode(v[0],x,y,6);save();all()}});
async function editNode(id){const n=nd(id),v=await ask('ویرایش مفهوم',[{l:'عنوان',v:n.t}]);if(v&&v[0]){snap();n.t=v[0];save();all()}}
function del(){if(!sel.size&&!selE)return;snap();
 if(selE)S.edges=S.edges.filter(e=>e.id!=selE);
 S.nodes=S.nodes.filter(n=>!sel.has(n.id));S.edges=S.edges.filter(e=>nd(e.a)&&nd(e.b));sel.clear();selE=null;save();all()}
document.addEventListener('keydown',e=>{
 if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 if(e.key=='Delete'||e.key=='Backspace')del();
 if(e.ctrlKey&&e.key=='z')undo();if(e.ctrlKey&&e.key=='y')redo();if(e.key=='Escape'){arm=null;sel.clear();selE=null;all()}
 if((e.key=='r'||e.key=='R')&&!e.ctrlKey&&!e.metaKey){S.recall=!S.recall;if(!S.recall)revealed.clear();save();render();toast(S.recall?'آزمون بازیابی روشن شد':'آزمون بازیابی خاموش شد')}});

function analysis(){

 const seen=new Set();let comp=0;N.forEach(n=>{if(seen.has(n.id))return;comp++;const st=[n.id];seen.add(n.id);while(st.length){const x=st.pop();E.forEach(e=>{const y=e.a==x?e.b:e.b==x?e.a:null;if(y&&!seen.has(y)){seen.add(y);st.push(y)}})}});

 leaf.slice(0,2).forEach(n=>sg.push(`«${esc(n.t)}» فقط یک ارتباط دارد. با ابزار «بسط» یا «تضادیابی» گسترشش بده.`));
 if(!use.contrast)sg.push('هنوز تضادی نساخته‌ای. ضد یکی از مفاهیم چیست؟');
 if(!use.direct&&!use.inverse)sg.push('رابطهٔ مستقیم یا معکوس میان دو مفهوم بساز: با افزایش یکی، دیگری چه می‌شود؟');
 if(!use.cause)sg.push('علت و معلول در نقشه نیست. چه چیزی باعث چه چیزی می‌شود؟');
 if(!use.question)sg.push('با ابزار «پرسش‌سازی» دربارهٔ مفهوم مرکزی سؤال بساز؛ پرسش، ذهن را فعال می‌کند.');
 if(!use.analogy&&N.length>3)sg.push('یک «قیاس» بساز: مفهوم تازه را به چیزی آشنا تشبیه کن تا در حافظه بنشیند.');
 if(N.length>4&&cross<1)sg.push('نقشه درخت‌گونه است. یک پیوند عرضی میان دو شاخهٔ دور از هم، نشانهٔ درک عمیق‌تر است.');

 if(!sg.length)sg.push('نقشه متنوع و به‌هم‌پیوسته است. حالا با دکمهٔ چشم (آزمون بازیابی) عنوان‌ها را پنهان کن و نقشه را از حفظ توضیح بده.');
 const mx=Math.max(1,...Object.values(use));

 Object.entries(K).map(([id,k])=>`<div style="font-size:12.5px;color:${use[id]?'#e2e8f0':'#64748b'}">${k.n} <b>${use[id]||0}</b></div><div class="bar"><i style="width:${(use[id]||0)/mx*100}%;background:${k.c}"></i></div>`).join('')+
 (key.length?`<h4>مفاهیم کلیدی (اهمیت ۴ و ۵)</h4><div class="chips">${key.map(n=>`<button class="chip on" style="--c:#fbbf24;cursor:default">${esc(n.t)}</button>`).join('')}</div>`:'')+
 `<h4>پیشنهادها</h4>`+sg.map(s=>`<div class="sg">${s}</div>`).join('')}

function ioHtml(){return`<h4>قالب‌های درسی تازه</h4>${TPLS.map(t=>`<button class="b w" data-tpl="${t[0]}"><i class="fa-solid ${t[2]}"></i> ${t[1]}</button>`).join('')}<h4>ورودی</h4><button class="b w" data-ma="import"><i class="fa-solid fa-file-import"></i> ورود از متن / CSV / فهرست</button><p class="hn">فایل‌های json، csv، txt و md را می‌توانی روی بوم بکشی و رها کنی.</p><h4>خروجی‌های بیشتر</h4><button class="b w" data-ma="expmd"><i class="fa-solid fa-list"></i> طرح درسی (Markdown)</button><button class="b w" data-ma="expcsv"><i class="fa-solid fa-table"></i> جدول پیوندها (CSV)</button><button class="b w" data-ma="expnodes"><i class="fa-solid fa-table-list"></i> جدول مفاهیم (CSV)</button><button class="b w" data-ma="expcards"><i class="fa-solid fa-clone"></i> فلش‌کارت‌های مرور (CSV برای Anki)</button><button class="b w" data-ma="exprep"><i class="fa-solid fa-print"></i> گزارش چاپی (HTML)</button><button class="b w" data-ma="exp3d"><i class="fa-solid fa-cube"></i> تصویر نمای سه‌بعدی (PNG)</button><p class="hn">میان‌برها: ۳ نمای سه‌بعدی · F تمرکز بر همسایگان · / جست‌وجو. موقعیت سه‌بعدی مفاهیم در فایل JSON هم ذخیره می‌شود.</p>`}
function sceHtml(){return`<h4>اسکلت درس</h4><p class="hn">برای هر نوع درس، پرسش‌های راهنمای استاندارد را به‌صورت زیرمفهوم می‌سازد تا فقط پاسخ‌ها را پر کنی. یک مفهوم را انتخاب کن (یا خالی بگذار تا موضوع را بپرسد).</p><select id="scT" class="f">${Object.entries(SCAF).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select><button class="b w" data-ma="scaf"><i class="fa-solid fa-sitemap"></i> ساخت اسکلت درس</button>`}
function roleHtml(){const n=ndv([...sel][0]);return`<h4>نقش در مدل (ورودی–فرایند–خروجی)</h4><select class="f" data-f2="role"><option value="">خودکار (از جهت پیوندها)</option>${Object.entries(ROLE).map(([k,v])=>`<option value="${k}" ${n.role===k?'selected':''}>${v.n}</option>`).join('')}</select><p class="hn">نقش در نمای سه‌بعدی با نقطهٔ رنگی روی مفهوم دیده می‌شود.</p>${n.mem?`<p class="hn">حافظه: نیمه‌عمر ${n.mem.s.toFixed(1)} روز · ${n.mem.n} مرور</p>`:''}`}
$('#pc').addEventListener('click',e=>{const b=e.target.closest('[data-ma]');if(!b)return;const a=b.dataset.ma,A1=b.dataset.a1,A2=b.dataset.a2,A3=b.dataset.a3;
 if(a==='sel'){sel=new Set([A1]);selE=null;render();if(NEWTABS.includes(tab))renderTab();return}
 if(a==='pair'){if(A1!==A2){const es=S.edges.filter(x=>(x.a==A1&&x.b==A2)||(x.a==A2&&x.b==A1));if(es[0]){selE=es[0].id;sel.clear();tab='sel';all()}else{sel=new Set([A1,A2]);render();renderTab()}}return}
 if(a==='selids'){sel=new Set(A1.split(',').filter(ndv));render();renderTab();return}
 if(a==='hlpath'){const p=shortestPath([...sel][0],[...sel][1]);if(p){const s0=[...sel];clearHL();HL.dim=true;p.forEach(s=>{HL.edges.add(s.e.id);HL.nodes.set(s.from,'#fbbf24');HL.nodes.set(s.to,'#fbbf24')});render()}return}
 if(a==='hlloop'){const l=findLoops(gr())[+A1];if(l){clearHL();HL.dim=true;l.nodes.forEach(id=>HL.nodes.set(id,l.sign>0?'#10b981':'#38bdf8'));l.edges.forEach(id=>HL.edges.add(id));render()}return}
 if(a==='fx'){const src=[...sel][0],dir=+A1,res=simulateEffect(src,dir);clearHL();FX={src,dir,res};HL.nodes.set(src,'#38bdf8');res.forEach(r=>HL.nodes.set(r.id,r.sign>0?'#10b981':r.sign<0?'#ef4444':'#fbbf24'));render();renderTab();return}
 if(a==='clearhl'){clearHL();render();renderTab();return}
 if(a==='mltrain'){startML();renderTab();return}
 if(a==='mladd'){snap();addEdge(A1,A2,A3);ML.preds=ML.preds.filter(p=>!(p.a===A1&&p.b===A2));save();all();toast('پیوند افزوده شد — توضیحش را روی آن بنویس.');return}
 if(a==='mlrej'){ML.rej.add(rejKey(A1,A2));ML.preds=ML.preds.filter(p=>!(p.a===A1&&p.b===A2));renderTab();return}
 if(a==='mlcolor'&&ML.clusters){snap();ML.clusters.forEach((c,i)=>c.ids.forEach(id=>{const n=ndv(id);if(n)n.c=i%PAL.length}));save();all();toast('رنگ‌ها بر اساس خوشه‌ها تنظیم شد (Ctrl+Z برای بازگشت).');return}
 if(a==='mlimp'){snap();const g=gr(),pr=pagerank(g),o=[...pr.keys()].sort((x,y)=>pr[y]-pr[x]);o.forEach((i,r)=>{const p=r/Math.max(1,o.length-1);S.nodes[i].imp=p<.1?5:p<.25?4:p<.6?3:p<.85?2:1});save();all();toast('اهمیت‌ها از روی PageRank تنظیم شد.');return}
 if(a==='stustart'){const Q=studyQueue();STU.q=[...Q.due,...Q.nw].slice(0,10).map(n=>n.id);STU.i=0;STU.rev=false;STU.log=[];STU.on=true;STU.rg=rngm(Math.floor(Date.now()/MONE));stuSelect();render();renderTab();return}
 if(a==='sturev'){STU.rev=true;renderTab();return}
 if(a==='stugrade'){const n=ndv(STU.q[STU.i]);if(n)reviewNode(n,+A1);STU.log.push(+A1);STU.i++;STU.rev=false;save();stuSelect();render();renderTab();return}
 if(a==='stuend'){STU.on=false;renderTab();return}
 if(a==='scaf'){makeScaffold($('#scT').value);return}
 if(a==='import'){importDialog();return}
 if(a==='expmd')return dlText('concept-outline.md','﻿'+mdOutline(),'text/markdown');
 if(a==='expcsv')return dlText('concept-links.csv','﻿'+'from,to,kind,label\n'+S.edges.filter(x=>ndv(x.a)&&ndv(x.b)).map(x=>[ttl(x.a),ttl(x.b),x.k,x.l].map(q$).join(',')).join('\n'),'text/csv');
 if(a==='expnodes'){const r=roles();return dlText('concept-nodes.csv','﻿'+'title,importance,role,note\n'+S.nodes.map(n=>[n.t,n.imp||3,r[n.id]||'',n.note].map(q$).join(',')).join('\n'),'text/csv')}
 if(a==='expcards')return dlText('concept-flashcards.csv','﻿'+flashCSV(),'text/csv');
 if(a==='exprep')return dlText('concept-report.html',reportHTML(),'text/html');
 if(a==='exp3d'){if(!V3.on){setView(true)}draw3();c3.toBlob(bl=>dl('concept-3d.png',bl));return}});
$('#pc').addEventListener('input',e=>{const t=e.target;if(t.dataset.maRange==='mem'){memOff=+t.value;const m=$('#mday');if(m)m.textContent=memOff;if(V3.on)draw3()}});

 if(t.dataset.maRange==='mem'){renderTab()}});
function setView(on){V3.on=on;cv.style.display=on?'none':'block';c3.hidden=!on;$('#t3').hidden=!on;$('#bView').classList.toggle('on',on);
 if(on){const first=!S.nodes.some(hasP3);place3dNew();if(first)applyLayout(V3.mode,true);else{fit3();draw3()}loop3()}else{cancelAnimationFrame(V3.raf)}render()}

cw.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const x=importText(String(r.result),false);toast(x.err||`وارد شد: ${x.n} مفهوم، ${x.e} پیوند`)};r.readAsText(f)});

 if(NEWTABS.includes(tab)){renderTab();return}

addEventListener('resize',()=>{if(V3.on){fit3();draw3()}});

 if(e.key==='3')setView(!V3.on);if(e.key==='f'||e.key==='F')$('#bFocus').click();if(e.key==='/'){e.preventDefault();$('#bSearch').click()}});
$('#sf').insertAdjacentHTML('beforeend',`<div class="ac" style="flex-wrap:wrap;margin-top:6px">${TPLS.map(t=>`<button type="button" class="b" data-tpl1="${t[0]}"><i class="fa-solid ${t[2]}"></i> ${t[1].split(' (')[0]}</button>`).join('')}<button type="button" class="b" id="siT"><i class="fa-solid fa-file-import"></i> ورود از متن</button></div>`);
$$('[data-tpl1]').forEach(b=>b.onclick=()=>loadTpl(b.dataset.tpl1));$('#siT').onclick=importDialog;
render();ui();
